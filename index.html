    function timeAgo(dateStr) {
      try {
        var mins = Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
        if (mins < 1) return 'Just now';
        if (mins < 60) return mins + 'm ago';
        var hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + 'h ago';
        var days = Math.floor(hrs / 24);
        if (days < 30) return days + 'd ago';
        var mos = Math.floor(days / 30);
        if (days <= 90) return mos + ' mo ' + (days % 30) + 'd ago';
        return '3+ mo (' + days + 'd ago)';
      } catch (e) { return 'Recently'; }
    }

    // Detailed History Age Formatter: Minutes, Days, up to 3 Months & 3+ Months
    function formatHistoryAge(dateStr) {
      try {
        var diffMs = Math.max(0, Date.now() - new Date(dateStr).getTime());
        var totalMins = Math.floor(diffMs / 60000);
        var hrs = Math.floor(totalMins / 60);
        var days = Math.floor(hrs / 24);
        if (totalMins < 1) return 'Just now (0m)';
        if (totalMins < 60) return totalMins + ' min ago';
        if (hrs < 24) return hrs + 'h ' + (totalMins % 60) + 'm ago (' + totalMins + 'm)';
        if (days < 30) return days + ' day' + (days === 1 ? '' : 's') + ' ' + (hrs % 24) + 'h ago';
        var mos = Math.floor(days / 30);
        var remDays = days % 30;
        if (days <= 90) return mos + ' mo' + (remDays ? (' ' + remDays + 'd') : '') + ' (' + days + ' days ago)';
        return '3+ mo (' + days + ' days ago)';
      } catch (e) { return 'Unknown time'; }
    }

    function matchesHistoryWindow(dateStr, win) {
      if (!win || win === 'all') return true;
      var diffMs = Math.max(0, Date.now() - new Date(dateStr).getTime());
      var mins = diffMs / 60000;
      var days = mins / 1440;
      if (win === 'minutes') return mins <= 60;
      if (win === 'hours24') return days <= 1;
      if (win === 'days7') return days <= 7;
      if (win === 'days30') return days <= 30;
      if (win === 'months3') return days <= 92;
      if (win === 'above3m') return days > 92;
      return true;
    }

    function saveVaultState() {
      try {
        localStorage.setItem(STORAGE_FOLDER_HISTORY, JSON.stringify(state.folderHistory));
        localStorage.setItem(STORAGE_DELETED_VAULT, JSON.stringify(state.deletedVault));
        localStorage.setItem(STORAGE_FOLDER_MANIFEST, JSON.stringify(state.folderManifest));
      } catch (e) {
        // Trim oldest redundant MODIFIED snapshots first if localStorage quota is tight (keep DELETED/BACKUP/3m+)
        try {
          if (state.folderHistory.length > 60) {
            state.folderHistory = state.folderHistory.slice(0, 60);
            localStorage.setItem(STORAGE_FOLDER_HISTORY, JSON.stringify(state.folderHistory));
          }
          localStorage.setItem(STORAGE_DELETED_VAULT, JSON.stringify(state.deletedVault.slice(0, 50)));
          localStorage.setItem(STORAGE_FOLDER_MANIFEST, JSON.stringify(state.folderManifest));
        } catch (e2) {}
      }
    }

    function computeBotSignature(bot) {
      if (!bot) return '';
      var sample = (bot.rows || []).slice(0, 12).map(function (r) { return JSON.stringify(r); }).join('|');
      return [bot.name || '', bot.folder || 'General', (bot.columns || []).length, (bot.rows || []).length, sample].join('::');
    }

    function recordFolderSnapshot(bot, changeType, diffSummary, force) {
      if (!bot || !bot.id) return;
      var folder = bot.folder || 'General';
      var nowIso = new Date().toISOString();
      var sig = computeBotSignature(bot);
      var prevManifest = state.folderManifest[bot.id];

      // Auto-calculate human readable diff from manifest if not given
      if (!diffSummary) {
        if (!prevManifest) {
          diffSummary = 'Initial baseline (' + (bot.rows || []).length + ' rows, ' + (bot.columns || []).length + ' cols)';
        } else {
          var dr = (bot.rows || []).length - (prevManifest.rowCount || 0);
          var dc = (bot.columns || []).length - (prevManifest.colCount || 0);
          var parts = [];
          if (dr > 0) parts.push('+' + dr + ' row(s)');
          else if (dr < 0) parts.push(dr + ' row(s)');
          if (dc > 0) parts.push('+' + dc + ' col(s)');
          else if (dc < 0) parts.push(dc + ' col(s)');
          if (prevManifest.folder !== folder) parts.push('Moved: ' + prevManifest.folder + ' -> ' + folder);
          if (prevManifest.name !== bot.name) parts.push('Renamed: ' + prevManifest.name + ' -> ' + bot.name);
          if (!parts.length) parts.push('Updated cells (' + (bot.rows || []).length + ' rows)');
          diffSummary = parts.join(' · ');
        }
      }

      // Deduplicate rapid same-minute edits for the same bot unless forced (e.g. BACKUP / DELETED / IMPORT_EXCEL / RESTORED)
      var latestForBot = state.folderHistory.find(function (h) { return h.botId === bot.id; });
      if (!force && changeType === 'MODIFIED' && latestForBot && latestForBot.changeType === 'MODIFIED') {
        var ageSec = (Date.now() - new Date(latestForBot.timestamp).getTime()) / 1000;
        if (ageSec < 20 && latestForBot.rowCount === (bot.rows || []).length && latestForBot.colCount === (bot.columns || []).length) {
          latestForBot.timestamp = nowIso;
          latestForBot.diffSummary = diffSummary;
          latestForBot.botSnapshot = JSON.parse(JSON.stringify(bot));
          state.folderManifest[bot.id] = {
            id: bot.id, name: bot.name, folder: folder,
            rowCount: (bot.rows || []).length, colCount: (bot.columns || []).length,
            hash: sig, updatedAt: nowIso
          };
          saveVaultState();
          return;
        }
      }

      var snap = {
        id: 'fh_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        folder: folder,
        botId: bot.id,
        botName: bot.name,
        changeType: changeType || 'MODIFIED',
        timestamp: nowIso,
        actor: getCurrentActor(),
        rowCount: (bot.rows || []).length,
        colCount: (bot.columns || []).length,
        hash: sig,
        diffSummary: diffSummary,
        botSnapshot: JSON.parse(JSON.stringify(bot))
      };
      state.folderHistory.unshift(snap);
      if (state.folderHistory.length > 180) {
        // Keep up to 180 snapshots; preserve DELETED, FOLDER_DELETED, BACKUP, RESTORED, IMPORT_EXCEL longest
        state.folderHistory = state.folderHistory.slice(0, 180);
      }

      if (changeType !== 'DELETED' && changeType !== 'FOLDER_DELETED') {
        state.folderManifest[bot.id] = {
          id: bot.id, name: bot.name, folder: folder,
          rowCount: (bot.rows || []).length, colCount: (bot.columns || []).length,
          hash: sig, updatedAt: nowIso
        };
      }
      saveVaultState();
    }

    function ensureInitialFolderManifest() {
      var changed = false;
      state.bots.forEach(function (b) {
        if (!state.folderManifest[b.id]) {
          state.folderManifest[b.id] = {
            id: b.id, name: b.name, folder: b.folder || 'General',
            rowCount: (b.rows || []).length, colCount: (b.columns || []).length,
            hash: computeBotSignature(b), updatedAt: b.updatedAt || new Date().toISOString()
          };
          changed = true;
        }
      });
      if (state.folderHistory.length === 0 && state.bots.length > 0) {
        state.bots.forEach(function (b) {
          state.folderHistory.push({
            id: 'fh_init_' + b.id,
            folder: b.folder || 'General',
            botId: b.id,
            botName: b.name,
            changeType: 'BACKUP',
            timestamp: b.updatedAt || new Date().toISOString(),
            actor: b.createdBy || getCurrentActor(),
            rowCount: (b.rows || []).length,
            colCount: (b.columns || []).length,
            hash: computeBotSignature(b),
            diffSummary: 'Initial folder backup baseline (' + (b.rows || []).length + ' rows)',
            botSnapshot: JSON.parse(JSON.stringify(b))
          });
        });
        changed = true;
      }
      if (changed) saveVaultState();
    }

    function analyzeFolderHealth() {
      ensureInitialFolderManifest();
      var currentMap = {};
      var folderSet = {};
      state.bots.forEach(function (b) {
        currentMap[b.id] = b;
        folderSet[b.folder || 'General'] = true;
      });
      Object.keys(state.folderManifest).forEach(function (bid) {
        var m = state.folderManifest[bid];
        if (m && m.folder) folderSet[m.folder] = true;
      });
      state.deletedVault.forEach(function (d) { if (d.folder) folderSet[d.folder] = true; });
      state.folderHistory.forEach(function (h) { if (h.folder) folderSet[h.folder] = true; });

      var foldersOut = [];
      var missingFolders = 0, missingFiles = 0, changedFiles = 0, healthyFiles = 0;

      Object.keys(folderSet).sort().forEach(function (fname) {
        var items = [];
        var activeInFolder = state.bots.filter(function (b) { return (b.folder || 'General') === fname; });
        var seenIds = {};

        // 1. Active files in this folder
        activeInFolder.forEach(function (b) {
          seenIds[b.id] = true;
          var latestBackup = state.folderHistory.find(function (h) {
            return h.botId === b.id && (h.changeType === 'BACKUP' || h.changeType === 'CREATED' || h.changeType === 'IMPORT_EXCEL' || h.changeType === 'RESTORED');
          });
          var sigNow = computeBotSignature(b);
          var isChanged = latestBackup && latestBackup.hash && latestBackup.hash !== sigNow;
          var diffText = 'Matches backup';
          if (isChanged) {
            changedFiles++;
            var dr = (b.rows || []).length - (latestBackup.rowCount || 0);
            diffText = 'Changed since backup (' + (dr >= 0 ? ('+' + dr) : dr) + ' rows, ' + timeAgo(b.updatedAt) + ')';
          } else {
            healthyFiles++;
          }
          items.push({
            status: isChanged ? 'CHANGED' : 'OK',
            botId: b.id, botName: b.name, folder: fname,
            rowCount: (b.rows || []).length, colCount: (b.columns || []).length,
            diffText: diffText, lastTime: b.updatedAt || new Date().toISOString(),
            latestSnapshot: state.folderHistory.find(function (h) { return h.botId === b.id; }) || null,
            prevBackupSnapshot: latestBackup || null
          });
        });

        // 2. Deleted / Missing files belonging to this folder
        state.deletedVault.forEach(function (dv) {
          if ((dv.folder || 'General') === fname && !currentMap[dv.botId] && !seenIds[dv.botId]) {
            seenIds[dv.botId] = true;
            missingFiles++;
            items.push({
              status: 'DELETED_FILE',
              botId: dv.botId, botName: dv.botName, folder: fname,
              rowCount: dv.rowCount || 0, colCount: dv.colCount || 0,
              diffText: (dv.reason || 'Deleted file') + ' · by ' + (dv.deletedBy || 'user'),
              lastTime: dv.deletedAt,
              trashItem: dv
            });
          }
        });

        // 3. Manifest entries that went missing without going through deletedVault (e.g. cloud purge / local wipe / moved)
        Object.keys(state.folderManifest).forEach(function (bid) {
          var mf = state.folderManifest[bid];
          if (mf && (mf.folder || 'General') === fname && !currentMap[bid] && !seenIds[bid]) {
            seenIds[bid] = true;
            missingFiles++;
            var snap = state.folderHistory.find(function (h) { return h.botId === bid && h.botSnapshot; });
            items.push({
              status: 'MISSING_FILE',
              botId: bid, botName: mf.name || bid, folder: fname,
              rowCount: mf.rowCount || 0, colCount: mf.colCount || 0,
              diffText: 'Missing from folder (last seen ' + formatHistoryAge(mf.updatedAt) + ')',
              lastTime: mf.updatedAt,
              latestSnapshot: snap || null
            });
          }
        });

        var isMissingFolder = activeInFolder.length === 0 && items.length > 0;
        if (isMissingFolder) missingFolders++;
        var histCount = state.folderHistory.filter(function (h) { return (h.folder || 'General') === fname; }).length;
        foldersOut.push({
          folderName: fname,
          isMissingFolder: isMissingFolder,
          activeCount: activeInFolder.length,
          missingCount: items.filter(function (it) { return it.status === 'DELETED_FILE' || it.status === 'MISSING_FILE'; }).length,
          changedCount: items.filter(function (it) { return it.status === 'CHANGED'; }).length,
          historyCount: histCount,
          items: items
        });
      });

      return {
        folders: foldersOut,
        summary: {
          totalFolders: foldersOut.length,
          missingFolders: missingFolders,
          missingFiles: missingFiles,
          changedFiles: changedFiles,
          healthyFiles: healthyFiles
        }
      };
    }

    function restoreBotFromSnapshot(snapData, targetFolder, modeLabel) {
      if (!snapData || !snapData.id) return null;
      var restored = JSON.parse(JSON.stringify(snapData));
      delete restored.isSampleSeed;
      if (targetFolder) restored.folder = targetFolder;
      restored.updatedAt = new Date().toISOString();
      restored.lastEditedBy = getCurrentActor();
      var rFolder = restored.folder || 'General';
      if (clearFolderTombstone(rFolder, restored.id)) {
        pushSharedSecurityState('restore_bot');
      }
      if ((state.customFolders || []).indexOf(rFolder) === -1) {
        state.customFolders.push(rFolder);
        saveCustomFolders();
      }
      var idx = state.bots.findIndex(function (b) { return b.id === restored.id; });
      if (idx >= 0) state.bots[idx] = restored;
      else state.bots.unshift(restored);
      state.deletedVault = state.deletedVault.filter(function (d) { return d.botId !== restored.id; });
      saveBotsLocal();
      recordFolderSnapshot(restored, 'RESTORED', modeLabel || ('Restored "' + restored.name + '" into folder "' + rFolder + '"'), true);
      recordAudit('ADD', restored, 'Restored "' + restored.name + '" (' + (restored.rows || []).length + ' rows) to folder "' + rFolder + '"', { source: 'Restore Vault' });
      pushBotToSupabase(restored);
      return restored;
    }

    function restoreFolderAllMissing(folderName) {
      if (!guardWriteAction('Restore Folder')) return 0;
      var count = 0;
      clearFolderTombstone(folderName, null);
      var currentMap = {};
      state.bots.forEach(function (b) { currentMap[b.id] = true; });
      var toRestore = state.deletedVault.filter(function (d) { return (d.folder || 'General') === folderName && !currentMap[d.botId]; });
      toRestore.forEach(function (d) {
        if (d.botSnapshot) {
          restoreBotFromSnapshot(d.botSnapshot, folderName, 'Folder restore "' + folderName + '"');
          currentMap[d.botId] = true;
          count++;
        }
      });
      // Also check folderHistory for any missing manifest file in this folder
      state.folderHistory.forEach(function (h) {
        if ((h.folder || 'General') === folderName && h.botSnapshot && !currentMap[h.botId]) {
          restoreBotFromSnapshot(h.botSnapshot, folderName, 'Folder history restore "' + folderName + '"');
          currentMap[h.botId] = true;
          count++;
        }
      });
      pushSharedSecurityState('restore_folder');
      renderApp();
      return count;
    }

    async function deleteFolderWithBackup(folderName) {
      if (!guardWriteAction('Delete Folder')) return 0;
      var rawTarget = String(folderName === undefined || folderName === null ? '' : folderName);
      var cleanTarget = rawTarget.trim() || 'General';
      if (cleanTarget.toLowerCase() === 'all') return 0;
      var targetLower = cleanTarget.toLowerCase();
      var targets = state.bots.filter(function (b) {
        return normalizeFolderName(b && b.folder).toLowerCase() === targetLower;
      });
      var targetIds = targets.map(function (t) { return t.id; });

      // Persist tombstones & local folder removal synchronously BEFORE any remote awaits
      markFolderDeletedTombstone(cleanTarget, targetIds);

      for (var i = 0; i < targets.length; i++) {
        var t = targets[i];
        state.deletedVault.unshift({
          id: 'del_' + Date.now() + '_' + i,
          folder: cleanTarget,
          botId: t.id,
          botName: t.name,
          deletedAt: new Date().toISOString(),
          deletedBy: getCurrentActor(),
          rowCount: (t.rows || []).length,
          colCount: (t.columns || []).length,
          reason: 'Folder "' + cleanTarget + '" deleted (backed up)',
          botSnapshot: JSON.parse(JSON.stringify(t))
        });
        recordFolderSnapshot(t, 'FOLDER_DELETED', 'Folder "' + cleanTarget + '" deleted (' + (t.rows || []).length + ' rows backed up)', true);
        recordAudit('DELETE', t, 'Deleted folder "' + cleanTarget + '" (backed up "' + t.name + '")');
      }
      if (targets.length === 0) {
        recordAudit('DELETE', null, 'Deleted empty folder "' + cleanTarget + '"');
      }
      state.deletedVault = state.deletedVault.slice(0, 120);
      var idSet = {};
      targets.forEach(function (t) { idSet[t.id] = true; });
      state.bots = state.bots.filter(function (b) { return !idSet[b.id]; });
      state.customFolders = (state.customFolders || []).filter(function (f) {
        var fk = String(f || '').trim().toLowerCase();
        return Boolean(fk) && fk !== targetLower;
      });
      if (state.collapsedFolders) {
        Object.keys(state.collapsedFolders).forEach(function (ck) {
          if (String(ck || '').trim().toLowerCase() === targetLower) delete state.collapsedFolders[ck];
        });
      }
      if (state.folderLastBotId) {
        Object.keys(state.folderLastBotId).forEach(function (fk) {
          if (String(fk || '').trim().toLowerCase() === targetLower) delete state.folderLastBotId[fk];
        });
      }
      if (state.adminConfig) {
        if (String(state.adminConfig.telegramDefaultFolder || '').trim().toLowerCase() === targetLower) {
          state.adminConfig.telegramDefaultFolder = '';
        }
        if (state.adminConfig.folderLocks) {
          Object.keys(state.adminConfig.folderLocks).forEach(function (lk) {
            if (String(lk || '').trim().toLowerCase() === targetLower) {
              delete state.adminConfig.folderLocks[lk];
            }
          });
        }
        saveAdminState();
      }
      if (idSet[state.activeBotId]) state.activeBotId = null;
      if (String(state.selectedFolder || '').trim().toLowerCase() === targetLower) state.selectedFolder = 'all';
      if (String(state.dashReportFolder || '').trim().toLowerCase() === targetLower) state.dashReportFolder = '';
      if (String(state.confirmDeleteFolder || '').trim().toLowerCase() === targetLower) state.confirmDeleteFolder = '';

      // Collapse remaining folders so deleting General or a blank folder does not auto-open/expand other user-created folders' files
      if (!state.collapsedFolders) state.collapsedFolders = {};
      getAllFolders().forEach(function (remFolder) {
        state.collapsedFolders[remFolder] = true;
      });

      saveBotsLocal();
      saveCustomFolders();
      saveVaultState();
      saveDeletedTombstones();
      broadcastLocalSync('delete_folder');
      renderApp();

      if (state.supabaseConfig.isConnected && targetIds.length > 0) {
        var sbClientForDel = getSbClient();
        if (sbClientForDel && !state.authSession) {
          try {
            var sessR = await sbClientForDel.auth.getSession();
            if (sessR && sessR.data && sessR.data.session && sessR.data.session.user) {
              state.authSession = { id: sessR.data.session.user.id, email: sessR.data.session.user.email };
            }
          } catch (e0) {}
        }
        if (sbClientForDel && state.authSession) {
          for (var di = 0; di < targetIds.length; di++) {
            try { await sbClientForDel.from('user_bots').delete().eq('id', targetIds[di]); } catch (e) {}
          }
        }
      }
      pushSharedSecurityState('delete_folder');
      return targets.length;
    }

    function createManualBackupCheckpoint() {
      var count = 0;
      state.bots.forEach(function (b) {
        recordFolderSnapshot(b, 'BACKUP', 'Manual full backup checkpoint (' + (b.rows || []).length + ' rows)', true);
        count++;
      });
      recordAudit('ADD', null, 'Created backup checkpoint for ' + count + ' bot file(s) across ' + getAllFolders().length + ' folder(s)', { source: 'Backup Vault' });
      saveVaultState();
      return count;
    }

    function parseNumSafe(val) {
      if (typeof val === 'number') return isFinite(val) ? val : NaN;
      if (val === undefined || val === null || val === '' || typeof val === 'boolean') return NaN;
      var s = String(val).replace(/[^0-9.-]/g, '');
      if (!s || s === '-' || s === '.' || s === '-.') return NaN;
      var n = parseFloat(s);
      return isFinite(n) ? n : NaN;
    }

    function evalSafeArithmetic(expr) {
      if (!expr) return NaN;
      var cleaned = String(expr).replace(/,/g, '').replace(/%/g, '/100').trim();
      if (!cleaned || !/^[0-9+\-*/().\s]+$/.test(cleaned)) return NaN;
      try {
        var res = (new Function('"use strict"; return (' + cleaned + ');'))();
        return (typeof res === 'number' && isFinite(res)) ? res : NaN;
      } catch (e) {
        return NaN;
      }
    }

    function validateCellFormulaSyntax(rawVal, col, bot) {
      var s = (rawVal !== undefined && rawVal !== null) ? String(rawVal).trim() : '';
      if (!s) return { valid: true, reason: '' };
      var isFormulaCol = Boolean(col && col.type === 'formula');
      var startsWithEq = s.charAt(0) === '=';
      if (!startsWithEq && !isFormulaCol) {
        return { valid: true, reason: '' };
      }
      if (!startsWithEq && isFormulaCol) {
        if (!isNaN(parseNumSafe(s))) return { valid: true, reason: '' };
        return { valid: false, reason: 'Formula cells must start with "=" (e.g. =Amount*2) or be a valid number.' };
      }
      var expr = s.slice(1).trim();
      if (!expr) {
        return { valid: false, reason: 'Formula expression after "=" cannot be empty.' };
      }
      var upper = expr.toUpperCase();
      if (upper === 'SUM_ALL' || upper === 'SUM(*)' || upper === 'SUM(ALL)') {
        return { valid: true, reason: '' };
      }
      var depth = 0;
      for (var i = 0; i < expr.length; i++) {
        var ch = expr.charAt(i);
        if (ch === '(') depth++;
        else if (ch === ')') {
          depth--;
          if (depth < 0) return { valid: false, reason: 'Unmatched closing parenthesis ")".' };
        }
      }
      if (depth !== 0) {
        return { valid: false, reason: 'Unclosed parenthesis "(".' };
      }
      var resolved = expr;
      if (bot && bot.columns) {
        var colsSorted = bot.columns.slice().sort(function (a, b) {
          return String(b.name || '').length - String(a.name || '').length;
        });
        colsSorted.forEach(function (oc) {
          if ((col && oc.id === col.id) || !oc.name) return;
          var escName = oc.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          resolved = resolved.replace(new RegExp('\\{' + escName + '\\}', 'gi'), '1');
          resolved = resolved.replace(new RegExp('(^|[^A-Za-z0-9_])' + escName + '(?=$|[^A-Za-z0-9_])', 'gi'), '$11');
        });
      }
      if (/[{}]/.test(resolved)) {
        return { valid: false, reason: 'Unknown or unclosed column reference "{...}".' };
      }
      var sumError = '';
      var prevResolved;
      do {
        prevResolved = resolved;
        resolved = resolved.replace(/SUM\s*\(([^()]*)\)/gi, function (_, inner) {
          var trimmedInner = String(inner || '').trim();
          if (!trimmedInner) {
            sumError = 'SUM() requires at least one argument.';
            return 'NaN';
          }
          var parts = trimmedInner.split(/[,;]/);
          for (var pi = 0; pi < parts.length; pi++) {
            var p = parts[pi].trim();
            if (!p || isNaN(evalSafeArithmetic(p))) {
              sumError = 'Invalid expression inside SUM(...).';
              return 'NaN';
            }
          }
          return '1';
        });
      } while (resolved !== prevResolved && !sumError);
      if (sumError) {
        return { valid: false, reason: sumError };
      }
      var val = evalSafeArithmetic(resolved);
      if (isNaN(val)) {
        return { valid: false, reason: 'Invalid formula syntax or unknown column name.' };
      }
      return { valid: true, reason: '' };
    }

    function evalFormulaCell(row, col, bot, depth) {
      var d = depth || 0;
      if (d > 4) return NaN;
      var raw = row ? row[col.id] : undefined;
      var rawStr = (raw !== undefined && raw !== null) ? String(raw).trim() : '';
      var expr = '';
      if (rawStr.charAt(0) === '=') {
        expr = rawStr.slice(1).trim();
      } else if (col && col.formulaExpr && String(col.formulaExpr).trim()) {
        expr = String(col.formulaExpr).trim().replace(/^=/, '').trim();
      } else {
        return parseNumSafe(raw);
      }
      if (!expr) return NaN;
      var upper = expr.toUpperCase();
      if (upper === 'SUM_ALL' || upper === 'SUM(*)' || upper === 'SUM(ALL)') {
        var rowTotal = 0, anyVal = false;
        if (bot && bot.columns) {
          bot.columns.forEach(function (oc) {
            if (oc.id !== col.id && (oc.type === 'amount' || oc.type === 'number')) {
              var v = parseNumSafe(row[oc.id]);
              if (!isNaN(v)) { rowTotal += v; anyVal = true; }
            }
          });
        }
        return anyVal ? rowTotal : NaN;
      }
      if (rawStr.charAt(0) !== '=' && bot && bot.columns) {
        var hasAnyNumInput = bot.columns.some(function (oc) {
          if (oc.id === col.id) return false;
          if (oc.type === 'amount' || oc.type === 'number') return !isNaN(parseNumSafe(row[oc.id]));
          if (oc.type === 'formula') {
            var ov = row[oc.id];
            return ov !== undefined && ov !== null && String(ov).trim() !== '';
          }
          return false;
        });
        if (!hasAnyNumInput) return NaN;
      }
      var resolved = expr;
      if (bot && bot.columns) {
        var colsSorted = bot.columns.slice().sort(function (a, b) {
          return String(b.name || '').length - String(a.name || '').length;
        });
        colsSorted.forEach(function (oc) {
          if (oc.id === col.id || !oc.name) return;
          var escName = oc.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          var valNum = getRowColNumeric(row, oc, bot, d + 1);
          var repVal = isNaN(valNum) ? '0' : String(valNum);
          resolved = resolved.replace(new RegExp('\\{' + escName + '\\}', 'gi'), repVal);
          resolved = resolved.replace(new RegExp('(^|[^A-Za-z0-9_])' + escName + '(?=$|[^A-Za-z0-9_])', 'gi'), '$1' + repVal);
        });
      }
      resolved = resolved.replace(/SUM\s*\(([^()]+)\)/gi, function (_, inner) {
        var parts = inner.split(/[,;]/);
        var s = 0;
        parts.forEach(function (p) {
          var v = evalSafeArithmetic(p);
          if (!isNaN(v)) s += v;
        });
        return String(s);
      });
      return evalSafeArithmetic(resolved);
    }

    function getRowColNumeric(row, col, bot, depth) {
      if (!row || !col) return NaN;
      if (col.type === 'formula') return evalFormulaCell(row, col, bot, depth || 0);
      if (col.type === 'amount' || col.type === 'number') return parseNumSafe(row[col.id]);
      return NaN;
    }

    function formatNumericValue(num, col) {
      var sym = col && col.currency && col.currency !== 'None' ? col.currency : '';
      var dec = (col && col.decimals !== undefined) ? col.decimals : (col && (col.type === 'amount' || col.type === 'formula') ? 2 : 0);
      var numStr = (col && col.thousandSeparator)
        ? num.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec })
        : num.toFixed(dec);
      return sym + numStr;
    }

    function formatCell(val, col, row, bot) {
      if (col && col.type === 'formula') {
        if (row && bot) {
          var fnum = evalFormulaCell(row, col, bot, 0);
          if (!isNaN(fnum)) return formatNumericValue(fnum, col);
        } else {
          var pnum = parseNumSafe(val);
          if (!isNaN(pnum)) return formatNumericValue(pnum, col);
        }
        if (val === undefined || val === null || val === '') return '';
        return String(val);
      }
      if (val === undefined || val === null || val === '') return '';
      if (col && col.type === 'date') {
        if (String(val).trim() === '') return '';
        return formatAutoDateStr(col, parseFlexibleDate(val, undefined, col));
      }
      if (col && (col.type === 'amount' || col.type === 'number')) {
        var num = parseNumSafe(val);
        if (isNaN(num)) return String(val);
        return formatNumericValue(num, col);
      }
      return String(val);
    }

            { id: 'col_date_' + id, name: 'Date', type: 'date', autoInsertDate: false, widthMultiplier: 1.1, currency: 'None', thousandSeparator: false, decimals: 0, style: { bold: false, italic: false, align: 'left', color: '#64748B', bgColor: '#FFFFFF' }, includeInGraph: false }

    // Supabase Cloud Helpers (UMD global window.supabase)
    function getSbClient() {
      if (state.sbClient) return state.sbClient;
      var cfg = state.supabaseConfig;
      if (cfg.url && cfg.anonKey && window.supabase && window.supabase.createClient) {
        try {
          state.sbClient = window.supabase.createClient(cfg.url, cfg.anonKey, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
          });
          if (!state.sbAuthSub && state.sbClient.auth && state.sbClient.auth.onAuthStateChange) {
            state.sbAuthSub = state.sbClient.auth.onAuthStateChange(function (event, session) {
              state.authSession = session && session.user ? { id: session.user.id, email: session.user.email } : null;
              if (state.authSession && state.authSession.email) {
                localStorage.setItem(STORAGE_SB_EMAIL, state.authSession.email);
                state.supabaseConfig.userEmail = state.authSession.email;
              }
              if (event === 'PASSWORD_RECOVERY') {
                openModal('supabase', { recoveryMode: true, authTab: 'recovery', statusType: 'success', statusMsg: 'Password recovery verified! Enter your new password below.' });
                return;
              }
              if (event === 'SIGNED_IN') {
                recordAudit('AUTH', null, 'Signed in via Supabase (' + (state.authSession ? state.authSession.email : '') + ')', { source: 'Browser' });
                pullAndMergeSupabase('auth_signin');
              } else if (event === 'SIGNED_OUT') {
                state.syncStatus = state.supabaseConfig.isConnected ? 'auth_required' : 'local';
                renderApp();
              }
            });
          }
          return state.sbClient;
        } catch (e) { return null; }
      }
      return null;
    }

    async function pushSecurityConfigToSupabase(payload) {
      if (!state.supabaseConfig.isConnected) return false;
      var client = getSbClient();
      if (!client) return false;
      try {
        var sessRes = await client.auth.getSession();
        var user = sessRes && sessRes.data && sessRes.data.session && sessRes.data.session.user;
        if (!user) return false;
        state.authSession = { id: user.id, email: user.email };
        var cfgPayload = payload || buildSecuritySyncPayload('supabase');
        await client.from('user_bots').upsert({
          id: SECURITY_BOT_ID,
          user_id: user.id,
          bot_data: cfgPayload,
          updated_at: cfgPayload.updatedAt || new Date().toISOString()
        });
        return true;
      } catch (e) { return false; }
    }

    async function pullSecurityConfigFromSupabase() {
      if (!state.supabaseConfig.isConnected) return false;

      if (!client) return false;
      try {
        var sessRes = await client.auth.getSession();
        var user = sessRes && sessRes.data && sessRes.data.session && sessRes.data.session.user;

        if (!res.error && res.data && res.data.bot_data) {

    async function pushBotToSupabase(bot) {
      broadcastLocalSync('bot_update');
      if (!state.supabaseConfig.isConnected) return false;
      var client = getSbClient();
      if (!client) return false;
      state.syncStatus = 'syncing';
      renderHeaderSyncOnly();
      try {
        var sessRes = await client.auth.getSession();
        var user = sessRes && sessRes.data && sessRes.data.session && sessRes.data.session.user;
        if (!user) {
          state.authSession = null;
          state.syncStatus = 'auth_required';
          renderHeaderSyncOnly();
          return false;
        }
        state.authSession = { id: user.id, email: user.email };
        var payloadBot = Object.assign({}, bot, {
          lastEditedBy: bot.lastEditedBy || user.email || getCurrentActor(),
          updatedAt: bot.updatedAt || new Date().toISOString()
        });
        var res = await client.from('user_bots').upsert({
          id: payloadBot.id,
          user_id: user.id,
          bot_data: payloadBot,
          updated_at: payloadBot.updatedAt
        });
        if (res.error) {
          state.syncStatus = 'error';
          renderHeaderSyncOnly();
          return false;
        }
        state.syncStatus = 'synced';
        state.lastSyncAt = new Date().toISOString();
        renderHeaderSyncOnly();
        return true;
      } catch (e) {
        state.syncStatus = 'error';
        renderHeaderSyncOnly();
        return false;
      }
    }

    async function pullAndMergeSupabase(reason) {
      if (!state.supabaseConfig.isConnected) {
        state.syncStatus = 'local';
        renderHeaderSyncOnly();
        return;
      }
      if (state.syncInFlight) return;
      var client = getSbClient();
      if (!client) { state.syncStatus = 'local'; renderHeaderSyncOnly(); return; }
      state.syncInFlight = true;
      state.syncStatus = 'syncing';
      renderHeaderSyncOnly();
      try {
        var sessRes = await client.auth.getSession();
        var user = sessRes && sessRes.data && sessRes.data.session && sessRes.data.session.user;
        if (!user) {
          state.authSession = null;
          state.syncStatus = 'auth_required';
          state.syncInFlight = false;
          renderApp();
          return;
        }
        state.authSession = { id: user.id, email: user.email };
        localStorage.setItem(STORAGE_SB_EMAIL, user.email || state.supabaseConfig.userEmail);
        state.supabaseConfig.userEmail = user.email || state.supabaseConfig.userEmail;

        var res = await client.from('user_bots').select('id, bot_data, updated_at').order('updated_at', { ascending: false });
        if (res.error) {
          state.syncStatus = 'error';
          state.syncInFlight = false;
          renderHeaderSyncOnly();
          return;
        }

        var remoteRows = Array.isArray(res.data) ? res.data : [];
        var remoteMap = {};
        var remoteSecCfg = null;
        remoteRows.forEach(function (r) {
          if (r && r.id === SECURITY_BOT_ID && r.bot_data) {
            remoteSecCfg = r.bot_data;
            return;
          }
          if (r && r.bot_data && r.bot_data.id && r.bot_data.id !== SECURITY_BOT_ID) {
            remoteMap[r.bot_data.id] = r.bot_data;
          }
        });

        if (remoteSecCfg) {
          applySharedSecurityState(remoteSecCfg, { from: 'supabase', silent: true });
        } else if (state.adminConfig.securityUpdatedAt || getConfiguredAccessCode() !== '1234' || getCyberSecurityCode() !== '1234') {
          await pushSecurityConfigToSupabase(buildSecuritySyncPayload('supabase_seed'));
        }

        var merged = [];
        var localSeen = {};
        var toPush = [];
        var toDeleteRemoteIds = [];

        state.bots.forEach(function (lb) {
          if (!lb || lb.id === SECURITY_BOT_ID || isBotTombstoned(lb)) return;
          localSeen[lb.id] = true;
          var rb = remoteMap[lb.id];
          if (!rb) {
            merged.push(lb);
            toPush.push(lb);
          } else {
            var lt = new Date(lb.updatedAt || 0).getTime();
            var rt = new Date(rb.updatedAt || 0).getTime();
            if (lt > rt) {
              merged.push(lb);
              toPush.push(lb);
            } else {
              merged.push(rb);
            }
          }
        });

        remoteRows.forEach(function (r) {
          var rb = r && r.bot_data;
          if (rb && rb.id && rb.id !== SECURITY_BOT_ID && !localSeen[rb.id]) {
            if (isBotTombstoned(rb)) {
              toDeleteRemoteIds.push(rb.id);
            } else {
              merged.push(rb);
            }
          }
        });

        state.bots = merged;
        purgeTombstonedDataFromState();
        refreshAllBotUndoBases();
        saveBotsLocal();

        for (var di = 0; di < toDeleteRemoteIds.length; di++) {
          try { await client.from('user_bots').delete().eq('id', toDeleteRemoteIds[di]); } catch (eDel) {}
        }

        for (var i = 0; i < toPush.length; i++) {
          await client.from('user_bots').upsert({
            id: toPush[i].id,
            user_id: user.id,
            bot_data: toPush[i],
            updated_at: toPush[i].updatedAt || new Date().toISOString()
          });
        }

        // Pull optional remote audit logs if table exists
        try {
          var logRes = await client.from('bot_audit_logs').select('*').order('created_at', { ascending: false }).limit(80);
          if (!logRes.error && Array.isArray(logRes.data) && logRes.data.length) {
            var existingIds = {};
            state.auditLogs.forEach(function (l) { existingIds[l.id] = true; });
            logRes.data.forEach(function (rl) {
              if (!existingIds[rl.id]) {
                state.auditLogs.push({
                  id: rl.id, timestamp: rl.created_at, actor: rl.actor, action: rl.action,
                  source: rl.source || 'Cloud', botId: rl.bot_id, botName: rl.bot_name, summary: rl.summary
                });
              }
            });
            state.auditLogs.sort(function (a, b) { return new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime(); });
            if (state.auditLogs.length > 250) state.auditLogs = state.auditLogs.slice(0, 250);
            saveAdminState();
          }
        } catch (e2) {}

        state.syncStatus = 'synced';
        state.lastSyncAt = new Date().toISOString();

        if (!state.sbUnsub) {
          var ch = client.channel('user_bots_realtime_' + user.id.slice(0, 8)).on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'user_bots' },
            function (payload) {
              if ((payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') && payload.new && payload.new.bot_data) {
                var up = payload.new.bot_data;
                if (up.id === SECURITY_BOT_ID || payload.new.id === SECURITY_BOT_ID) {
                  applySharedSecurityState(up, { from: 'supabase_realtime' });
                  return;
                }
                if (isBotTombstoned(up)) return;
                var idx = state.bots.findIndex(function (b) { return b.id === up.id; });
                if (idx >= 0) state.bots[idx] = up; else state.bots.unshift(up);
                resetBotUndoBase(up);
                saveBotsLocal();
                state.lastSyncAt = new Date().toISOString();
                showToast('Live Supabase sync: ' + up.name);
                renderApp();
              } else if (payload.eventType === 'DELETE' && payload.old && payload.old.id) {
                if (payload.old.id === SECURITY_BOT_ID) return;
                state.bots = state.bots.filter(function (b) { return b.id !== payload.old.id; });
                saveBotsLocal();
                renderApp();
              }
            }
          ).subscribe();
          state.sbUnsub = function () { client.removeChannel(ch); };
        }
        if (reason === 'manual') showToast('Synced with Supabase Cloud!');
      } catch (e) {
        state.syncStatus = 'error';
      }
      state.syncInFlight = false;
      renderApp();
    }

    function buildWebhookEdgeFunctionCode(bot) {
      return '// Supabase Edge Function: supabase/functions/telegram-webhook/index.ts\n' +
        '// Receives Telegram Webhook POSTs and writes directly to user_bots (fires Realtime instant sync)\n' +

        '  }\n' +
        '  const url = new URL(req.url);\n' +
        '  const botId = url.searchParams.get("bot_id") || "' + bot.id + '";\n' +
        '  const update = await req.json();\n' +
        '  const msg = update.message || update.edited_message || update.channel_post;\n' +
        '  if (!msg) return new Response("Ignored", { status: 200 });\n\n' +
        '  const supabase = createClient(\n' +
        '    Deno.env.get("SUPABASE_URL")!,\n' +
        '    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!\n' +
        '  );\n' +
        '  const { data: row } = await supabase.from("user_bots").select("*").eq("id", botId).single();\n' +
        '  if (!row) return new Response("Bot not found", { status: 404 });\n\n' +
        '  const botData = row.bot_data;\n' +
        '  const rid = "tg_" + update.update_id;\n' +
        '  if (!(botData.rows || []).some((r: any) => r.id === rid)) {\n' +
        '    const from = msg.from || msg.chat || {};\n' +
        '    const tgActor = (from.username ? "@" + from.username : (from.first_name || "user")) + " (" + (from.id || "?") + ")";\n' +
        '    const text = msg.text || msg.caption || "[Media]";\n' +
        '    const amtM = text.match(/([0-9]+(?:\\.[0-9]{1,2})?)/);\n' +
        '    const nr: Record<string, any> = { id: rid, _actor: tgActor };\n' +
        '    for (const c of (botData.columns || [])) {\n' +
        '      const cn = (c.name || "").toLowerCase();\n' +
        '      if (c.type === "amount" || c.type === "number") nr[c.id] = amtM ? parseFloat(amtM[1]) : 0;\n' +
        '      else if (c.type === "date") nr[c.id] = new Date((msg.date || Date.now()/1000) * 1000).toISOString().slice(0,16).replace("T"," ");\n' +
        '      else if (cn.includes("user") || cn.includes("customer")) nr[c.id] = tgActor;\n' +
        '      else nr[c.id] = text;\n' +
        '    }\n' +
        '    botData.rows = [nr, ...(botData.rows || [])];\n' +
        '    botData.updatedAt = new Date().toISOString();\n' +
        '    botData.lastEditedBy = tgActor;\n' +
        '    await supabase.from("user_bots").update({ bot_data: botData, updated_at: botData.updatedAt }).eq("id", botId);\n' +
        '    await supabase.from("bot_audit_logs").insert({\n' +
        '      id: "log_" + Date.now(), user_id: row.user_id, actor: tgActor,\n' +
        '      action: "ADD", source: "Telegram Webhook", bot_id: botId, bot_name: botData.name,\n' +
        '      summary: "Webhook message: " + text.slice(0, 50), created_at: botData.updatedAt\n' +
        '    });\n' +
        '  }\n' +
        '  return new Response(JSON.stringify({ ok: true }), { headers: { "content-type": "application/json" } });\n' +
        '});';
    }

    async function refreshWebhookInfo(bot) {
      if (!bot || !bot.telegramToken) return null;
      var res = await fetch('https://api.telegram.org/bot' + bot.telegramToken + '/getWebhookInfo');
      var data = await res.json();
      if (!data.ok || !data.result) throw new Error(data.description || 'Failed to fetch webhook info');
      var info = data.result;
      bot.webhookInfo = {
        url: info.url || '',
        pending_update_count: info.pending_update_count || 0,
        last_error_message: info.last_error_message || '',
        last_error_date: info.last_error_date || 0,
        max_connections: info.max_connections || 40,
        checkedAt: new Date().toISOString()
      };
      if (info.url) {
        bot.webhookUrl = info.url;
        bot.webhookActive = true;
        bot.botStatus = 'online';
      } else {
        bot.webhookActive = false;
      }
      bot.updatedAt = new Date().toISOString();
      saveBotsLocal();
      pushBotToSupabase(bot);
      return bot.webhookInfo;
    }

    async function applyTelegramWebhook(bot, url, secret, dropPending) {
      if (!bot || !bot.telegramToken) throw new Error('Connect a valid Telegram Bot Token first.');
      if (!/^https:\/\/.+/i.test(url)) throw new Error('Telegram requires a valid HTTPS webhook URL (starting with https://).');
      var payload = {
        url: url,
        drop_pending_updates: !!dropPending,
        allowed_updates: ['message', 'edited_message', 'channel_post']
      };
      if (secret) payload.secret_token = secret;
      var res = await fetch('https://api.telegram.org/bot' + bot.telegramToken + '/setWebhook', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await res.json();
      if (!data.ok) throw new Error(data.description || 'Telegram setWebhook rejected URL');
      bot.webhookUrl = url;
      bot.webhookSecret = secret || '';
      bot.webhookActive = true;
      bot.botStatus = 'online';
      bot.updatedAt = new Date().toISOString();
      updateBot(bot, 'EDIT', 'Activated Telegram Webhook -> ' + url);
      try { await refreshWebhookInfo(bot); } catch (e) {}
      return data;
    }

    async function removeTelegramWebhook(bot, dropPending) {
      if (!bot || !bot.telegramToken) throw new Error('Connect a valid Telegram Bot Token first.');
      var res = await fetch('https://api.telegram.org/bot' + bot.telegramToken + '/deleteWebhook', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ drop_pending_updates: !!dropPending })
      });
      var data = await res.json();
      if (!data.ok) throw new Error(data.description || 'Failed to remove webhook');
      bot.webhookActive = false;
      bot.webhookInfo = { url: '', pending_update_count: 0, last_error_message: '', max_connections: 40, checkedAt: new Date().toISOString() };
      bot.updatedAt = new Date().toISOString();
      updateBot(bot, 'EDIT', 'Removed Telegram Webhook (switched back to Polling)');
      return data;
    }

    // Immediate Telegram Sync (on Bot Open, Browser Open, & Live Auto-Poll)
    async function syncTelegramBot(bot, silent) {
      if (!bot || !bot.telegramToken) return 0;
      if (bot.webhookActive) {
        if (!silent) showToast('Webhook active on ' + bot.name + ' — updates push via cloud realtime!');
        return 0;
      }
      try {
        var offset = state.tgOffsets[bot.id] ? Number(state.tgOffsets[bot.id]) : 0;
        var apiUrl = 'https://api.telegram.org/bot' + bot.telegramToken + '/getUpdates?timeout=1' + (offset ? ('&offset=' + offset) : '');
        var res = await fetch(apiUrl);
        var data = await res.json();
        if (!data.ok) {
          if (data.error_code === 409 || String(data.description || '').toLowerCase().indexOf('webhook') !== -1) {
            bot.webhookActive = true;
            try { await refreshWebhookInfo(bot); } catch (e2) {}
            if (!silent) showToast('Webhook is active on Telegram — using instant push delivery');
            renderApp();
          }
          return 0;
        }
        if (!Array.isArray(data.result)) return 0;
        var addedCount = 0;
        var editedCount = 0;
        var deletedCount = 0;
        var openedCount = 0;
        var maxUpdId = offset ? (offset - 1) : 0;
        var existingRowIds = {};
        bot.rows.forEach(function (r) { existingRowIds[r.id] = true; });

        data.result.forEach(function (u) {
          if (u.update_id > maxUpdId) maxUpdId = u.update_id;
          var isEditedMsg = !!u.edited_message;
          var msgObj = u.message || u.edited_message || u.channel_post;
          if (!msgObj) return;
          var rid = 'tg_' + u.update_id;
          if (!isEditedMsg && existingRowIds[rid]) return;

          var fromObj = msgObj.from || msgObj.chat || {};
          var tgUserId = String(fromObj.id || 'unknown');
          var tgUsername = fromObj.username ? ('@' + fromObj.username) : '';
          var tgHandle = tgUsername || (fromObj.first_name || tgUserId);
          var tgActor = tgHandle + ' (' + tgUserId + ')';
          var tgChatId = msgObj.chat && msgObj.chat.id ? String(msgObj.chat.id) : '';
          var tgMeta = {
            actor: tgActor,
            source: 'Telegram',
            platform: 'Telegram',
            telegramId: tgUserId,
            telegramUsername: tgUsername,
            deviceLabel: 'Telegram App / Bot'
          };
          var sendTgReply = function (replyTxt) {
            if (!tgChatId || !bot.telegramToken) return;
            fetch('https://api.telegram.org/bot' + bot.telegramToken + '/sendMessage', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: tgChatId, text: replyTxt })
            }).catch(function () {});
          };

          if (isActorBlocked(tgUserId) || (tgUsername && isActorBlocked(tgUsername)) || isActorBlocked(tgActor)) {
            sendTgReply('⛔ Access Blocked by Admin / Cyber Security. Your Telegram ID (' + tgUserId + ') is blocked from using TableBot.');
            recordAudit('BLOCK', bot, 'Rejected & notified blocked Telegram user ' + tgActor, tgMeta);
            return;
          }

          if (tgChatId) {
            if (!Array.isArray(state.adminConfig.telegramKnownChats)) state.adminConfig.telegramKnownChats = [];
            var hasChat = state.adminConfig.telegramKnownChats.some(function (kc) {
              return kc && kc.chatId === tgChatId && kc.botId === bot.id;
            });
            if (!hasChat) {
              state.adminConfig.telegramKnownChats.unshift({ chatId: tgChatId, botId: bot.id, label: tgActor, updatedAt: new Date().toISOString() });
              if (state.adminConfig.telegramKnownChats.length > 20) state.adminConfig.telegramKnownChats = state.adminConfig.telegramKnownChats.slice(0, 20);
              saveAdminState();
            }
          }

          var txt = (msgObj.text || msgObj.caption || '[Media]').trim();
          var lowerTxt = txt.toLowerCase();
          var msgTimeMs = (msgObj.date || Math.floor(Date.now() / 1000)) * 1000;
          var amtM = txt.match(/([0-9]+(?:\.[0-9]{1,2})?)/);

          if (/^\/lockstatus\b/i.test(lowerTxt)) {
            openedCount++;
            sendTgReply('🔐 TableBot Security Status:\n• Lock Screen: ' + (isAccessLockEnabled() ? 'ON' : 'OFF') + '\n• Cyber Manager: ' + (state.adminConfig.cyberSecurityManager || 'Abdulfeta') + '\n• Sync: Active across all browsers & Telegram Desktop');
            recordAudit('OPEN', bot, 'Telegram user checked lock status', tgMeta);
            return;
          }

          if (/^\/(lockcode|setlockcode|accesscode)\b/i.test(lowerTxt)) {
            var parts = txt.replace(/^\/(lockcode|setlockcode|accesscode)\s*/i, '').trim().split(/\s+/).filter(Boolean);
            if (parts.length < 2) {
              sendTgReply('Usage: /lockcode <current_or_cyber_code> <new_code>\nExample: /lockcode 1234 5678');
              return;
            }
            var curArg = normalizeSecurityCode(parts[0]);
            var newArg = normalizeSecurityCode(parts[1]);
            if (curArg !== getConfiguredAccessCode() && curArg !== getCyberSecurityCode()) {
              sendTgReply('❌ Incorrect current or Cyber Security code. Access denied.');
              recordAudit('BLOCK', bot, 'Rejected Telegram /lockcode attempt from ' + tgActor, tgMeta);
              return;
            }
            state.adminConfig.accessLockEnabled = true;
            setConfiguredAccessCode(newArg, true);
            pushSharedSecurityState('telegram_lockcode');
            sendTgReply('✅ Lock Screen code updated and synced to all browsers & Telegram Desktop!');
            recordAudit('AUTH', bot, 'Telegram user updated Lock Screen code via /lockcode', tgMeta);
            return;
          }

          if (/^\/(lockapp|lockscreen)\b/i.test(lowerTxt)) {
            var lockArg = normalizeSecurityCode(txt.replace(/^\/(lockapp|lockscreen)\s*/i, '').trim());
            if (!lockArg || (lockArg !== getConfiguredAccessCode() && lockArg !== getCyberSecurityCode())) {
              sendTgReply('Usage: /lockapp <current_or_cyber_code>');
              return;
            }
            lockAppNow();
            sendTgReply('🔒 App locked across all browsers & Telegram Desktop.');
            recordAudit('AUTH', bot, 'Telegram user triggered remote /lockapp', tgMeta);
            return;
          }

          if (/^\/(start|open|view|menu|list|status)\b/i.test(lowerTxt)) {
            openedCount++;
            var tgDisplayName = formatTelegramWelcomeName({
              id: tgUserId,
              username: tgUsername,
              firstName: fromObj.first_name || '',
              lastName: fromObj.last_name || ''
            }) || tgHandle;
            var tgOpenStamp = markAppOpenedNow({
              id: tgUserId,
              username: tgUsername,
              firstName: fromObj.first_name || '',
              lastName: fromObj.last_name || '',
              botName: bot.name,
              source: 'Telegram'
            }, 'telegram_open');
            sendTgReply(
              'እንኳን ደህና መጡ ' + tgDisplayName + '!\n' +
              'እንኳን ደህና መጡ ወደ ሂሪያ (Hiriya Salt Production PLC)\n' +
              'Welcome, ' + tgDisplayName + '!\n' +
              'Opened: ' + tgOpenStamp.fullText
            );
            recordAudit('OPEN', bot, 'Telegram user ' + tgDisplayName + ' opened bot via "' + txt.slice(0, 40) + '"', tgMeta);
            return;
          }

          if (/^\/(delete|remove|del)\b/i.test(lowerTxt)) {
            var delTarget = txt.replace(/^\/(delete|remove|del)\s*/i, '').trim().toLowerCase();
            var delIdx = -1;
            if (delTarget) {
              delIdx = bot.rows.findIndex(function (r) {
                return String(r.id).toLowerCase() === delTarget || bot.columns.some(function (c) {
                  return String(r[c.id] || '').toLowerCase().indexOf(delTarget) !== -1;
                });
              });
            }
            if (delIdx === -1) {
              delIdx = bot.rows.findIndex(function (r) {
                return matchesActorIdentity(r._actor, tgActor) || matchesActorIdentity(r._actor, tgHandle);
              });
            }
            if (delIdx === -1 && bot.rows.length > 0) delIdx = 0;
            if (delIdx !== -1) {
              var removedRow = bot.rows.splice(delIdx, 1)[0];
              deletedCount++;
              recordAudit('DELETE', bot, 'Telegram user deleted row ' + (removedRow ? removedRow.id : '') + ' via "' + txt.slice(0, 40) + '"', tgMeta);
            } else {
              recordAudit('DELETE', bot, 'Telegram user sent "' + txt.slice(0, 40) + '" (no matching row)', tgMeta);
            }
            return;
          }

          if (isEditedMsg || /^\/(edit|update)\b/i.test(lowerTxt)) {
            var editTxt = txt.replace(/^\/(edit|update)\s*/i, '').trim() || txt;
            var editAmtM = editTxt.match(/([0-9]+(?:\.[0-9]{1,2})?)/);
            var targetRow = bot.rows.find(function (r) {
              return (msgObj.message_id && r._msgId === msgObj.message_id) || matchesActorIdentity(r._actor, tgActor) || matchesActorIdentity(r._actor, tgHandle);
            });
            if (targetRow) {
              bot.columns.forEach(function (c) {
                var cname = c.name.toLowerCase();
                if ((c.type === 'amount' || c.type === 'number') && editAmtM) targetRow[c.id] = parseFloat(editAmtM[1]);
                else if (c.type === 'date') targetRow[c.id] = formatAutoDateStr(c, msgTimeMs);
                else if (cname.indexOf('user') === -1 && cname.indexOf('customer') === -1 && cname.indexOf('buyer') === -1 && c.type !== 'formula' && c.type !== 'checkbox') targetRow[c.id] = editTxt;
              });
              targetRow._actor = tgActor;
              targetRow._updatedAt = new Date().toISOString();
            }
            editedCount++;
            recordAudit('EDIT', bot, 'Telegram user edited row: "' + editTxt.slice(0, 50) + '"', tgMeta);
            return;
          }

          var nr = { id: rid, _msgId: msgObj.message_id || null, _actor: tgActor, _createdAt: new Date(msgTimeMs).toISOString(), _updatedAt: new Date().toISOString() };
          bot.columns.forEach(function (c) {
            var cname = c.name.toLowerCase();
            if (c.type === 'amount' || c.type === 'number') nr[c.id] = amtM ? parseFloat(amtM[1]) : 0;
            else if (c.type === 'date') nr[c.id] = formatAutoDateStr(c, msgTimeMs);
            else if (cname.indexOf('user') !== -1 || cname.indexOf('customer') !== -1 || cname.indexOf('buyer') !== -1) nr[c.id] = tgActor;
            else nr[c.id] = txt;
          });
          bot.rows.unshift(nr);
          existingRowIds[rid] = true;
          addedCount++;
          recordAudit('ADD', bot, 'Telegram message logged: "' + txt.slice(0, 50) + '"', tgMeta);
        });

        if (maxUpdId > 0) {
          state.tgOffsets[bot.id] = maxUpdId + 1;
          saveAdminState();
        }
        state.lastTgSyncAt = new Date().toISOString();
        var totalChanges = addedCount + editedCount + deletedCount + openedCount;
        if (totalChanges > 0) {
          bot.botStatus = 'online';
          if (addedCount > 0 || editedCount > 0 || deletedCount > 0) {
            bot.updatedAt = new Date().toISOString();
            bot.lastEditedBy = 'Telegram Bot';
            saveBotsLocal();
            await pushBotToSupabase(bot);
          }
          showToast('Telegram sync (' + bot.name + '): +' + addedCount + ' add, ' + editedCount + ' edit, ' + deletedCount + ' del, ' + openedCount + ' open');
          renderApp();
        } else if (!silent) {
          showToast('Telegram checked (' + bot.name + '): up to date');
        }
        return totalChanges;
      } catch (e) {
        if (!silent) showToast('Telegram sync network error');
        return 0;
      }
    }

    async function syncAllNow(reason) {
      if (isCurrentUserRevoked()) return;
      await pullSharedSecurityState(reason || 'sync_all');
      if (state.supabaseConfig.isConnected) {
        await pullAndMergeSupabase(reason || 'auto');
      }
      var active = getActiveBot();
      if (active && active.telegramToken) {
        await syncTelegramBot(active, reason !== 'manual');
      } else {
        for (var i = 0; i < state.bots.length; i++) {
          if (state.bots[i].telegramToken) {
            await syncTelegramBot(state.bots[i], true);
          }
        }
      }
    }

    function startTelegramAutoPoll() {
      if (state.tgPollTimer) clearInterval(state.tgPollTimer);
      state.tgPollTimer = setInterval(function () {
        if (!state.adminConfig.telegramAutoPoll || document.hidden) return;
        var active = getActiveBot();
        if (active && active.telegramToken && !active.webhookActive) {
          syncTelegramBot(active, true);
        }
      }, 6000);
    }

    function cloneBotSnap(bot) {
      if (!bot) return null;
      return {
        name: String(bot.name || ''),
        columns: JSON.parse(JSON.stringify(bot.columns || [])),
        rows: JSON.parse(JSON.stringify(bot.rows || []))
      };
    }

    function ensureBotUndoBase(bot) {
      if (!bot || !bot.id) return;
      if (!botUndoBaseMap[bot.id]) {
        botUndoBaseMap[bot.id] = cloneBotSnap(bot);
      }
    }

    function resetBotUndoBase(bot) {
      if (!bot || !bot.id) return;
      botUndoBaseMap[bot.id] = cloneBotSnap(bot);
    }

    function refreshAllBotUndoBases() {
      (state.bots || []).forEach(function (b) {
        if (b && b.id) botUndoBaseMap[b.id] = cloneBotSnap(b);
      });
    }
    refreshAllBotUndoBases();

    function getUndoCount(botId) {
      var st = state.undoStacks && state.undoStacks[botId];
      return st ? st.length : 0;
    }

    function getRedoCount(botId) {
      var st = state.redoStacks && state.redoStacks[botId];
      return st ? st.length : 0;
    }

    function undoTableAction(bot) {
      if (!bot) return false;
      if (!guardWriteAction('Undo')) return false;
      var stack = state.undoStacks[bot.id];
      if (!stack || stack.length === 0) {
        showToast('Nothing to undo');
        return false;
      }
      var snap = stack.pop();
      if (!state.redoStacks[bot.id]) state.redoStacks[bot.id] = [];
      var curSnap = cloneBotSnap(bot);
      curSnap.label = snap.label || 'Change';
      state.redoStacks[bot.id].push(curSnap);
      if (state.redoStacks[bot.id].length > 50) state.redoStacks[bot.id].shift();

      bot.name = snap.name;
      bot.columns = JSON.parse(JSON.stringify(snap.columns || []));
      bot.rows = JSON.parse(JSON.stringify(snap.rows || []));
      bot.updatedAt = new Date().toISOString();

      window._tbIsUndoRedo = true;
      try {
        updateBot(bot, 'EDIT', 'Undo: ' + (snap.label || 'last change'));
      } finally {
        window._tbIsUndoRedo = false;
      }
      resetBotUndoBase(bot);
      state.editingCell = null;
      state.cellMenu = null;
      state.toolbarSubMode = null;
      state.autoOpenDateCal = false;
      state._calDraft = null;
      if (state.activeBotId === bot.id) {
        renderTableView(bot);
      } else {
        renderApp();
      }
      showToast('Undid: ' + (snap.label || 'last change'));
      return true;
    }

      state.undoStacks[bot.id].push(curSnap);

    function getFolderUndoTarget(folderName) {
      var list = (state.bots || []).filter(function (b) {
        return b && !isBotTombstoned(b) && (b.folder || 'General') === (folderName || 'General');
      });
      var lastId = state.folderLastBotId && state.folderLastBotId[folderName || 'General'];
      if (lastId) {
        var lastBot = list.find(function (b) { return b.id === lastId && getUndoCount(b.id) > 0; });
        if (lastBot) return lastBot;
      }
      var withUndo = list.filter(function (b) { return getUndoCount(b.id) > 0; });
      if (withUndo.length === 0) return null;
      withUndo.sort(function (a, b) {
        return new Date(b.updatedAt || 0).getTime() - new Date(a.updatedAt || 0).getTime();
      });
      return withUndo[0];
    }

    function getFolderRedoTarget(folderName) {
      var list = (state.bots || []).filter(function (b) {
        return b && !isBotTombstoned(b) && (b.folder || 'General') === (folderName || 'General');
      });
      var lastId = state.folderLastBotId && state.folderLastBotId[folderName || 'General'];
      if (lastId) {
        var lastBot = list.find(function (b) { return b.id === lastId && getRedoCount(b.id) > 0; });
        if (lastBot) return lastBot;
      }
      var withRedo = list.filter(function (b) { return getRedoCount(b.id) > 0; });
      if (withRedo.length === 0) return null;
      withRedo.sort(function (a, b) {
        return new Date(b.updatedAt || 0).getTime() - new Date(a.updatedAt || 0).getTime();
      });
      return withRedo[0];
    }

    function updateBot(updated, auditAction, auditSummary) {
      if (!guardWriteAction(auditSummary || 'Edit Bot')) return false;
      if (updated && updated.id) {
        if (!state.folderLastBotId) state.folderLastBotId = {};
        state.folderLastBotId[updated.folder || 'General'] = updated.id;
      }
      if (!window._tbIsUndoRedo && updated && updated.id) {
        var prevSnap = botUndoBaseMap[updated.id];
        if (prevSnap) {
          var changedSnap = (
            prevSnap.name !== String(updated.name || '') ||
            JSON.stringify(prevSnap.columns) !== JSON.stringify(updated.columns || []) ||
            JSON.stringify(prevSnap.rows) !== JSON.stringify(updated.rows || [])
          );
          if (changedSnap) {
            if (!state.undoStacks[updated.id]) state.undoStacks[updated.id] = [];
            prevSnap.label = auditSummary || auditAction || 'Change';
            state.undoStacks[updated.id].push(prevSnap);
            if (state.undoStacks[updated.id].length > 50) state.undoStacks[updated.id].shift();
            state.redoStacks[updated.id] = [];
          }
        }
        botUndoBaseMap[updated.id] = cloneBotSnap(updated);
      }
      delete updated.isSampleSeed;
      updated.lastEditedBy = getCurrentActor();
      updated.updatedAt = updated.updatedAt || new Date().toISOString();
      if (clearFolderTombstone(updated.folder || 'General', updated.id)) {
        pushSharedSecurityState('update_bot');
      }
      state.bots = state.bots.map(function (b) { return b.id === updated.id ? updated : b; });
      saveBotsLocal();
      recordFolderSnapshot(updated, 'MODIFIED', auditSummary || ('Updated ' + updated.name), false);
      if (auditAction) {
        recordAudit(auditAction, updated, auditSummary || ('Updated ' + updated.name));
      }
      pushBotToSupabase(updated);
      return true;
    }

    async function deleteBot(botId) {
      if (!guardWriteAction('Delete Bot')) return;
      var target = state.bots.find(function (b) { return b.id === botId; });
      if (!target) return;
      requireCyberAuth('Delete Bot Table "' + target.name + '"', async function () {
        // Auto-archive deleted bot into Deleted/Missing Vault & Folder History (retains 3m+ restore)
        state.deletedVault.unshift({
          id: 'del_' + Date.now(),
          folder: target.folder || 'General',
          botId: target.id,
          botName: target.name,
          deletedAt: new Date().toISOString(),
          deletedBy: getCurrentActor(),
          rowCount: (target.rows || []).length,
          colCount: (target.columns || []).length,
          reason: 'Bot table deleted',
          botSnapshot: JSON.parse(JSON.stringify(target))
        });
        if (state.deletedVault.length > 120) state.deletedVault = state.deletedVault.slice(0, 120);
        recordFolderSnapshot(target, 'DELETED', 'Deleted "' + target.name + '" (' + (target.rows || []).length + ' rows backed up to Restore Vault)', true);

        if (!state.deletedTombstones || typeof state.deletedTombstones !== 'object') {
          state.deletedTombstones = { folders: {}, botIds: {}, restoredFolders: {}, restoredBots: {} };
        }
        state.deletedTombstones.botIds[botId] = { folder: target.folder || 'General', deletedAt: new Date().toISOString() };
        saveDeletedTombstones();

        var deletedFolder = normalizeFolderName(target.folder);
        state.bots = state.bots.filter(function (b) { return b.id !== botId; });
        if (state.activeBotId === botId) state.activeBotId = null;
        var remainingFolders = getAllFolders();
        if (state.selectedFolder && state.selectedFolder !== 'all' &&
            state.selectedFolder.toLowerCase() === deletedFolder.toLowerCase() &&
            !remainingFolders.some(function (rf) { return rf.toLowerCase() === deletedFolder.toLowerCase(); })) {
          state.selectedFolder = 'all';
          if (!state.collapsedFolders) state.collapsedFolders = {};
          remainingFolders.forEach(function (rf) { state.collapsedFolders[rf] = true; });
        }
        saveBotsLocal();
        saveVaultState();
        recordAudit('DELETE', target, 'Deleted bot table "' + target.name + '"');
        broadcastLocalSync('delete_bot');
        pushSharedSecurityState('delete_bot');
        if (state.supabaseConfig.isConnected && state.authSession) {
          var client = getSbClient();
          if (client) { try { await client.from('user_bots').delete().eq('id', botId); } catch (e) {} }
        }
        showToast('Deleted "' + target.name + '" (saved in Backup & Restore Vault)');
        renderApp();
      });
    }

    function exportBotCsv(bot) {
      var headers = bot.columns.map(function (c) { return '"' + c.name.replace(/"/g, '""') + '"'; }).join(',');
      var rows = bot.rows.map(function (r) {
        return bot.columns.map(function (c) {
          var v = r[c.id];
          return '"' + String(v !== undefined && v !== null ? v : '').replace(/"/g, '""') + '"';
        }).join(',');
      }).join('\n');
      downloadBlob(headers + '\n' + rows, bot.name.replace(/\s+/g, '_') + '_data.csv', 'text/csv;charset=utf-8;');
      showToast('Exported ' + bot.name + ' to CSV');
    }

    }

    function downloadBlob(content, filename, mime) {
      var blob = new Blob([content], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

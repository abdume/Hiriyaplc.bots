      var res = await fetch('https://api.telegram.org/bot' + bot.telegramToken + '/deleteWebhook', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ drop_pending_updates: !!dropPending })
      });
      var data = await res.json();
      if (!data.ok) throw new Error(data.description || 'Failed to remove webhook');
      bot.webhookActive = false;
      bot.webhookInfo = { url: '', pending_update_count: 0, last_error_message: '', max_connections: 40, checkedAt: new Date().toISOString() };
      bot.updatedAt = new Date().toISOString();
      updateBot(bot, 'EDIT', 'Removed Telegram Webhook (switched back to Polling)');
      return data;
    }

    // Immediate Telegram Sync (on Bot Open, Browser Open, & Live Auto-Poll)
    async function syncTelegramBot(bot, silent) {
      if (!bot || !bot.telegramToken) return 0;
      if (bot.webhookActive) {
        if (!silent) showToast('Webhook active on ' + bot.name + ' — updates push via cloud realtime!');
        return 0;
      }
      try {
        var offset = state.tgOffsets[bot.id] ? Number(state.tgOffsets[bot.id]) : 0;
        var apiUrl = 'https://api.telegram.org/bot' + bot.telegramToken + '/getUpdates?timeout=1' + (offset ? ('&offset=' + offset) : '');
        var res = await fetch(apiUrl);
        var data = await res.json();
        if (!data.ok) {
          if (data.error_code === 409 || String(data.description || '').toLowerCase().indexOf('webhook') !== -1) {
            bot.webhookActive = true;
            try { await refreshWebhookInfo(bot); } catch (e2) {}
            if (!silent) showToast('Webhook is active on Telegram — using instant push delivery');
            renderApp();
          }
          return 0;
        }
        if (!Array.isArray(data.result)) return 0;
        var addedCount = 0;
        var editedCount = 0;
        var deletedCount = 0;
        var openedCount = 0;
        var maxUpdId = offset ? (offset - 1) : 0;
        var existingRowIds = {};
        bot.rows.forEach(function (r) { existingRowIds[r.id] = true; });

        data.result.forEach(function (u) {
          if (u.update_id > maxUpdId) maxUpdId = u.update_id;
          var isEditedMsg = !!u.edited_message;
          var msgObj = u.message || u.edited_message || u.channel_post;
          if (!msgObj) return;
          var rid = 'tg_' + u.update_id;
          if (!isEditedMsg && existingRowIds[rid]) return;

          var fromObj = msgObj.from || msgObj.chat || {};
          var tgUserId = String(fromObj.id || 'unknown');
          var tgHandle = fromObj.username ? ('@' + fromObj.username) : (fromObj.first_name || tgUserId);
          var tgActor = tgHandle + ' (' + tgUserId + ')';

          if (isActorBlocked(tgUserId) || isActorBlocked(tgHandle) || isActorBlocked(tgActor)) {
            recordAudit('BLOCK', bot, 'Ignored Telegram message from blocked user ' + tgActor, { actor: tgActor, source: 'Telegram' });
            return;
          }

          var txt = (msgObj.text || msgObj.caption || '[Media]').trim();
          var lowerTxt = txt.toLowerCase();
          var msgTimeMs = (msgObj.date || Math.floor(Date.now() / 1000)) * 1000;
          var amtM = txt.match(/([0-9]+(?:\.[0-9]{1,2})?)/);

          if (/^\/(start|open|view|menu|list|status)\b/i.test(lowerTxt)) {
            openedCount++;
            recordAudit('OPEN', bot, 'Telegram user opened bot via "' + txt.slice(0, 40) + '"', { actor: tgActor, source: 'Telegram' });
            return;
          }

          if (/^\/(delete|remove|del)\b/i.test(lowerTxt)) {
            var delTarget = txt.replace(/^\/(delete|remove|del)\s*/i, '').trim().toLowerCase();
            var delIdx = -1;
            if (delTarget) {
              delIdx = bot.rows.findIndex(function (r) {
                return String(r.id).toLowerCase() === delTarget || bot.columns.some(function (c) {
                  return String(r[c.id] || '').toLowerCase().indexOf(delTarget) !== -1;
                });
              });
            }
            if (delIdx === -1) {
              delIdx = bot.rows.findIndex(function (r) {
                return matchesActorIdentity(r._actor, tgActor) || matchesActorIdentity(r._actor, tgHandle);
              });
            }
            if (delIdx === -1 && bot.rows.length > 0) delIdx = 0;
            if (delIdx !== -1) {
              var removedRow = bot.rows.splice(delIdx, 1)[0];
              deletedCount++;
              recordAudit('DELETE', bot, 'Telegram user deleted row ' + (removedRow ? removedRow.id : '') + ' via "' + txt.slice(0, 40) + '"', { actor: tgActor, source: 'Telegram' });
            } else {
              recordAudit('DELETE', bot, 'Telegram user sent "' + txt.slice(0, 40) + '" (no matching row)', { actor: tgActor, source: 'Telegram' });
            }
            return;
          }

          if (isEditedMsg || /^\/(edit|update)\b/i.test(lowerTxt)) {
            var editTxt = txt.replace(/^\/(edit|update)\s*/i, '').trim() || txt;
            var editAmtM = editTxt.match(/([0-9]+(?:\.[0-9]{1,2})?)/);
            var targetRow = bot.rows.find(function (r) {
              return (msgObj.message_id && r._msgId === msgObj.message_id) || matchesActorIdentity(r._actor, tgActor) || matchesActorIdentity(r._actor, tgHandle);
            });
            if (targetRow) {
              bot.columns.forEach(function (c) {
                var cname = c.name.toLowerCase();
                if ((c.type === 'amount' || c.type === 'number') && editAmtM) targetRow[c.id] = parseFloat(editAmtM[1]);
                else if (c.type === 'date') targetRow[c.id] = formatAutoDateStr(c, msgTimeMs);
                else if (cname.indexOf('user') === -1 && cname.indexOf('customer') === -1 && cname.indexOf('buyer') === -1 && c.type !== 'formula' && c.type !== 'checkbox') targetRow[c.id] = editTxt;
              });
              targetRow._actor = tgActor;
              targetRow._updatedAt = new Date().toISOString();
            }
            editedCount++;
            recordAudit('EDIT', bot, 'Telegram user edited row: "' + editTxt.slice(0, 50) + '"', { actor: tgActor, source: 'Telegram' });
            return;
          }

          var nr = { id: rid, _msgId: msgObj.message_id || null, _actor: tgActor, _createdAt: new Date(msgTimeMs).toISOString(), _updatedAt: new Date().toISOString() };
          bot.columns.forEach(function (c) {
            var cname = c.name.toLowerCase();
            if (c.type === 'amount' || c.type === 'number') nr[c.id] = amtM ? parseFloat(amtM[1]) : 0;
            else if (c.type === 'date') nr[c.id] = formatAutoDateStr(c, msgTimeMs);
            else if (cname.indexOf('user') !== -1 || cname.indexOf('customer') !== -1 || cname.indexOf('buyer') !== -1) nr[c.id] = tgActor;
            else nr[c.id] = txt;
          });
          bot.rows.unshift(nr);
          existingRowIds[rid] = true;
          addedCount++;
          recordAudit('ADD', bot, 'Telegram message logged: "' + txt.slice(0, 50) + '"', { actor: tgActor, source: 'Telegram' });
        });

        if (maxUpdId > 0) {
          state.tgOffsets[bot.id] = maxUpdId + 1;
          saveAdminState();
        }
        state.lastTgSyncAt = new Date().toISOString();
        var totalChanges = addedCount + editedCount + deletedCount + openedCount;
        if (totalChanges > 0) {
          bot.botStatus = 'online';
          if (addedCount > 0 || editedCount > 0 || deletedCount > 0) {
            bot.updatedAt = new Date().toISOString();
            bot.lastEditedBy = 'Telegram Bot';
            saveBotsLocal();
            await pushBotToSupabase(bot);
          }
          showToast('Telegram sync (' + bot.name + '): +' + addedCount + ' add, ' + editedCount + ' edit, ' + deletedCount + ' del, ' + openedCount + ' open');
          renderApp();
        } else if (!silent) {
          showToast('Telegram checked (' + bot.name + '): up to date');
        }
        return totalChanges;
      } catch (e) {
        if (!silent) showToast('Telegram sync network error');
        return 0;
      }
    }

    async function deleteBot(botId) {
      if (!guardWriteAction('Delete Bot')) return;
      var target = state.bots.find(function (b) { return b.id === botId; });
      if (!target) return;
      requireCyberAuth('Delete Bot Table "' + target.name + '"', async function () {
        // Auto-archive deleted bot into Deleted/Missing Vault & Folder History (retains 3m+ restore)
        state.deletedVault.unshift({
          id: 'del_' + Date.now(),
          folder: target.folder || 'General',
          botId: target.id,
          botName: target.name,
          deletedAt: new Date().toISOString(),
          deletedBy: getCurrentActor(),
          rowCount: (target.rows || []).length,
          colCount: (target.columns || []).length,
          reason: 'Bot table deleted',
          botSnapshot: JSON.parse(JSON.stringify(target))
        });
        if (state.deletedVault.length > 120) state.deletedVault = state.deletedVault.slice(0, 120);
        recordFolderSnapshot(target, 'DELETED', 'Deleted "' + target.name + '" (' + (target.rows || []).length + ' rows backed up to Restore Vault)', true);

        state.bots = state.bots.filter(function (b) { return b.id !== botId; });
        if (state.activeBotId === botId) state.activeBotId = null;
        saveBotsLocal();
        saveVaultState();
        recordAudit('DELETE', target, 'Deleted bot table "' + target.name + '"');
        broadcastLocalSync('delete_bot');
        if (state.supabaseConfig.isConnected && state.authSession) {
          var client = getSbClient();
          if (client) { try { await client.from('user_bots').delete().eq('id', botId); } catch (e) {} }
        }
        showToast('Deleted "' + target.name + '" (saved in Backup & Restore Vault)');
        renderApp();
      });
    }

      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

          (tblDays.length === 0
            ? '<tr><td colspan="6" style="text-align:center;color:#64748B;padding:10px;">No filled dated rows in the last 7 days yet. Add data to any row above to calculate Daily &amp; Weekly sums here automatically.</td></tr>'
            : tblDays.slice(0, 7).map(function (dy) {
                return '<tr>' +
                  '<td style="font-weight:700;color:#0D47A1;">' + esc(dy.dmy) + ' <span style="font-size:10.5px;color:#64748B;">(' + esc(dy.weekday) + (dy.dmy === tblTodayDmy ? ' · Today' : '') + ')</span></td>' +
                  '<td style="text-align:center;font-weight:700;">' + dy.rowCount + '</td>' +
                  '<td class="mono" style="text-align:right;font-weight:800;color:#6D28D9;">' + dy.quantitySum.toLocaleString('en-US', { maximumFractionDigits: 2 }) + '</td>' +
                  '<td class="mono" style="text-align:right;font-weight:700;">$' + dy.totalInvoiced.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>' +
                  '<td class="mono" style="text-align:right;font-weight:700;color:#15803D;">$' + dy.totalPaid.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>' +
                  '<td class="mono" style="text-align:right;font-weight:700;color:' + (dy.totalRemaining > 0.01 ? '#C2410C' : '#15803D') + ';">$' + dy.totalRemaining.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>' +
                '</tr>';
              }).join('')) +
          '</tbody><tfoot><tr>' +
            '<td>Σ Weekly Total (7 Days)</td>' +
            '<td style="text-align:center;">' + tblWeekly.met.rowCount + '</td>' +
            '<td class="mono" style="text-align:right;color:#6D28D9;">' + tblWeekly.met.totalQuantity.toLocaleString('en-US', { maximumFractionDigits: 2 }) + '</td>' +
            '<td class="mono" style="text-align:right;">$' + tblWeekly.met.totalInvoiced.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>' +
            '<td class="mono" style="text-align:right;color:#15803D;">$' + tblWeekly.met.totalPaid.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>' +
            '<td class="mono" style="text-align:right;color:' + (tblWeekly.met.totalRemaining > 0.01 ? '#C2410C' : '#15803D') + ';">$' + tblWeekly.met.totalRemaining.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</td>' +
          '</tr></tfoot></table></div>';
      }
      html += '</section></div>';

      // Sticky Sigma Summary Footer
      var numCols = bot.columns.filter(function (c) { return c.type === 'amount' || c.type === 'number' || c.type === 'formula'; });
      html += '<footer class="sigma-footer">' +
        '<span style="color:#FCD34D;font-weight:800;white-space:nowrap;">Σ Live Totals (Num / Formula / Amt):</span>' +
        '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">';
      if (numCols.length === 0) {
        html += '<span style="color:#BFDBFE;font-size:12px;">No numeric/formula columns</span>';
      } else {
        numCols.forEach(function (c) {
          var tot = colSums[c.id] || 0;
          html += '<div style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap;">' +
            '<span style="color:#BFDBFE;font-size:12px;font-weight:400;">' + esc(c.name) + ':</span>' +
            '<span class="mono" style="color:#FCD34D;font-weight:800;">' + esc(formatNumericValue(tot, c)) + '</span></div>';
        });
      }
      html += '</div></footer>';

      // Bottom 5-icon Toolbar
      html += '<div class="bottom-toolbar">' +
        '<button class="toolbar-btn" id="tb-cols">' + icon('sliders', 19) + '<span>Columns</span></button>' +
        '<button class="toolbar-btn" id="tb-filter">' + icon('filter', 19) + '<span>Filter</span></button>' +
        '<button class="toolbar-btn" id="tb-tester" style="color:#1976D2;font-weight:700;"><div class="toolbar-tester-circle">' + icon('send', 15) + '</div><span>Tester</span></button>' +
        '<button class="toolbar-btn" id="tb-export">' + icon('share', 19) + '<span>Export</span></button>' +
        '<div style="position:relative;"><button class="toolbar-btn" id="tb-more">' + icon('dotsH', 19) + '<span>More</span></button>';

      if (state.showMoreMenu) {
        html += '<div class="dropdown-menu" style="bottom:56px;top:auto;right:0;width:245px;">' +
          '<button class="dropdown-item" id="more-file-history">' + icon('history', 15) + '<span>File Version History</span></button>' +
          '<button class="dropdown-item" id="more-import-excel">' + icon('excel', 15) + '<span>Import Excel (.xlsx / .csv)</span></button>' +
          '<button class="dropdown-item" id="more-backup-history">' + icon('folder', 15) + '<span>Folder Backup &amp; Missing</span></button>' +
          '<button class="dropdown-item" id="more-admin">' + icon('shield', 15) + '<span>Admin Activity &amp; Transmit</span></button>' +
          '<button class="dropdown-item" id="more-access-code">' + icon('lock', 15) + '<span>Lock Screen &amp; Change Code</span></button>' +
          '<button class="dropdown-item" id="more-settings">' + icon('settings', 15) + '<span>Bot Settings / Rename</span></button>' +
          '<button class="dropdown-item" id="more-reports">' + icon('chart', 15) + '<span>Daily/Weekly/Monthly Reports</span></button>' +
          '<button class="dropdown-item" id="more-pivot">' + icon('pie', 15) + '<span>Pivot Summary Graph</span></button>' +
          '<button class="dropdown-item danger" id="more-clear">' + icon('trash', 15) + '<span>Clear All Rows</span></button>' +
        '</div>';
      }
      html += '</div></div></div>';

      document.getElementById('app').innerHTML = html;
      bindTableEvents(bot, visibleRows);
    }

    function bindTableEvents(bot, visibleRows) {
      document.getElementById('btn-table-back').onclick = function () { state.activeBotId = null; state.showMoreMenu = false; renderApp(); };
      var tLangBtn = document.getElementById('btn-table-lang');
      if (tLangBtn) tLangBtn.onclick = toggleLanguage;
      document.getElementById('btn-table-sync').onclick = function () { syncAllNow('manual'); };
      document.getElementById('btn-table-history').onclick = function () { openModal('file_history', { botId: bot.id }); };
      document.getElementById('btn-table-reports').onclick = function () { openModal('reports'); };
      document.getElementById('btn-table-settings').onclick = function () { openModal('settings', { bot: bot }); };
      document.getElementById('btn-table-search').onclick = function () {
        state.tableSearchOpen = !state.tableSearchOpen; renderTableView(bot);
        var i = document.getElementById('inp-table-search'); if (i) i.focus();
      };
      var tInp = document.getElementById('inp-table-search');
      if (tInp) tInp.oninput = function (e) {
        var pos = e.target.selectionStart; state.tableSearchQuery = e.target.value; renderTableView(bot);
        var el = document.getElementById('inp-table-search'); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
      };
      var tClr = document.getElementById('btn-clear-table-search');
      if (tClr) tClr.onclick = function () { state.tableSearchQuery = ''; renderTableView(bot); };

      var editTitleBtn = document.getElementById('btn-edit-title');
      if (editTitleBtn) editTitleBtn.onclick = function () {
        state.editingTitle = true; renderTableView(bot);
        var ti = document.getElementById('inp-title-edit'); if (ti) { ti.focus(); ti.select(); }
      };
      var titleInp = document.getElementById('inp-title-edit');
      if (titleInp) {
        var saveTitle = function () {
          var v = titleInp.value.trim();
          state.editingTitle = false;
          if (v && v !== bot.name) {
            var oldN = bot.name;
            bot.name = v; bot.updatedAt = new Date().toISOString();
            updateBot(bot, 'EDIT', 'Renamed bot "' + oldN + '" -> "' + v + '"');
          }
          renderTableView(bot);
        };
        titleInp.onblur = saveTitle;
        titleInp.onkeydown = function (e) {
          if (e.key === 'Enter') saveTitle();
          else if (e.key === 'Escape') { state.editingTitle = false; renderTableView(bot); }
        };
      }

      var addColFn = function () {
        if (!guardWriteAction('Add Column')) return;
        var colName = 'Column ' + (bot.columns.length + 1);
        bot.columns.push({
          id: 'col_' + Date.now(), name: colName, type: 'text', widthMultiplier: 1.0,
          currency: 'None', thousandSeparator: false, decimals: 0,
          style: { bold: false, italic: false, align: 'left', color: '#1E293B', bgColor: '#FFFFFF' },
          includeInGraph: true
        });
        bot.updatedAt = new Date().toISOString();
        updateBot(bot, 'ADD', 'Added column "' + colName + '"');
        recordFolderSnapshot(bot, 'COLUMN_ADDED', 'Added column "' + colName + '" (now ' + bot.columns.length + ' columns)', true);
        showToast('Added "' + colName + '" — tap header to rename or change type');
        renderTableView(bot);
      };
      document.getElementById('btn-table-add-col').onclick = addColFn;
      document.getElementById('th-add-col').onclick = addColFn;
      document.getElementById('btn-bar-add-col').onclick = addColFn;
      document.getElementById('tb-cols').onclick = addColFn;

      document.getElementById('btn-add-row').onclick = function () {
        if (!guardWriteAction('Add Row')) return;
        var nowIso = new Date().toISOString();
        var nr = { id: 'row_' + Date.now(), _actor: getCurrentActor(), _createdAt: nowIso, _updatedAt: nowIso };
        bot.columns.forEach(function (c) {
          if (c.type === 'amount' || c.type === 'number') nr[c.id] = 0;
          else if (c.type === 'formula') nr[c.id] = '';
          else if (c.type === 'checkbox') nr[c.id] = false;
          else if (c.type === 'date') nr[c.id] = c.autoInsertDate !== false ? formatAutoDateStr(c, nowIso) : '';
          else nr[c.id] = '';
        });
        bot.rows.push(nr);
        bot.updatedAt = nowIso;
        updateBot(bot, 'ADD', 'Added new row #' + bot.rows.length);
        renderTableView(bot);
      };

      var delBtn = document.getElementById('btn-del-rows');
      if (delBtn) delBtn.onclick = function () {
        if (!guardWriteAction('Delete Selected Rows')) return;
        var delIds = Object.keys(state.selectedRowIds).filter(function (k) { return state.selectedRowIds[k]; });
        requireCyberAuth('Delete ' + delIds.length + ' Row(s) from "' + bot.name + '"', function () {
          bot.rows = bot.rows.filter(function (r) { return !state.selectedRowIds[r.id]; });
          state.selectedRowIds = {};
          bot.updatedAt = new Date().toISOString();
          updateBot(bot, 'DELETE', 'Deleted ' + delIds.length + ' selected row(s)');
          renderTableView(bot);
        });
      };

      document.getElementById('chk-select-all').onchange = function (e) {
        state.selectedRowIds = {};
        if (e.target.checked) visibleRows.forEach(function (r) { state.selectedRowIds[r.id] = true; });
        renderTableView(bot);
      };
      document.querySelectorAll('.chk-row').forEach(function (chk) {
        chk.onchange = function () {
          state.selectedRowIds[chk.getAttribute('data-row-id')] = chk.checked;
          renderTableView(bot);
        };
      });
      document.querySelectorAll('.chk-cell').forEach(function (chk) {
        chk.onchange = function () {
          if (!guardWriteAction('Toggle Checkbox')) { renderTableView(bot); return; }
          var rid = chk.getAttribute('data-row-id'), cid = chk.getAttribute('data-col-id');
          var colObj = bot.columns.find(function (c) { return c.id === cid; });
          var nowIso = new Date().toISOString();
          bot.rows.forEach(function (r) {
            if (r.id === rid) {
              r[cid] = chk.checked;
              r._actor = getCurrentActor();
              r._updatedAt = nowIso;
              autoFillRowDates(bot, r, nowIso, cid);
            }
          });
          bot.updatedAt = nowIso;
          updateBot(bot, 'EDIT', 'Toggled "' + (colObj ? colObj.name : cid) + '" -> ' + chk.checked);
          renderTableView(bot);
        };
      });

      document.querySelectorAll('[data-edit-col]').forEach(function (th) {
        th.onclick = function () {
          var cid = th.getAttribute('data-edit-col');
          var col = bot.columns.find(function (c) { return c.id === cid; });
          if (col) openModal('column', { bot: bot, column: col });
        };
      });

      document.querySelectorAll('.cell-clickable').forEach(function (td) {
        td.onclick = function () {
          var rid = td.getAttribute('data-row-id');
          var cid = td.getAttribute('data-col-id');
          var colObj = bot.columns.find(function (c) { return c.id === cid; });
          var rowObj = bot.rows.find(function (r) { return r.id === rid; });
          if (colObj && colObj.type === 'date' && colObj.autoInsertDate !== false && rowObj && (!rowObj[cid] || String(rowObj[cid]).trim() === '')) {
            rowObj[cid] = formatAutoDateStr(colObj, new Date());
          }
          state.editingCell = { rowId: rid, colId: cid };
          renderTableView(bot);
          var ci = document.getElementById('active-cell-input');
          if (ci) {
            ci.focus();
            if (colObj && colObj.type === 'date') {
              if (typeof ci.showPicker === 'function') { try { ci.showPicker(); } catch (e) {} }
            } else {
              try { ci.select(); } catch (e2) {}
            }
          }
        };
      });

      var activeInp = document.getElementById('active-cell-input');
      if (activeInp && state.editingCell) {
        var commitCell = function () {
          var ed = state.editingCell;
          if (!ed) return;
          state.editingCell = null;
          if (!guardWriteAction('Edit Cell')) { renderTableView(bot); return; }
          var col = bot.columns.find(function (c) { return c.id === ed.colId; });
          var raw = activeInp.value;
          var parsed = raw;
          if (col && (col.type === 'amount' || col.type === 'number')) {
            var num = parseFloat(raw.replace(/[^0-9.-]/g, ''));
            parsed = isNaN(num) ? 0 : num;
          } else if (col && col.type === 'date') {
            if (String(raw || '').trim() === '') {
              parsed = col.autoInsertDate !== false ? formatAutoDateStr(col, new Date()) : '';
            } else {
              parsed = formatAutoDateStr(col, parseFlexibleDate(raw));
            }
          }
          var oldVal = '';
          var nowIso = new Date().toISOString();
          bot.rows.forEach(function (r) {
            if (r.id === ed.rowId) {
              oldVal = r[ed.colId];
              r[ed.colId] = parsed;
              r._actor = getCurrentActor();
              r._updatedAt = nowIso;
              if (String(parsed).trim() !== '' && String(parsed) !== '0') {
                autoFillRowDates(bot, r, nowIso, ed.colId);
              }
            }
          });
          bot.updatedAt = nowIso;
          if (String(oldVal) !== String(parsed)) {
            updateBot(bot, 'EDIT', 'Edited "' + (col ? col.name : ed.colId) + '": "' + oldVal + '" -> "' + parsed + '"');
          }
          renderTableView(bot);
        };
        if (activeInp.type === 'date' || activeInp.type === 'datetime-local') {
          activeInp.onchange = commitCell;
        }
        activeInp.onblur = commitCell;
        activeInp.onkeydown = function (e) {
          if (e.key === 'Enter') commitCell();
          else if (e.key === 'Escape') { state.editingCell = null; renderTableView(bot); }
        };
      }

      document.getElementById('tb-filter').onclick = function () { openModal('filter', { bot: bot }); };
      document.getElementById('tb-tester').onclick = function () { openModal('telegram', { bot: bot, tab: 'simulator' }); };
      document.getElementById('tb-export').onclick = function () { exportBotCsv(bot); };
      document.getElementById('tb-more').onclick = function (e) { e.stopPropagation(); state.showMoreMenu = !state.showMoreMenu; renderTableView(bot); };
      if (state.showMoreMenu) {
        document.getElementById('more-file-history').onclick = function () { state.showMoreMenu = false; openModal('file_history', { botId: bot.id }); };
        document.getElementById('more-import-excel').onclick = function () { state.showMoreMenu = false; openModal('import_excel', { mode: 'merge', targetBotId: bot.id }); };
        document.getElementById('more-backup-history').onclick = function () { state.showMoreMenu = false; openModal('backup', { tab: 'vault', folderFilter: bot.folder || 'General' }); };
        document.getElementById('more-admin').onclick = function () { state.showMoreMenu = false; openModal('admin', { tab: 'logs' }); };
        document.getElementById('more-access-code').onclick = function () { state.showMoreMenu = false; openModal('access_code'); };
        document.getElementById('more-settings').onclick = function () { state.showMoreMenu = false; openModal('settings', { bot: bot }); };
        document.getElementById('more-reports').onclick = function () { state.showMoreMenu = false; openModal('reports'); };
        document.getElementById('more-pivot').onclick = function () { state.showMoreMenu = false; openModal('pivot', { bot: bot }); };
        document.getElementById('more-clear').onclick = function () {
          state.showMoreMenu = false;
          if (!guardWriteAction('Clear All Rows')) return;
          requireCyberAuth('Clear All Rows from "' + bot.name + '"', function () {
            recordFolderSnapshot(bot, 'BACKUP', 'Pre-clear snapshot (' + bot.rows.length + ' rows)', true);
            var prevCnt = bot.rows.length;
            bot.rows = []; bot.updatedAt = new Date().toISOString();
            updateBot(bot, 'DELETE', 'Cleared all ' + prevCnt + ' rows');
            renderTableView(bot);
          });
        };
      }

      var tblScopeTable = document.getElementById('tbl-sum-scope-table');
      if (tblScopeTable) tblScopeTable.onclick = function () { state.tableReportScope = 'table'; renderTableView(bot); };
      var tblScopeFolder = document.getElementById('tbl-sum-scope-folder');
      if (tblScopeFolder) tblScopeFolder.onclick = function () { state.tableReportScope = 'folder'; renderTableView(bot); };
      var tblSumToggle = document.getElementById('tbl-sum-toggle');
      if (tblSumToggle) tblSumToggle.onclick = function () { state.tableReportCollapsed = !state.tableReportCollapsed; renderTableView(bot); };
      var tblSumOpenRep = document.getElementById('tbl-sum-open-rep');
      if (tblSumOpenRep) tblSumOpenRep.onclick = function () { openModal('reports', { folder: state.tableReportScope === 'folder' ? (bot.folder || 'General') : 'all' }); };
      document.querySelectorAll('.tbl-sum-card[data-open-rper]').forEach(function (card) {
        card.onclick = function () { openModal('reports', { period: card.getAttribute('data-open-rper'), folder: bot.folder || 'General' }); };
      });
    }

    function renderLockScreen() {

        : 'Enter your access code to unlock tables and menus.';
      var btnTxt = isAm ? 'ክፈት' : 'Unlock App';
      var placeholderTxt = isAm ? 'የመግቢያ ኮድ ያስገቡ...' : 'Enter access code...';

      var html = '<div class="lock-screen">' +
        '<div style="position:absolute;top:16px;right:16px;">' +

        '</div>' +
        '<form id="lock-form" class="lock-card' + (state.lockShake ? ' shake' : '') + '" autocomplete="off">' +
          '<div class="lock-icon-ring">' + icon('lock', 30) + '</div>' +
          '<h1 style="font-size:21px;font-weight:800;color:#0F172A;margin-bottom:6px;">' + esc(titleTxt) + '</h1>' +
          '<p style="font-size:13px;color:#64748B;margin-bottom:20px;line-height:1.45;">' + esc(subTxt) + '</p>' +
          '<div style="text-align:left;">' +
            '<label class="field-label" for="lock-code-inp">' + (isAm ? 'የመግቢያ ኮድ' : 'Access Code') + '</label>' +
            '<div style="display:flex;gap:8px;align-items:center;">' +
              '<input id="lock-code-inp" type="' + (state.lockShowCode ? 'text' : 'password') + '" class="form-input mono" style="font-size:16px;letter-spacing:0.12em;padding:11px 14px;" placeholder="' + esc(placeholderTxt) + '" autocomplete="off" autofocus />' +
              '<button type="button" id="lock-eye-btn" class="btn btn-outline" style="padding:10px 12px;font-size:11.5px;white-space:nowrap;">' + (state.lockShowCode ? 'Hide' : 'Show') + '</button>' +
            '</div>' +
          '</div>' +
          (state.lockError
            ? '<div id="lock-err-msg" class="lock-error-box">' + icon('ban', 15) + '<span>' + esc(state.lockError) + '</span></div>'
            : '') +
          '<button type="submit" id="lock-submit-btn" class="btn btn-dark-blue" style="width:100%;margin-top:16px;padding:12px 16px;font-size:14px;">' +
            icon('shield', 16) + '<span>' + esc(btnTxt) + '</span>' +
          '</button>' +
          '<div style="margin-top:16px;font-size:11px;color:#94A3B8;display:flex;align-items:center;justify-content:center;gap:5px;">' +
            icon('shield', 12) + '<span>Protected Workspace &middot; Session Lock Active</span>' +
          '</div>' +
        '</form>' +
      '</div>';

      document.getElementById('app').innerHTML = html;
      state.lockShake = false;

      var inp = document.getElementById('lock-code-inp');
      if (inp) {
        inp.focus();
        inp.oninput = function () {
          if (state.lockError) {
            state.lockError = '';
            var errEl = document.getElementById('lock-err-msg');
            if (errEl) errEl.remove();
          }
        };
      }
      var langBtn = document.getElementById('lock-lang-btn');
      if (langBtn) langBtn.onclick = toggleLanguage;
      var eyeBtn = document.getElementById('lock-eye-btn');
      if (eyeBtn) eyeBtn.onclick = function () {
        var cur = inp ? inp.value : '';
        state.lockShowCode = !state.lockShowCode;
        renderLockScreen();
        var nInp = document.getElementById('lock-code-inp');
        if (nInp) { nInp.value = cur; nInp.focus(); }
      };
      document.getElementById('lock-form').onsubmit = function (e) {
        e.preventDefault();
        var entered = (document.getElementById('lock-code-inp').value || '').trim();
        var expected = getConfiguredAccessCode();
        if (!entered) {
          state.lockError = state.lang === 'am' ? 'እባክዎ የመግቢያ ኮድ ያስገቡ።' : 'Please enter the access code.';
          state.lockShake = true;
          renderLockScreen();
          return;
        }
        if (entered !== expected) {
          state.lockError = state.lang === 'am'
            ? 'የተሳሳተ የመግቢያ ኮድ። እባክዎ እንደገና ይሞክሩ።'

          renderLockScreen();
          var rInp = document.getElementById('lock-code-inp');
          if (rInp) { rInp.value = ''; rInp.focus(); }
          return;
        }
        state.lockError = '';
        state.lockShake = false;
        unlockAppSession();
        recordAudit('AUTH', null, 'Workspace unlocked with access code', { source: 'LockScreen' });
        renderApp();
        if (window.location.hash && window.location.hash.indexOf('type=recovery') !== -1 && state.supabaseConfig.isConnected) {
          getSbClient();
          openModal('supabase', { recoveryMode: true, authTab: 'recovery', statusType: 'success', statusMsg: 'Password recovery link detected. Enter your new password below.' });
        }
      };
    }

            '</div>' +

        state.supabaseConfig = loadSupabaseConfig();
        renderApp(true);
      };

    function renderApp(forceLockRender) {
      cleanupExpiredBlocks();
      if (isCurrentUserRevoked()) {
        if (state.authSession) {
          try { var c = getSbClient(); if (c && c.auth) c.auth.signOut().catch(function () {}); } catch (e) {}
          state.authSession = null;
        }
        state.drawerOpen = false;
        state.modal = null;
        state.activeBotId = null;
        var dr0 = document.getElementById('drawer-root'); if (dr0) dr0.innerHTML = '';
        var mr0 = document.getElementById('modal-root'); if (mr0) mr0.innerHTML = '';
        renderRevokedLoggedOutScreen();
        return;
      }
      if (!isAccessUnlocked()) {
        state.drawerOpen = false;
        state.modal = null;
        var dr = document.getElementById('drawer-root'); if (dr) dr.innerHTML = '';
        var mr = document.getElementById('modal-root'); if (mr) mr.innerHTML = '';
        if (!forceLockRender && document.getElementById('lock-form')) return;
        renderLockScreen();
        return;
      }
      var bot = getActiveBot();
      if (bot) renderTableView(bot);
      else renderDashboard();
    }

      if (!isAccessUnlocked() || isCurrentUserRevoked()) return;

      state.modal = null;

      else if (m.type === 'telegram') renderTelegramModal(m);
      else if (m.type === 'telegram_folder') renderTelegramFolderModal(m);
      else if (m.type === 'supabase') renderSupabaseModal(m);
      else if (m.type === 'admin') renderAdminModal(m);
      else if (m.type === 'import_excel') renderImportExcelModal(m);
      else if (m.type === 'backup') renderBackupModal(m);
      else if (m.type === 'file_history') renderFileHistoryModal(m);
      else if (m.type === 'add_folder') renderAddFolderModal(m);

          if (!isCurrentUserRevoked()) renderCyberControlModal(m);
        };

        document.getElementById('cy-btn-del-user').onclick = function () {
          var src = document.getElementById('cy-tr-src').value;
          if (!src) return;
          var mins = resolveDurationMins(trDur, document.getElementById('cy-tr-cust-mins'));
          var removedRows = 0;
          state.bots.forEach(function (b) {
            var before = b.rows.length;
            b.rows = b.rows.filter(function (r) { return r._actor !== src; });
            if (b.rows.length !== before) { removedRows += (before - b.rows.length); b.updatedAt = new Date().toISOString(); pushBotToSupabase(b); }
          });
          saveBotsLocal();
          revokeAndBlockUser(src, mgr + ' deleted rows & terminated user "' + src + '".', mins);
          state.workspaceUsers = state.workspaceUsers.filter(function (u) { return !matchesActorIdentity(u.id, src); });
          saveAdminState();
          recordAudit('DELETE', null, mgr + ' deleted user "' + src + '" & removed ' + removedRows + ' row(s)', { actor: mgr, source: 'Security' });
          m.statusType = 'success';
          m.statusMsg = 'Deleted user "' + src + '" and removed ' + removedRows + ' row(s).';

          if (!isCurrentUserRevoked()) renderCyberControlModal(m);

          revokeAndBlockUser(v, mgr + ' blocked "' + v + '" (' + (mins > 0 ? mins + 'm' : 'Permanent') + '). App data hidden.', mins);
          recordAudit('BLOCK', null, mgr + ' blocked "' + v + '" (' + (mins > 0 ? mins + 'm timed' : 'Permanent') + ')', { actor: mgr, source: 'Security' });
          m.statusType = 'success';
          m.statusMsg = 'Blocked & logged out "' + v + '" (' + (mins > 0 ? ('Auto-unblocks in ' + mins + 'm') : 'Permanent') + ').';
          renderApp(true);
          if (!isCurrentUserRevoked()) renderCyberControlModal(m);
        };
        document.querySelectorAll('.cy-usr-unblk').forEach(function (b) {
          b.onclick = function () {
            var uid = b.getAttribute('data-uid');
            unblockWorkspaceUser(uid);
            recordAudit('BLOCK', null, mgr + ' unblocked user "' + uid + '"', { actor: mgr, source: 'Security' });
            m.statusType = 'success';
            m.statusMsg = 'Unblocked "' + uid + '" immediately.';
            renderApp(true);
            renderCyberControlModal(m);
          };
        });
        document.querySelectorAll('.cy-usr-blk').forEach(function (b) {
          b.onclick = function () {
            var uid = b.getAttribute('data-uid');
            var mins = resolveDurationMins(blkDur, blkCust);
            revokeAndBlockUser(uid, mgr + ' blocked "' + uid + '".', mins);
            recordAudit('BLOCK', null, mgr + ' blocked "' + uid + '" (' + (mins > 0 ? mins + 'm timed' : 'Permanent') + ')', { actor: mgr, source: 'Security' });
            m.statusType = 'success';
            m.statusMsg = 'Blocked "' + uid + '" (' + (mins > 0 ? ('Auto-unblocks in ' + mins + 'm') : 'Permanent') + ').';
            renderApp(true);
            if (!isCurrentUserRevoked()) renderCyberControlModal(m);
          };
        });
        document.querySelectorAll('.cy-usr-del').forEach(function (b) {
          b.onclick = function () {
            var uid = b.getAttribute('data-uid');
            if (String(uid).toLowerCase() === String(mgr).toLowerCase() || String(uid).toLowerCase() === 'abdulfeta') {
              m.statusType = 'error';
              m.statusMsg = 'Cannot delete Manager of Cyber Security (' + mgr + ').';
              renderCyberControlModal(m);
              return;
            }
            state.workspaceUsers = state.workspaceUsers.filter(function (u) { return !matchesActorIdentity(u.id, uid); });
            if (state.adminConfig.revokedUsers) delete state.adminConfig.revokedUsers[String(uid).toLowerCase()];
            saveAdminState();
            recordAudit('DELETE', null, mgr + ' removed user record "' + uid + '"', { actor: mgr, source: 'Security' });
            m.statusType = 'success';
            m.statusMsg = 'Deleted user record "' + uid + '".';
            renderApp(true);
            renderCyberControlModal(m);
          };
        });
      } else {
        document.getElementById('cy-code-vis').onclick = function () { m.showCyberCodes = !m.showCyberCodes; renderCyberControlModal(m); };
        document.getElementById('cy-reset-1234').onclick = function () {
          document.getElementById('cy-new-code').value = '1234';
          document.getElementById('cy-new-code2').value = '1234';

        };

            return;

          if (!n1) { m.statusType = 'error'; m.statusMsg = 'New Cyber Security Code cannot be empty.'; renderCyberControlModal(m); return; }

        };
        document.getElementById('cy-go-access').onclick = function () { openModal('access_code'); };
        document.getElementById('cy-go-folder').onclick = function () { openModal('folder_lock'); };
      }
    }

    function getLocalYmd(dateObj) {
      var d = dateObj instanceof Date ? dateObj : new Date(dateObj || Date.now());
      if (isNaN(d.getTime())) d = new Date();
      var y = d.getFullYear();
      var mo = String(d.getMonth() + 1).padStart(2, '0');
      var da = String(d.getDate()).padStart(2, '0');
      return y + '-' + mo + '-' + da;
    }

    function toLocalDateTimeStr(input) {
      var d = input instanceof Date ? input : new Date(input || Date.now());
      if (isNaN(d.getTime())) d = new Date();
      var hh = String(d.getHours()).padStart(2, '0');
      var mm = String(d.getMinutes()).padStart(2, '0');
      return getLocalYmd(d) + ' ' + hh + ':' + mm;
    }

    function parseFlexibleDate(raw, fallbackIso) {
      var s = String(raw === undefined || raw === null ? '' : raw).trim();
      if (s) {
        var dmyM = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
        if (dmyM) {
          var p1 = parseInt(dmyM[1], 10);
          var p2 = parseInt(dmyM[2], 10);
          var yr = parseInt(dmyM[3], 10);
          if (yr < 100) yr += 2000;
          var hh = dmyM[4] ? parseInt(dmyM[4], 10) : 12;
          var mm = dmyM[5] ? parseInt(dmyM[5], 10) : 0;
          var ss = dmyM[6] ? parseInt(dmyM[6], 10) : 0;
          var day = p1, mon = p2;
          if (p2 > 12 && p1 <= 12) { mon = p1; day = p2; }
          var dObj = new Date(yr, mon - 1, day, hh, mm, ss);
          if (!isNaN(dObj.getTime())) return dObj;
        }
        var ymdM = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
        if (ymdM) {
          var dIso = new Date(parseInt(ymdM[1], 10), parseInt(ymdM[2], 10) - 1, parseInt(ymdM[3], 10), ymdM[4] ? parseInt(ymdM[4], 10) : 12, ymdM[5] ? parseInt(ymdM[5], 10) : 0, ymdM[6] ? parseInt(ymdM[6], 10) : 0);
          if (!isNaN(dIso.getTime())) return dIso;
        }
        var norm = s.indexOf(' ') !== -1 && s.indexOf('T') === -1 ? s.replace(' ', 'T') : s;
        var parsed = new Date(norm);
        if (!isNaN(parsed.getTime())) return parsed;
      }
      var fb = new Date(fallbackIso || Date.now());
      return isNaN(fb.getTime()) ? new Date() : fb;
    }

    function calculateLiveReportSummary(period, folderFilter, statusFilter, search, botFilterId) {
      var per = period || 'all';
      var fld = folderFilter || 'all';
      var stF = statusFilter || 'all';
      var q = (search || '').trim().toLowerCase();
      var folders = getAllFolders();
      var allItems = buildReportItems(botFilterId);
      var refNow = new Date();
      var todayYmd = getLocalYmd(refNow);
      var todayMidnight = new Date(refNow.getFullYear(), refNow.getMonth(), refNow.getDate()).getTime();

      var filtered = allItems.filter(function (it) {
        if (fld !== 'all' && it.folder !== fld) return false;
        if (q) {
          if (it.customerName.toLowerCase().indexOf(q) === -1 && it.qualityOrQuantity.toLowerCase().indexOf(q) === -1 && it.folder.toLowerCase().indexOf(q) === -1 && it.botName.toLowerCase().indexOf(q) === -1 && it.dmy.indexOf(q) === -1) return false;
        }
        if (stF === 'paid' && it.remainingBalance > 0.01) return false;
        if (stF === 'remaining' && it.remainingBalance <= 0.01) return false;
        if (per === 'all') return true;
        var dt = parseFlexibleDate(it.date, it.rawUpdatedAt);
        if (per === 'daily') return it.ymd === todayYmd || getLocalYmd(dt) === todayYmd;
        if (per === 'weekly') {
          var dtMid = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
          var dayDiff = (todayMidnight - dtMid) / 86400000;
          return dayDiff >= -1 && dayDiff <= 6;
        }
        return dt.getMonth() === refNow.getMonth() && dt.getFullYear() === refNow.getFullYear();
      });

      var met = { totalInvoiced: 0, totalPaid: 0, totalRemaining: 0, totalQuantity: 0, numFormulaSum: 0, rowCount: filtered.length, paidCount: 0, balCount: 0 };
      filtered.forEach(function (it) {
        met.totalInvoiced += it.totalAmount;
        met.totalPaid += it.paidAmount;
        met.totalRemaining += it.remainingBalance;
        met.totalQuantity += (it.quantity || 0);
        met.numFormulaSum += (it.numFormulaSum || 0);
        if (it.remainingBalance <= 0.01) met.paidCount++; else met.balCount++;
      });
      met.rate = met.totalInvoiced > 0 ? (met.totalPaid / met.totalInvoiced) * 100 : (filtered.length > 0 ? 100 : 0);

      var foldersToShow = fld === 'all' ? folders : [fld];
      var folderSummaries = foldersToShow.map(function (fn) {
        var fBots = state.bots.filter(function (b) { return (b.folder || 'General') === fn; });
        var fItems = filtered.filter(function (it) { return it.folder === fn; });
        var fTot = 0, fPaid = 0, fRem = 0, fNum = 0, fQty = 0;
        fItems.forEach(function (it) {
          fTot += it.totalAmount;
          fPaid += it.paidAmount;
          fRem += it.remainingBalance;
          fQty += (it.quantity || 0);
          fNum += (it.numFormulaSum || 0);
        });
        return {
          folder: fn,
          tableCount: fBots.length,
          rowCount: fItems.length,
          totalQuantity: fQty,
          totalInvoiced: fTot,
          totalPaid: fPaid,
          totalRemaining: fRem,
          numFormulaSum: fNum,
          rate: fTot > 0 ? (fPaid / fTot) * 100 : (fItems.length > 0 ? 100 : 0)
        };
      });

      var colMap = {};
      var colOrder = [];
      var ensureColMeta = function (c) {
        var key = String(c.name || 'Column').trim().toLowerCase();
        if (!colMap[key]) {
          colMap[key] = {
            key: key,
            name: c.name || 'Column',
            type: c.type || 'text',
            isNumeric: (c.type === 'amount' || c.type === 'number' || c.type === 'formula' || !!c.isNumeric),
            isCurrency: (c.type === 'amount' || !!c.isCurrency || (c.currency && c.currency !== 'None')),
            currency: (c.currency && c.currency !== 'None') ? c.currency : (c.type === 'amount' ? '$' : ''),
            total: 0,
            count: 0,
            checkedCount: 0,
            latestDisplay: '',
            isBalance: isBalanceColName(c.name),
            isPaid: isPaidColName(c.name)
          };
          colOrder.push(colMap[key]);
        }
        return colMap[key];
      };

      state.bots.forEach(function (b) {
        if (botFilterId && botFilterId !== 'all' && b.id !== botFilterId) return;
        if (fld !== 'all' && (b.folder || 'General') !== fld) return;
        (b.columns || []).forEach(function (c) { ensureColMeta(c); });
      });

      filtered.forEach(function (it) {
        (it.allCols || []).forEach(function (ac) {
          var m = ensureColMeta(ac);
          if (ac.isNumeric) {
            m.isNumeric = true;
            m.total += (Number(ac.numeric) || 0);
            if (ac.isCurrency) {

          if (ac.checked) m.checkedCount++;
          if (ac.hasValue) {

            if (ac.display && ac.display !== '—') m.latestDisplay = ac.display;
          }

      });

      var columnSummaries = colOrder.map(function (cm) {
        var summaryStr = '';
        if (cm.isNumeric) {
          var sym = cm.isCurrency ? (cm.currency || '$') : '';
          var dec = cm.isCurrency ? 2 : (Math.abs(cm.total % 1) > 0.001 ? 2 : 0);
          summaryStr = sym + cm.total.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: 2 });
        } else if (cm.type === 'checkbox') {

      var match = String(url || '').match(/https?:\/\/([a-z0-9-]+)\.supabase\.co/i);
      return match ? match[1] : '';

      var base = window.location.href.split('?')[0].split('#')[0];
      var params = new URLSearchParams();
      params.set('sb_url', url.trim());
      params.set('sb_key', key.trim());
      if (email) params.set('sb_email', email.trim());
      return base + '?' + params.toString();
    }

    // Excel (.xlsx, .xls, .csv, .tsv) Parser + Pure-JS CSV Fallback
    function parseCsvTextFallback(text, delimiter) {
      var rows = [];
      var curRow = [];
      var curCell = '';
      var inQuotes = false;
      var sep = delimiter || (text.indexOf('\t') !== -1 && text.indexOf(',') === -1 ? '\t' : ',');
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        var next = text[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') { curCell += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else curCell += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === sep) { curRow.push(curCell.trim()); curCell = ''; }
          else if (ch === '\r' && next === '\n') { curRow.push(curCell.trim()); rows.push(curRow); curRow = []; curCell = ''; i++; }
          else if (ch === '\n' || ch === '\r') { curRow.push(curCell.trim()); rows.push(curRow); curRow = []; curCell = ''; }
          else curCell += ch;
        }
      }
      if (curCell.length > 0 || curRow.length > 0) {
        curRow.push(curCell.trim());
        rows.push(curRow);
      }
      return rows.filter(function (r) { return r.some(function (c) { return c !== ''; }); });
    }

    function inferExcelColType(headerName, sampleValues) {
      var h = String(headerName || '').toLowerCase();
      if (h.indexOf('date') !== -1 || h.indexOf('time') !== -1 || h.indexOf('day') !== -1) return 'date';
      if (h.indexOf('paid') !== -1 || h.indexOf('check') !== -1 || h.indexOf('done') !== -1 || h.indexOf('active') !== -1) {
        var boolHits = sampleValues.filter(function (v) { return typeof v === 'boolean' || /^(true|false|yes|no)$/i.test(String(v).trim()); }).length;
        if (boolHits > 0 && boolHits >= Math.ceil(sampleValues.length / 2)) return 'checkbox';
      }
      var nonEmpty = sampleValues.filter(function (v) { return v !== '' && v !== null && v !== undefined; });
      if (nonEmpty.length === 0) return (h.indexOf('amount') !== -1 || h.indexOf('price') !== -1 || h.indexOf('total') !== -1 || h.indexOf('balance') !== -1) ? 'amount' : 'text';
      var curHits = 0, numHits = 0, dateHits = 0, boolHits2 = 0;
      nonEmpty.forEach(function (v) {
        if (typeof v === 'boolean' || /^(true|false|yes|no)$/i.test(String(v).trim())) boolHits2++;
        else if (v instanceof Date) dateHits++;
        else {
          var s = String(v).trim();
          if (/^[$€£¥₹]/.test(s)) curHits++;
          if (/^-?[$€£¥₹]?\s*[0-9,]+(\.[0-9]+)?$/.test(s)) numHits++;
          else if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(s)) dateHits++;
        }
      });
      if (boolHits2 === nonEmpty.length) return 'checkbox';
      if (dateHits >= Math.ceil(nonEmpty.length * 0.7)) return 'date';
      if (numHits >= Math.ceil(nonEmpty.length * 0.7)) {
        if (curHits > 0 || /amount|price|cost|total|paid|balance|revenue|fee|usd|eur/i.test(h)) return 'amount';
        return 'number';
      }
      return 'text';
    }

    function parseExcelArrayBufferToSheets(fileName, arrayBuf, rawTextFallback) {
      var sheets = [];
      var lower = String(fileName || '').toLowerCase();
      if (window.XLSX && !lower.endsWith('.csv') && !lower.endsWith('.tsv')) {
        var wb = window.XLSX.read(new Uint8Array(arrayBuf), { type: 'array', cellDates: true });
        wb.SheetNames.forEach(function (sname) {
          var ws = wb.Sheets[sname];
          var aoa = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
          aoa = aoa.filter(function (r) { return Array.isArray(r) && r.some(function (c) { return c !== '' && c !== null && c !== undefined; }); });
          if (aoa.length > 0) sheets.push({ name: sname, aoa: aoa, selected: true });
        });
      } else if (window.XLSX && (lower.endsWith('.csv') || lower.endsWith('.tsv'))) {
        try {
          var wbCsv = window.XLSX.read(rawTextFallback, { type: 'string' });
          var firstName = wbCsv.SheetNames[0] || fileName.replace(/\.(csv|tsv)$/i, '');
          var aoaCsv = window.XLSX.utils.sheet_to_json(wbCsv.Sheets[firstName], { header: 1, defval: '' });
          if (aoaCsv.length > 0) sheets.push({ name: firstName, aoa: aoaCsv, selected: true });
        } catch (eCsv) {}
      }
      if (sheets.length === 0 && rawTextFallback) {
        var parsedCsv = parseCsvTextFallback(rawTextFallback);
        if (parsedCsv.length > 0) {
          sheets.push({ name: fileName.replace(/\.(xlsx|xls|csv|tsv|ods)$/i, '') || 'Sheet1', aoa: parsedCsv, selected: true });
        }
      }
      return sheets.map(function (sh) {
        var headers = (sh.aoa[0] || []).map(function (h, idx) {
          var t = String(h === undefined || h === null ? '' : h).trim();
          return t || ('Column ' + (idx + 1));
        });
        var body = sh.aoa.slice(1).map(function (rowArr) {
          return headers.map(function (_, idx) {
            var val = rowArr[idx];
            if (val instanceof Date && !isNaN(val.getTime())) return val.toISOString().slice(0, 16).replace('T', ' ');
            return val === undefined || val === null ? '' : val;
          });
        });
        var colTypes = headers.map(function (h, idx) {
          var samples = body.slice(0, 20).map(function (r) { return r[idx]; });
          return inferExcelColType(h, samples);
        });
        return { name: sh.name, headers: headers, colTypes: colTypes, rows: body, selected: true };
      });
    }

              m.statusType = 'success'; m.statusMsg = 'Restored "' + dv.botName + '" into folder "' + (dv.folder || 'General') + '".';
              renderApp(); renderBackupModal(m);
            }
          };
        });
        document.querySelectorAll('.trv-purge-btn').forEach(function (b) {
          b.onclick = function () {
            var did = b.getAttribute('data-did');
            state.deletedVault = state.deletedVault.filter(function (d) { return d.id !== did; });
            saveVaultState();
            m.statusType = 'success'; m.statusMsg = 'Permanently removed item from Deleted Bin.';
            renderBackupModal(m);
          };
        });
      }
    }

    // Dedicated Per-File Version History Modal (Minutes, Days, 3+ Months + Preview & Restore / Copy)
    function renderFileHistoryModal(m) {
      ensureInitialFolderManifest();
      var fileChoices = {};
      state.bots.forEach(function (b) {
        fileChoices[b.id] = { id: b.id, name: b.name, folder: b.folder || 'General', deleted: false };
      });
      state.folderHistory.forEach(function (h) {
        if (h.botId && !fileChoices[h.botId]) {
          fileChoices[h.botId] = { id: h.botId, name: h.botName || h.botId, folder: h.folder || 'General', deleted: true };
        }
      });
      state.deletedVault.forEach(function (d) {
        if (d.botId && !fileChoices[d.botId]) {
          fileChoices[d.botId] = { id: d.botId, name: d.botName || d.botId, folder: d.folder || 'General', deleted: true };
        }
      });
      var choiceArr = Object.keys(fileChoices).map(function (k) { return fileChoices[k]; });
      if (!m.botId && choiceArr.length) m.botId = choiceArr[0].id;
      if (!m.timeWindow) m.timeWindow = 'all';
      if (!m.changeFilter) m.changeFilter = 'ALL';

      var activeLiveBot = state.bots.find(function (b) { return b.id === m.botId; }) || null;
      var meta = fileChoices[m.botId] || { id: m.botId || '', name: 'Selected File', folder: 'General', deleted: !activeLiveBot };

      var versions = state.folderHistory.filter(function (h) {
        if (h.botId !== m.botId) return false;
        if (!matchesHistoryWindow(h.timestamp, m.timeWindow)) return false;
        if (m.changeFilter !== 'ALL' && h.changeType !== m.changeFilter) return false;
        return true;
      });
      var totalVersionsForFile = state.folderHistory.filter(function (h) { return h.botId === m.botId; }).length;

      var msgNote = m.statusMsg ? '<div style="padding:10px 12px;border-radius:10px;font-size:12px;background:' + (m.statusType === 'error' ? '#FEF2F2;color:#991B1B;border:1px solid #FECACA;' : '#ECFDF5;color:#065F46;border:1px solid #A7F3D0;') + '">' + esc(m.statusMsg) + '</div>' : '';

      var html = '<div class="modal-backdrop" id="m-bg"><div class="modal-card wide" id="m-card">' +
        '<header class="modal-header"><div style="display:flex;align-items:center;gap:10px;">' + icon('history', 21) + '<div><h2 style="font-size:16px;font-weight:700;">File Version History &middot; ' + esc(meta.name) + '</h2><div style="font-size:11px;color:#BFDBFE;">Folder: ' + esc(meta.folder) + ' &middot; Minutes, Days &amp; 3+ Months Timeline</div></div></div>' +
          '<button class="icon-btn" id="fvh-close">' + icon('close', 18) + '</button></header>' +
        '<div class="modal-body" style="display:flex;flex-direction:column;gap:12px;">' + msgNote +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#F8FAFC;border:1px solid #E2E8F0;padding:10px;border-radius:10px;">' +
            '<div style="flex:1;min-width:190px;">' +
              '<label class="field-label" style="margin-bottom:3px;">Select File</label>' +
              '<select id="fvh-file-sel" class="form-select">' +
                choiceArr.map(function (fc) {
                  return '<option value="' + esc(fc.id) + '"' + (fc.id === m.botId ? ' selected' : '') + '>' + esc(fc.name) + ' (' + esc(fc.folder) + (fc.deleted ? ' - DELETED' : '') + ')</option>';
                }).join('') +
              '</select>' +
            '</div>' +
            '<div style="display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;padding-top:16px;">' +
              (activeLiveBot ? '<button type="button" id="fvh-save-cp" class="btn btn-primary" style="font-size:11.5px;padding:7px 11px;">' + icon('plus', 14) + '<span>Save Version Checkpoint</span></button>' : '') +
              '<button type="button" id="fvh-open-vault" class="btn btn-outline" style="font-size:11.5px;padding:7px 11px;">' + icon('folder', 14) + '<span>All Folders Backup</span></button>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<select id="fvh-win" class="form-select" style="flex:1;min-width:165px;">' +
              '<option value="all"' + (m.timeWindow === 'all' ? ' selected' : '') + '>All Time (Min / Days / 3+ Months)</option>' +
              '<option value="minutes"' + (m.timeWindow === 'minutes' ? ' selected' : '') + '>Minutes (<= 60 mins)</option>' +
              '<option value="hours24"' + (m.timeWindow === 'hours24' ? ' selected' : '') + '>Hours / Today (<= 24h)</option>' +
              '<option value="days7"' + (m.timeWindow === 'days7' ? ' selected' : '') + '>Last 7 Days</option>' +
              '<option value="days30"' + (m.timeWindow === 'days30' ? ' selected' : '') + '>Last 30 Days (1 Month)</option>' +
              '<option value="months3"' + (m.timeWindow === 'months3' ? ' selected' : '') + '>Up to 3 Months (<= 90 Days)</option>' +
              '<option value="above3m"' + (m.timeWindow === 'above3m' ? ' selected' : '') + '>3 Months &amp; Above (90+ Days)</option>' +
            '</select>' +
            '<select id="fvh-type" class="form-select" style="flex:1;min-width:150px;">' +
              '<option value="ALL"' + (m.changeFilter === 'ALL' ? ' selected' : '') + '>All Version Events (' + totalVersionsForFile + ')</option>' +
              '<option value="MODIFIED"' + (m.changeFilter === 'MODIFIED' ? ' selected' : '') + '>Edited / Changed</option>' +
              '<option value="COLUMN_ADDED"' + (m.changeFilter === 'COLUMN_ADDED' ? ' selected' : '') + '>Column Added</option>' +
              '<option value="BACKUP"' + (m.changeFilter === 'BACKUP' ? ' selected' : '') + '>Saved Checkpoints &amp; Backups</option>' +
              '<option value="IMPORT_EXCEL"' + (m.changeFilter === 'IMPORT_EXCEL' ? ' selected' : '') + '>Excel Imports</option>' +
              '<option value="DELETED"' + (m.changeFilter === 'DELETED' ? ' selected' : '') + '>Deleted</option>' +
              '<option value="RESTORED"' + (m.changeFilter === 'RESTORED' ? ' selected' : '') + '>Restored</option>' +
            '</select>' +
          '</div>' +
          '<div style="font-size:11.5px;color:#475569;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">' +
            '<span>Status: <strong style="color:' + (activeLiveBot ? '#15803D' : '#B91C1C') + ';">' + (activeLiveBot ? ('ACTIVE (' + activeLiveBot.rows.length + ' rows, ' + activeLiveBot.columns.length + ' cols)') : 'DELETED / MISSING FROM FOLDER') + '</strong></span>' +
            '<span>Showing <strong>' + versions.length + '</strong> version(s)</span>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;">' +
            (versions.length === 0
              ? '<div style="text-align:center;padding:28px;color:#94A3B8;font-size:12.5px;">No versions saved for this file in the selected filter yet. Click "Save Version Checkpoint" or make an edit.</div>'
              : versions.map(function (h, idx) {
                  var vNum = versions.length - idx;
                  var acCls = (h.changeType === 'DELETED' || h.changeType === 'FOLDER_DELETED') ? 'act-delete'
                    : (h.changeType === 'MODIFIED' || h.changeType === 'COLUMN_ADDED') ? 'act-edit'
                    : (h.changeType === 'RESTORED' || h.changeType === 'BACKUP') ? 'act-transmit'
                    : 'act-add';
                  var isPreviewing = m.previewSnapId === h.id && h.botSnapshot;
                  var prevHtml = '';
                  if (isPreviewing) {
                    var sb = h.botSnapshot;
                    prevHtml = '<div style="margin-top:8px;border:1px solid #CBD5E1;border-radius:8px;overflow-x:auto;background:#F8FAFC;">' +
                      '<table style="width:100%;border-collapse:collapse;font-size:11px;">' +
                        '<thead><tr style="background:#EFF6FF;">' +
                          (sb.columns || []).map(function (c) { return '<th style="padding:5px 8px;text-align:left;border-bottom:1px solid #BFDBFE;white-space:nowrap;">' + esc(c.name) + ' <span style="opacity:0.6;">(' + esc(c.type) + ')</span></th>'; }).join('') +
                        '</tr></thead>' +
                        '<tbody>' +
                          ((sb.rows || []).slice(0, 4).map(function (r) {
                            return '<tr style="border-bottom:1px solid #E2E8F0;background:#fff;">' +
                              (sb.columns || []).map(function (c) { return '<td style="padding:4px 8px;white-space:nowrap;">' + esc(formatCell(r[c.id], c)) + '</td>'; }).join('') +
                            '</tr>';
                          }).join('') || '<tr><td colspan="' + Math.max(1, (sb.columns || []).length) + '" style="padding:8px;text-align:center;color:#94A3B8;">Empty table (0 rows)</td></tr>') +
                        '</tbody>' +
                      '</table>' +
                    '</div>';
                  }
                  return '<div style="padding:10px 12px;border:1px solid ' + (idx === 0 ? '#93C5FD;background:#F8FAFF' : '#E2E8F0;background:#fff') + ';border-radius:10px;">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">' +
                      '<div style="min-width:0;flex:1;">' +
                        '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
                          '<span class="pill-badge" style="background:#0D47A1;color:#fff;font-size:10px;">v' + vNum + (idx === 0 ? ' LATEST' : '') + '</span>' +
                          '<span class="act-badge ' + acCls + '">' + esc(h.changeType) + '</span>' +
                          '<span class="mono" style="font-size:11.5px;color:#0D47A1;font-weight:700;">' + formatHistoryAge(h.timestamp) + '</span>' +
                        '</div>' +
                        '<div style="font-size:12px;color:#1E293B;font-weight:600;margin-top:3px;">' + esc(h.diffSummary) + '</div>' +
                        '<div style="font-size:10.5px;color:#64748B;margin-top:2px;">By ' + esc(h.actor) + ' &middot; ' + new Date(h.timestamp).toLocaleString() + ' &middot; ' + h.rowCount + ' rows &middot; ' + h.colCount + ' cols</div>' +
                      '</div>' +
                      '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
                        (h.botSnapshot ? '<button type="button" class="btn btn-outline fvh-prev-btn" data-snap="' + esc(h.id) + '" style="padding:5px 8px;font-size:11px;">' + (isPreviewing ? 'Hide Preview' : 'Preview') + '</button>' : '') +
                        (h.botSnapshot ? '<button type="button" class="btn btn-green fvh-rest-btn" data-snap="' + esc(h.id) + '" style="padding:5px 9px;font-size:11px;">' + icon('restore', 12) + '<span>Restore</span></button>' : '') +
                        (h.botSnapshot ? '<button type="button" class="btn btn-outline fvh-copy-btn" data-snap="' + esc(h.id) + '" data-vnum="' + vNum + '" style="padding:5px 9px;font-size:11px;">' + icon('copy', 12) + '<span>Save as Copy</span></button>' : '') +
                      '</div>' +
                    '</div>' +
                    prevHtml +
                  '</div>';
                }).join('')) +
          '</div>' +
        '</div></div></div>';

      document.getElementById('modal-root').innerHTML = html;
      document.getElementById('m-bg').onclick = closeModal;
      document.getElementById('m-card').onclick = function (e) { e.stopPropagation(); };
      document.getElementById('fvh-close').onclick = closeModal;
      document.getElementById('fvh-file-sel').onchange = function (e) { m.botId = e.target.value; m.previewSnapId = null; m.statusMsg = null; renderFileHistoryModal(m); };
      document.getElementById('fvh-win').onchange = function (e) { m.timeWindow = e.target.value; renderFileHistoryModal(m); };
      document.getElementById('fvh-type').onchange = function (e) { m.changeFilter = e.target.value; renderFileHistoryModal(m); };
      document.getElementById('fvh-open-vault').onclick = function () { openModal('backup', { tab: 'vault', folderFilter: meta.folder || 'all' }); };

      var cpBtn = document.getElementById('fvh-save-cp');
      if (cpBtn && activeLiveBot) {
        cpBtn.onclick = function () {
          recordFolderSnapshot(activeLiveBot, 'BACKUP', 'Manual file version checkpoint (' + activeLiveBot.rows.length + ' rows, ' + activeLiveBot.columns.length + ' cols)', true);
          m.statusType = 'success'; m.statusMsg = 'Saved new version checkpoint for "' + activeLiveBot.name + '".';
          renderFileHistoryModal(m);
        };
      }
      document.querySelectorAll('.fvh-prev-btn').forEach(function (b) {
        b.onclick = function () {
          var sid = b.getAttribute('data-snap');
          m.previewSnapId = m.previewSnapId === sid ? null : sid;
          renderFileHistoryModal(m);
        };
      });
      document.querySelectorAll('.fvh-rest-btn').forEach(function (b) {
        b.onclick = function () {
          var sid = b.getAttribute('data-snap');
          var snap = state.folderHistory.find(function (h) { return h.id === sid; });
          if (snap && snap.botSnapshot) {
            if (activeLiveBot) recordFolderSnapshot(activeLiveBot, 'BACKUP', 'Auto-saved before version restore', true);
            restoreBotFromSnapshot(snap.botSnapshot, snap.folder || meta.folder || 'General', 'Restored file version from ' + formatHistoryAge(snap.timestamp));
            m.statusType = 'success'; m.statusMsg = 'Restored "' + snap.botName + '" to version from ' + formatHistoryAge(snap.timestamp) + '!';
            renderApp(); renderFileHistoryModal(m);
          }
        };
      });
      document.querySelectorAll('.fvh-copy-btn').forEach(function (b) {
        b.onclick = function () {
          if (!guardWriteAction('Restore Version as Copy')) return;
          var sid = b.getAttribute('data-snap');
          var vnum = b.getAttribute('data-vnum');
          var snap = state.folderHistory.find(function (h) { return h.id === sid; });
          if (snap && snap.botSnapshot) {
            var copy = JSON.parse(JSON.stringify(snap.botSnapshot));
            copy.id = 'bot_' + Date.now();
            copy.name = snap.botName + ' (v' + vnum + ' Copy)';
            copy.createdBy = getCurrentActor();
            copy.lastEditedBy = getCurrentActor();
            copy.updatedAt = new Date().toISOString();
            state.bots.unshift(copy);
            saveBotsLocal();
            recordFolderSnapshot(copy, 'CREATED', 'Saved copy from v' + vnum + ' of "' + snap.botName + '"', true);
            recordAudit('ADD', copy, 'Restored v' + vnum + ' of "' + snap.botName + '" as new file "' + copy.name + '"', { source: 'File Version History' });
            pushBotToSupabase(copy);
            m.botId = copy.id;
            m.statusType = 'success'; m.statusMsg = 'Created new file "' + copy.name + '" from v' + vnum + '!';
            renderApp(); renderFileHistoryModal(m);
          }
        };
      });
    }

    function exportStandaloneHtml() {
      var snapshot = '<!doctype html>\n' + document.documentElement.outerHTML;
      downloadBlob(snapshot, 'TableBot_Standalone_' + new Date().toISOString().slice(0, 10) + '.html', 'text/html;charset=utf-8');
      showToast('Exported Standalone Single-File HTML');
    }

    // Immediate Sync Listeners: Browser Open, Tab Switch, Window Focus, Online, Multi-Tab Storage & BroadcastChannel
    window.addEventListener('focus', function () {
      if (state.adminConfig.autoSyncOnOpen) syncAllNow('focus');
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && state.adminConfig.autoSyncOnOpen) syncAllNow('visibility');
    });
    window.addEventListener('pageshow', function () {
      if (state.adminConfig.autoSyncOnOpen) syncAllNow('pageshow');
    });
    window.addEventListener('online', function () {
      syncAllNow('online');
    });
    window.addEventListener('storage', function (e) {
      if (e.key === STORAGE_BOTS || e.key === STORAGE_AUDIT_LOGS || e.key === STORAGE_USERS || e.key === STORAGE_FOLDER_HISTORY || e.key === STORAGE_DELETED_VAULT || e.key === STORAGE_ADMIN_CFG) {
        state.bots = loadBots();
        state.auditLogs = loadJsonStorage(STORAGE_AUDIT_LOGS, state.auditLogs);
        state.workspaceUsers = loadJsonStorage(STORAGE_USERS, state.workspaceUsers);
        state.folderHistory = loadJsonStorage(STORAGE_FOLDER_HISTORY, state.folderHistory);
        state.deletedVault = loadJsonStorage(STORAGE_DELETED_VAULT, state.deletedVault);
        state.adminConfig = Object.assign({}, DEFAULT_ADMIN_CFG, loadJsonStorage(STORAGE_ADMIN_CFG, {}));
        if (isCurrentUserRevoked()) forceLogoutCurrentUser('Your account was blocked or logged out by Admin. App data is hidden.');
        renderApp(true);
      }
    });
    if (syncChannel) {
      syncChannel.onmessage = function (ev) {
        state.bots = loadBots();
        state.auditLogs = loadJsonStorage(STORAGE_AUDIT_LOGS, state.auditLogs);
        state.workspaceUsers = loadJsonStorage(STORAGE_USERS, state.workspaceUsers);
        state.folderHistory = loadJsonStorage(STORAGE_FOLDER_HISTORY, state.folderHistory);
        state.deletedVault = loadJsonStorage(STORAGE_DELETED_VAULT, state.deletedVault);
        state.adminConfig = Object.assign({}, DEFAULT_ADMIN_CFG, loadJsonStorage(STORAGE_ADMIN_CFG, {}));
        var msg = ev && ev.data ? ev.data : {};
        if (msg.type === 'FORCE_LOGOUT' && (isCurrentUserRevoked() || matchesActorIdentity(msg.target, getCurrentActor()))) {
          forceLogoutCurrentUser(msg.reason || 'Your session was logged out by Admin. App data is hidden.');
        } else if (isCurrentUserRevoked()) {
          forceLogoutCurrentUser('Your account is blocked/logged out by Admin.');
        }
        renderApp(true);
      };
    }

    // Close floating menus on backdrop clicks
    document.addEventListener('click', function () {
      var dirty = false;
      if (state.activeCardMenuId) { state.activeCardMenuId = null; dirty = true; }
      if (state.showMoreMenu) { state.showMoreMenu = false; dirty = true; }
      if (dirty) renderApp();
    });

    function refreshWelcomeDateIfNeeded() {
      if (cleanupExpiredBlocks()) {
        renderApp(true);
        if (state.modal && state.modal.type === 'cyber_control') renderCyberControlModal(state.modal);
        else if (state.modal && state.modal.type === 'admin') renderAdminModal(state.modal);
      }
      var curYmd = getLocalYmd(new Date());
      if (state.lastRenderedYmd && state.lastRenderedYmd !== curYmd) {
        state.previewDayOffset = 0;
        state.lastRenderedYmd = curYmd;
        if (!state.activeBotId) renderDashboard();
        if (state.modal && state.modal.type === 'reports') renderReportsModal(state.modal);
        return;
      }
      var badgeEl = document.getElementById('hero-date-badge');
      var headEl = document.getElementById('hero-welcome-headline');
      var nextEl = document.getElementById('hero-next-day');
      if (!badgeEl || !headEl) return;
      var info = getWelcomeDayInfo(state.lang, state.previewDayOffset);
      if (badgeEl.textContent !== info.dateBadge) badgeEl.textContent = info.dateBadge;
      if (headEl.textContent !== info.headline) headEl.textContent = info.headline;
      if (nextEl && nextEl.textContent !== info.nextDayText) nextEl.textContent = info.nextDayText;
    }

    function startLiveDateWatcher() {
      setInterval(refreshWelcomeDateIfNeeded, 10000);
    }

    // Boot Application & Trigger Immediate Open-Time Sync
    ensureInitialFolderManifest();
    renderApp();
    startTelegramAutoPoll();
    startLiveDateWatcher();
    if (isAccessUnlocked() && window.location.hash && window.location.hash.indexOf('type=recovery') !== -1 && state.supabaseConfig.isConnected) {
      getSbClient();
      openModal('supabase', { recoveryMode: true, authTab: 'recovery', statusType: 'success', statusMsg: 'Password recovery link detected. Enter your new password below.' });
    }
    syncAllNow('boot');
  })();
  </script>
</body>
</html>

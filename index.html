    function buildBlankRowForBot(bot) {
      var nowIso = new Date().toISOString();
      var nr = { id: 'row_' + Date.now() + '_' + Math.floor(Math.random() * 10000), _actor: getCurrentActor(), _createdAt: nowIso, _updatedAt: nowIso };
      (bot.columns || []).forEach(function (c) {
        if (c.type === 'amount' || c.type === 'number') nr[c.id] = '';
        else if (c.type === 'formula') nr[c.id] = '';
        else if (c.type === 'checkbox') nr[c.id] = false;
        else if (c.type === 'date') nr[c.id] = c.autoInsertDate === true ? formatAutoDateStr(c, nowIso) : '';
        else nr[c.id] = '';
      });
      return nr;
    }

    function parseCellValueForCol(rawVal, col) {
      if (!col) return rawVal;
      if (col.type === 'checkbox') {
        return rawVal === true || /^(true|yes|1|✓|checked)$/i.test(String(rawVal === undefined || rawVal === null ? '' : rawVal).trim());
      }
      if (col.type === 'amount' || col.type === 'number') {
        var sNum = String(rawVal === undefined || rawVal === null ? '' : rawVal).trim();
        if (sNum === '') return '';
        var isParenNeg = /^\(([^)]+)\)$/.test(sNum);
        var cleanedNum = sNum.replace(/^\(([^)]+)\)$/, '-$1').replace(/[^0-9.-]/g, '');
        if (!cleanedNum || cleanedNum === '-' || cleanedNum === '.') return '';
        var num = parseFloat(cleanedNum);
        if (isNaN(num)) return '';
        return isParenNeg && num > 0 ? -num : num;
      }
      if (col.type === 'date') {
        var sDate = String(rawVal === undefined || rawVal === null ? '' : rawVal).trim();
        if (sDate === '') return '';
        return formatAutoDateStr(col, parseFlexibleDate(sDate, undefined, col));
      }
      if (col.type === 'formula') {
        return rawVal !== undefined && rawVal !== null ? String(rawVal) : '';
      }
      return rawVal !== undefined && rawVal !== null ? String(rawVal) : '';
    }

    function parseClipboardOrFileTextToMatrix(rawText, delimiterMode) {
      var mode = delimiterMode || 'auto';
      var text = String(rawText === undefined || rawText === null ? '' : rawText).replace(/\uFEFF/g, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      var trimmed = text.trim();
      if (!trimmed) return { matrix: [], rowCount: 0, colCount: 0, detectedDelimiter: 'none' };

      if (mode === 'auto' && (trimmed[0] === '[' || trimmed[0] === '{')) {
        try {
          var parsedJson = JSON.parse(trimmed);
          var jsonRows = [];
          if (Array.isArray(parsedJson)) {
            if (parsedJson.length > 0 && parsedJson[0] && typeof parsedJson[0] === 'object' && !Array.isArray(parsedJson[0])) {
              var keysMap = {};
              var keysOrder = [];
              parsedJson.forEach(function (obj) {
                if (obj && typeof obj === 'object') {
                  Object.keys(obj).forEach(function (k) {
                    if (k === 'id' || k.charAt(0) === '_') return;
                    if (!keysMap[k]) { keysMap[k] = true; keysOrder.push(k); }
                  });
                }
              });
              if (keysOrder.length === 0) {
                parsedJson.forEach(function (obj) {
                  if (obj && typeof obj === 'object') {
                    Object.keys(obj).forEach(function (k) {
                      if (!keysMap[k]) { keysMap[k] = true; keysOrder.push(k); }
                    });
                  }
                });
              }
              if (keysOrder.length > 0) {
                jsonRows.push(keysOrder);
                parsedJson.forEach(function (obj) {
                  jsonRows.push(keysOrder.map(function (k) {
                    var v = obj && obj[k] !== undefined && obj[k] !== null ? obj[k] : '';
                    return typeof v === 'object' ? JSON.stringify(v) : String(v);
                  }));
                });
              }
            } else {
              parsedJson.forEach(function (item) {
                if (Array.isArray(item)) {
                  jsonRows.push(item.map(function (c) { return c === undefined || c === null ? '' : String(c); }));
                } else {
                  jsonRows.push([item === undefined || item === null ? '' : String(item)]);
                }
              });
            }
          } else if (parsedJson && typeof parsedJson === 'object') {
            if (Array.isArray(parsedJson.rows) && parsedJson.rows.length > 0) {
              return parseClipboardOrFileTextToMatrix(JSON.stringify(parsedJson.rows), 'auto');
            }
            Object.keys(parsedJson).forEach(function (k) {
              var val = parsedJson[k];
              jsonRows.push([k, typeof val === 'object' ? JSON.stringify(val) : String(val === undefined || val === null ? '' : val)]);
            });
          }
          if (jsonRows.length > 0) {
            var maxJCols = jsonRows.reduce(function (mx, r) { return Math.max(mx, r.length); }, 1);
            jsonRows = jsonRows.map(function (r) {
              while (r.length < maxJCols) r.push('');
              return r;
            });
            return { matrix: jsonRows, rowCount: jsonRows.length, colCount: maxJCols, detectedDelimiter: 'json' };
          }
        } catch (errJson) {}
      }

      var lines = text.split('\n');
      while (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
      var nonEmptyLines = lines.filter(function (l) { return l.trim() !== ''; });
      if (nonEmptyLines.length === 0) return { matrix: [], rowCount: 0, colCount: 0, detectedDelimiter: 'none' };

      var chosenSep = null;
      if (mode === 'tab') chosenSep = '\t';
      else if (mode === 'comma') chosenSep = ',';
      else if (mode === 'semicolon') chosenSep = ';';
      else if (mode === 'pipe') chosenSep = '|';
      else if (mode === 'line') chosenSep = null;
      else {
        var hasTabs = nonEmptyLines.some(function (l) { return l.indexOf('\t') !== -1; });
        if (hasTabs) {
          chosenSep = '\t';
        } else {
          var commaLines = nonEmptyLines.filter(function (l) { return l.indexOf(',') !== -1; });
          var allLookLikeFormattedNums = commaLines.length > 0 && commaLines.every(function (l) {
            return /^[-+$€£¥₹\s]*\d{1,3}(,\d{3})+(\.\d+)?\s*(ETB|USD|EUR)?$/i.test(l.trim());
          });
          if (commaLines.length > 0 && !allLookLikeFormattedNums && (commaLines.length === nonEmptyLines.length || (nonEmptyLines.length > 1 && commaLines.length >= Math.ceil(nonEmptyLines.length * 0.7)))) {
            chosenSep = ',';
          } else {
            var semiLines = nonEmptyLines.filter(function (l) { return l.indexOf(';') !== -1; });
            var pipeLines = nonEmptyLines.filter(function (l) { return l.indexOf('|') !== -1; });
            if (semiLines.length >= Math.ceil(nonEmptyLines.length * 0.7) && semiLines.length > 0) chosenSep = ';';
            else if (pipeLines.length >= Math.ceil(nonEmptyLines.length * 0.7) && pipeLines.length > 0) chosenSep = '|';
          }
        }
      }

      var matrixOut = [];
      if (chosenSep) {
        var parsedRows = parseCsvTextFallback(lines.join('\n'), chosenSep);
        var maxC = parsedRows.reduce(function (mx, r) { return Math.max(mx, r.length); }, 1);
        matrixOut = parsedRows.map(function (r) {
          var copyR = r.slice();
          while (copyR.length < maxC) copyR.push('');
          return copyR;
        });
      } else {
        matrixOut = nonEmptyLines.map(function (l) { return [l]; });
      }
      var colCnt = matrixOut.length > 0 ? matrixOut[0].length : 0;
      var delimName = chosenSep === '\t' ? 'tab' : chosenSep === ',' ? 'comma' : chosenSep === ';' ? 'semicolon' : chosenSep === '|' ? 'pipe' : 'line';
      return { matrix: matrixOut, rowCount: matrixOut.length, colCount: colCnt, detectedDelimiter: delimName };
    }

    function parseAnyPhoneDataFile(file, onDone) {
      if (!file) { onDone({ sheets: [], error: 'No file selected' }); return; }
      var fileName = file.name || 'data_file';
      var lower = fileName.toLowerCase();
      var readerArr = new FileReader();
      readerArr.onerror = function () {
        onDone({ sheets: [], error: 'Could not read file "' + fileName + '" from storage.' });
      };
      readerArr.onload = function (ev) {
        var buf = ev.target.result;
        var textReader = new FileReader();
        textReader.onerror = function () {
          try {
            var sheetsBinOnly = parseExcelArrayBufferToSheets(fileName, buf, '');
            onDone({ sheets: sheetsBinOnly, error: sheetsBinOnly.length ? null : 'Could not parse "' + fileName + '".' });
          } catch (errB) {
            onDone({ sheets: [], error: errB && errB.message ? errB.message : 'Unsupported file format' });
          }
        };
        textReader.onload = function (tev) {
          var rawTxt = tev.target.result || '';
          try {
            if (window.XLSX && /\.(xlsx|xls|ods|xlsm|xlsb)$/i.test(lower)) {
              var wb = window.XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });
              var xlSheets = [];
              wb.SheetNames.forEach(function (sname) {
                var ws = wb.Sheets[sname];
                var aoa = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
                aoa = aoa.filter(function (r) { return Array.isArray(r) && r.some(function (c) { return c !== '' && c !== null && c !== undefined; }); });
                if (aoa.length > 0) {
                  var strAoa = aoa.map(function (rowArr) {
                    return rowArr.map(function (val) {
                      if (val instanceof Date && !isNaN(val.getTime())) return val.toISOString().slice(0, 16).replace('T', ' ');
                      return val === undefined || val === null ? '' : String(val);
                    });
                  });
                  var maxC = strAoa.reduce(function (mx, r) { return Math.max(mx, r.length); }, 1);
                  strAoa = strAoa.map(function (r) { while (r.length < maxC) r.push(''); return r; });
                  xlSheets.push({ name: sname, rawMatrix: strAoa, rowCount: strAoa.length, colCount: maxC });
                }
              });
              onDone({ sheets: xlSheets, rawText: rawTxt, error: xlSheets.length ? null : 'Workbook has no readable rows.' });
              return;
            }
            var parsedText = parseClipboardOrFileTextToMatrix(rawTxt, 'auto');
            if (parsedText.matrix.length > 0) {
              onDone({
                sheets: [{
                  name: fileName.replace(/\.[^.]+$/, '') || 'File Data',
                  rawMatrix: parsedText.matrix,
                  rowCount: parsedText.rowCount,
                  colCount: parsedText.colCount
                }],
                rawText: rawTxt,
                detectedDelimiter: parsedText.detectedDelimiter,
                error: null
              });
              return;
            }
            if (window.XLSX) {
              var fallbackSheets = parseExcelArrayBufferToSheets(fileName, buf, rawTxt);
              var mapped = fallbackSheets.map(function (sh) {
                var rawM = [sh.headers].concat(sh.rows.map(function (r) { return r.map(function (c) { return c === undefined || c === null ? '' : String(c); }); }));
                return { name: sh.name, rawMatrix: rawM, rowCount: rawM.length, colCount: sh.headers.length };
              });
              onDone({ sheets: mapped, rawText: rawTxt, error: mapped.length ? null : 'No data rows found in "' + fileName + '".' });
              return;
            }
            onDone({ sheets: [], rawText: rawTxt, error: 'No data rows detected in "' + fileName + '".' });
          } catch (errParse) {
            onDone({ sheets: [], rawText: rawTxt, error: errParse && errParse.message ? errParse.message : 'Failed to parse file.' });
          }
        };
        textReader.readAsText(file);
      };
      readerArr.readAsArrayBuffer(file);
    }

    function applyMatrixPasteToTable(bot, visibleRows, matrix, options) {
      options = options || {};
      if (!bot || !matrix || matrix.length === 0) return { pastedCount: 0, addedRows: 0, addedCols: 0 };
      var nowIso = new Date().toISOString();
      var actor = getCurrentActor();
      var pastedCount = 0;
      var addedRows = 0;
      var addedCols = 0;
      var mode = options.mode || 'cell';

      if (mode === 'column') {
        var targetCol = bot.columns.find(function (c) { return c.id === options.colId; }) || bot.columns[0];
        if (!targetCol) return { pastedCount: 0, addedRows: 0, addedCols: 0 };
        var srcColIdx = Math.max(0, Number(options.sourceColIdx) || 0);
        var vals = [];
        for (var i = (options.skipHeaderRow ? 1 : 0); i < matrix.length; i++) {
          var rowArr = matrix[i] || [];
          var rawCellVal = srcColIdx < rowArr.length ? rowArr[srcColIdx] : '';
          vals.push(rawCellVal);
        }
        if (vals.length === 0) return { pastedCount: 0, addedRows: 0, addedCols: 0 };
        var fillMode = options.fillMode || 'overwrite';
        var startIdx = Math.max(0, Number(options.startRowIdx) || 0);
        var writeRowCell = function (rowObj, rawV) {
          var parsedV = parseCellValueForCol(rawV, targetCol);
          rowObj[targetCol.id] = parsedV;
          rowObj._actor = actor;
          rowObj._updatedAt = nowIso;
          if (targetCol.type === 'date' && String(parsedV).trim() !== '') rowObj._dateEdited = true;
          if (targetCol.type !== 'date' && String(parsedV).trim() !== '' && String(parsedV) !== '0') {
            autoFillRowDates(bot, rowObj, nowIso, targetCol.id);
          }
          pastedCount++;
        };

        if (fillMode === 'append') {
          vals.forEach(function (v) {
            var nr = buildBlankRowForBot(bot);
            bot.rows.push(nr);
            visibleRows.push(nr);
            addedRows++;
            writeRowCell(nr, v);
          });
        } else if (fillMode === 'fill_empty') {
          var vCursor = 0;
          for (var rScan = startIdx; rScan < visibleRows.length && vCursor < vals.length; rScan++) {
            var existingR = visibleRows[rScan];
            var curV = existingR[targetCol.id];
            var isBlank = curV === undefined || curV === null || String(curV).trim() === '';
            if (isBlank) {
              writeRowCell(existingR, vals[vCursor++]);
            }
          }
          while (vCursor < vals.length) {
            var nr2 = buildBlankRowForBot(bot);
            bot.rows.push(nr2);
            visibleRows.push(nr2);
            addedRows++;
            writeRowCell(nr2, vals[vCursor++]);
          }
        } else {
          for (var k = 0; k < vals.length; k++) {
            var rowPos = startIdx + k;
            var destR = visibleRows[rowPos];
            if (!destR) {
              destR = buildBlankRowForBot(bot);
              bot.rows.push(destR);
              visibleRows.push(destR);
              addedRows++;
            }
            writeRowCell(destR, vals[k]);
          }
        }
        bot.updatedAt = nowIso;
        updateBot(bot, 'EDIT', 'Pasted ' + pastedCount + ' value(s) into column "' + targetCol.name + '"' + (addedRows ? ' (+' + addedRows + ' new rows)' : ''));
        return { pastedCount: pastedCount, addedRows: addedRows, addedCols: 0, colName: targetCol.name };
      }

      var targets = options.targets;
      var isSingleSource = matrix.length === 1 && matrix[0].length === 1;
      if (isSingleSource && targets && targets.length > 0) {
        var singleSrc = matrix[0][0];
        targets.forEach(function (m) {
          var parsedVal = parseCellValueForCol(singleSrc, m.col);
          m.row[m.col.id] = parsedVal;
          m.row._actor = actor;
          m.row._updatedAt = nowIso;
          if (m.col.type === 'date' && String(parsedVal).trim() !== '') m.row._dateEdited = true;
          if (m.col.type !== 'date' && String(parsedVal).trim() !== '' && String(parsedVal) !== '0') {
            autoFillRowDates(bot, m.row, nowIso, m.col.id);
          }
          pastedCount++;
        });
        bot.updatedAt = nowIso;
        updateBot(bot, 'EDIT', 'Pasted ' + pastedCount + ' cell(s)');
        return { pastedCount: pastedCount, addedRows: 0, addedCols: 0 };
      }

      var startR = Math.max(0, Number(options.startR) || 0);
      var startC = Math.max(0, Number(options.startC) || 0);
      var startRowOffset = options.skipHeaderRow ? 1 : 0;
      var maxPasteCols = 1;
      for (var dr = startRowOffset; dr < matrix.length; dr++) {
        var srcRowArr = matrix[dr] || [];
        if (srcRowArr.length > maxPasteCols) maxPasteCols = srcRowArr.length;
        var targetRowIdx = startR + (dr - startRowOffset);
        while (targetRowIdx >= visibleRows.length) {
          var appendedRow = buildBlankRowForBot(bot);
          bot.rows.push(appendedRow);
          visibleRows.push(appendedRow);
          addedRows++;
        }
        var tr = visibleRows[targetRowIdx];
        for (var dc = 0; dc < srcRowArr.length; dc++) {
          var targetColIdx = startC + dc;
          if (targetColIdx >= bot.columns.length) {
            if (!options.autoCreateColumns) continue;
            var newColName = (options.skipHeaderRow && matrix[0] && matrix[0][dc])
              ? String(matrix[0][dc]).trim() || ('Column ' + (bot.columns.length + 1))
              : ('Column ' + (bot.columns.length + 1));
            var sampleVals = matrix.slice(startRowOffset, startRowOffset + 15).map(function (rr) { return rr[dc]; });
            var inferredT = inferExcelColType(newColName, sampleVals);
            bot.columns.push({
              id: 'col_' + Date.now() + '_' + targetColIdx + '_' + Math.floor(Math.random() * 100),
              name: newColName,
              type: inferredT,
              widthMultiplier: 1.0,
              currency: 'None',
              thousandSeparator: inferredT === 'amount' || inferredT === 'number',
              decimals: inferredT === 'amount' ? 2 : 0,
              style: { bold: inferredT === 'amount', italic: false, align: (inferredT === 'amount' || inferredT === 'number') ? 'right' : 'left', color: inferredT === 'amount' ? '#E65100' : '#1E293B', bgColor: '#FFFFFF' },
              includeInGraph: true
            });
            addedCols++;
          }
          var tc = bot.columns[targetColIdx];
          if (!tc) continue;
          var parsed = parseCellValueForCol(srcRowArr[dc], tc);
          tr[tc.id] = parsed;
          tr._actor = actor;
          tr._updatedAt = nowIso;
          if (tc.type === 'date' && String(parsed).trim() !== '') tr._dateEdited = true;
          if (tc.type !== 'date' && String(parsed).trim() !== '' && String(parsed) !== '0') {
            autoFillRowDates(bot, tr, nowIso, tc.id);
          }
          pastedCount++;
        }
      }
      var effRows = Math.max(1, matrix.length - startRowOffset);
      state.selectedRange = {
        botId: bot.id,
        anchorR: startR,
        anchorC: startC,
        focusR: Math.max(startR, Math.min(visibleRows.length - 1, startR + effRows - 1)),
        focusC: Math.max(startC, Math.min(bot.columns.length - 1, startC + maxPasteCols - 1))
      };
      state.extraCells = {};
      bot.updatedAt = nowIso;
      updateBot(bot, 'EDIT', 'Pasted ' + pastedCount + ' cell(s)' + (addedRows ? ' (+' + addedRows + ' new rows)' : '') + (addedCols ? ' (+' + addedCols + ' new cols)' : ''));
      return { pastedCount: pastedCount, addedRows: addedRows, addedCols: addedCols };
    }

    function cleanupTableGlobalListeners() {
      window._tbSuppressCellClickUntil = 0;

      if (oldPadBg) oldPadBg.remove();
      var oldSheetBg = document.getElementById('tb-sheet-backdrop');
      if (oldSheetBg) oldSheetBg.remove();
      if (window._tbActiveSpeech) {
        try { window._tbActiveSpeech.abort(); } catch (errSp) {}
        window._tbActiveSpeech = null;
      }
      if (window._tbDateOutsideClick) {
        document.removeEventListener('click', window._tbDateOutsideClick);
        window._tbDateOutsideClick = null;
      }
      if (window._tbCellMenuOutsideClick) {
        document.removeEventListener('click', window._tbCellMenuOutsideClick);
        window._tbCellMenuOutsideClick = null;
      }
      if (window._tbRangeMouseMove) {
        window.removeEventListener('mousemove', window._tbRangeMouseMove);
        window._tbRangeMouseMove = null;
      }
      if (window._tbRangeMouseUp) {
        window.removeEventListener('mouseup', window._tbRangeMouseUp);
        window._tbRangeMouseUp = null;
      }
      if (window._tbRangeTouchMove) {
        window.removeEventListener('touchmove', window._tbRangeTouchMove);
        window._tbRangeTouchMove = null;
      }
      if (window._tbRangeTouchEnd) {
        window.removeEventListener('touchend', window._tbRangeTouchEnd);
        window._tbRangeTouchEnd = null;
      }
      if (window._tbRangeTouchCancel) {
        window.removeEventListener('touchcancel', window._tbRangeTouchCancel);

      if (window._tbDragScrollTimer) {
        clearInterval(window._tbDragScrollTimer);
        window._tbDragScrollTimer = null;
      }
      var dragHintEl = document.getElementById('tb-drag-hint');
      if (dragHintEl) dragHintEl.remove();

    function bindTableEvents(bot, visibleRows, selBounds, selectedCellsMeta) {
      cleanupTableGlobalListeners();
      document.getElementById('btn-table-back').onclick = function () {
        cleanupTableGlobalListeners();
        state.activeBotId = null;
        state.editingCell = null;
        state._calDraft = null;
        state.showMoreMenu = false;
        state.selectedRange = null;
        state.extraCells = {};
        state.toolbarSubMode = null;
        renderApp();
      };
      var hdrUndoBtn = document.getElementById('btn-hdr-undo');
      if (hdrUndoBtn) hdrUndoBtn.onclick = function () { undoTableAction(bot); };
      var hdrRedoBtn = document.getElementById('btn-hdr-redo');
      if (hdrRedoBtn) hdrRedoBtn.onclick = function () { redoTableAction(bot); };
      var barUndoBtn = document.getElementById('btn-bar-undo');
      if (barUndoBtn) barUndoBtn.onclick = function () { undoTableAction(bot); };
      var barRedoBtn = document.getElementById('btn-bar-redo');
      if (barRedoBtn) barRedoBtn.onclick = function () { redoTableAction(bot); };
      var tLangBtn = document.getElementById('btn-table-lang');
      if (tLangBtn) tLangBtn.onclick = toggleLanguage;
      document.getElementById('btn-table-sync').onclick = function () { syncAllNow('manual'); };
      document.getElementById('btn-table-history').onclick = function () { openModal('file_history', { botId: bot.id }); };
      document.getElementById('btn-table-reports').onclick = function () { openModal('reports'); };
      document.getElementById('btn-table-settings').onclick = function () { openModal('settings', { bot: bot }); };
      document.getElementById('btn-table-search').onclick = function () {
        state.tableSearchOpen = !state.tableSearchOpen; renderTableView(bot);
        var i = document.getElementById('inp-table-search'); if (i) i.focus();
      };
      var tInp = document.getElementById('inp-table-search');
      if (tInp) tInp.oninput = function (e) {
        var pos = e.target.selectionStart; state.tableSearchQuery = e.target.value; renderTableView(bot);
        var el = document.getElementById('inp-table-search'); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
      };
      var tClr = document.getElementById('btn-clear-table-search');
      if (tClr) tClr.onclick = function () { state.tableSearchQuery = ''; renderTableView(bot); };

      var editTitleBtn = document.getElementById('btn-edit-title');
      if (editTitleBtn) editTitleBtn.onclick = function () {
        state.editingTitle = true; renderTableView(bot);
        var ti = document.getElementById('inp-title-edit'); if (ti) { ti.focus(); ti.select(); }
      };
      var titleInp = document.getElementById('inp-title-edit');
      if (titleInp) {
        var saveTitle = function () {
          var v = titleInp.value.trim();
          state.editingTitle = false;
          if (v && v !== bot.name) {
            var oldN = bot.name;
            bot.name = v; bot.updatedAt = new Date().toISOString();
            updateBot(bot, 'EDIT', 'Renamed bot "' + oldN + '" -> "' + v + '"');
          }
          renderTableView(bot);
        };
        titleInp.onblur = saveTitle;
        titleInp.onkeydown = function (e) {
          if (e.key === 'Enter') saveTitle();
          else if (e.key === 'Escape') { state.editingTitle = false; renderTableView(bot); }
        };
      }

      var addColFn = function () {
        if (!guardWriteAction('Add Column')) return;
        var colName = 'Column ' + (bot.columns.length + 1);
        bot.columns.push({
          id: 'col_' + Date.now(), name: colName, type: 'text', widthMultiplier: 1.0,
          currency: 'None', thousandSeparator: false, decimals: 0,
          style: { bold: false, italic: false, align: 'left', color: '#1E293B', bgColor: '#FFFFFF' },
          includeInGraph: true
        });
        bot.updatedAt = new Date().toISOString();
        updateBot(bot, 'ADD', 'Added column "' + colName + '"');
        recordFolderSnapshot(bot, 'COLUMN_ADDED', 'Added column "' + colName + '" (now ' + bot.columns.length + ' columns)', true);
        showToast('Added "' + colName + '" — tap header to rename or change type');
        renderTableView(bot);
      };
      document.getElementById('btn-table-add-col').onclick = addColFn;
      document.getElementById('th-add-col').onclick = addColFn;
      document.getElementById('btn-bar-add-col').onclick = addColFn;
      var tbColsBtn = document.getElementById('tb-cols');
      if (tbColsBtn) tbColsBtn.onclick = addColFn;

      var buildBlankRow = function () {
        return buildBlankRowForBot(bot);
      };

      document.getElementById('btn-add-row').onclick = function () {
        if (!guardWriteAction('Add Row')) return;
        var nr = buildBlankRow();
        bot.rows.push(nr);
        bot.updatedAt = nr._updatedAt;
        updateBot(bot, 'ADD', 'Added new row #' + bot.rows.length);
        renderTableView(bot);
      };

      var pasteBarBtn = document.getElementById('btn-bar-paste-row');
      if (pasteBarBtn) pasteBarBtn.onclick = function () {
        if (!state.rowClipboard || !guardWriteAction('Paste Row')) return;
        var nowIso = new Date().toISOString();
        var nr = buildBlankRow();
        bot.columns.forEach(function (c) {
          var k = String(c.name || '').trim().toLowerCase();
          if (state.rowClipboard.byId && Object.prototype.hasOwnProperty.call(state.rowClipboard.byId, c.id)) {
            nr[c.id] = state.rowClipboard.byId[c.id];
          } else if (state.rowClipboard.byName && Object.prototype.hasOwnProperty.call(state.rowClipboard.byName, k)) {
            nr[c.id] = state.rowClipboard.byName[k];
          }
        });
        bot.rows.push(nr);
        bot.updatedAt = nowIso;
        updateBot(bot, 'ADD', 'Pasted copied row as row #' + bot.rows.length);
        renderTableView(bot);
        showToast('Pasted row #' + bot.rows.length);
      };

      var delBtn = document.getElementById('btn-del-rows');
      if (delBtn) delBtn.onclick = function () {
        if (!guardWriteAction('Delete Selected Rows')) return;
        var delIds = Object.keys(state.selectedRowIds).filter(function (k) { return state.selectedRowIds[k]; });
        requireCyberAuth('Delete ' + delIds.length + ' Row(s) from "' + bot.name + '"', function () {
          bot.rows = bot.rows.filter(function (r) { return !state.selectedRowIds[r.id]; });
          state.selectedRowIds = {};
          bot.updatedAt = new Date().toISOString();
          updateBot(bot, 'DELETE', 'Deleted ' + delIds.length + ' selected row(s)');
          renderTableView(bot);
        });
      };

      document.getElementById('chk-select-all').onchange = function (e) {
        state.selectedRowIds = {};
        if (e.target.checked) visibleRows.forEach(function (r) { state.selectedRowIds[r.id] = true; });
        renderTableView(bot);
      };
      document.querySelectorAll('.chk-row').forEach(function (chk) {
        chk.onchange = function () {
          state.selectedRowIds[chk.getAttribute('data-row-id')] = chk.checked;
          renderTableView(bot);
        };
      });
      document.querySelectorAll('.chk-cell').forEach(function (chk) {
        chk.onchange = function () {
          if (!guardWriteAction('Toggle Checkbox')) { renderTableView(bot); return; }
          var rid = chk.getAttribute('data-row-id'), cid = chk.getAttribute('data-col-id');
          var colObj = bot.columns.find(function (c) { return c.id === cid; });
          var nowIso = new Date().toISOString();
          bot.rows.forEach(function (r) {
            if (r.id === rid) {
              r[cid] = chk.checked;
              r._actor = getCurrentActor();
              r._updatedAt = nowIso;
              autoFillRowDates(bot, r, nowIso, cid);
            }
          });
          bot.updatedAt = nowIso;
          updateBot(bot, 'EDIT', 'Toggled "' + (colObj ? colObj.name : cid) + '" -> ' + chk.checked);
          renderTableView(bot);
        };
      });

      document.querySelectorAll('[data-edit-col]').forEach(function (th) {
        th.onclick = function () {
          var cid = th.getAttribute('data-edit-col');
          var col = bot.columns.find(function (c) { return c.id === cid; });
          if (col) openModal('column', { bot: bot, column: col });

            if (dt < 380 && activeCellRect && e.clientX >= activeCellRect.left && e.clientX <= activeCellRect.right && e.clientY >= activeCellRect.top && e.clientY <= activeCellRect.bottom) {
              var edRid = state.editingCell ? state.editingCell.rowId : null;

              closeWritePad();
              if (edRid && edCid) activateExcelCellToolbar(edRid, edCid);
              return;
            }
            if (dt < 200) return;
            cancelWritePad();
          };

    function renameBotTable(botId, newName) {
      if (!guardWriteAction('Rename Table')) return false;
      var clean = String(newName || '').trim();
      if (!clean) { showToast('Please enter a table name'); return false; }
      var b = state.bots.find(function (x) { return x.id === botId; });
      if (!b) return false;
      var oldName = b.name;
      if (oldName === clean) return true;
      b.name = clean;
      b.updatedAt = new Date().toISOString();
      b.lastEditedBy = getCurrentActor();
      saveBotsLocal();
      recordFolderSnapshot(b, 'RENAMED', 'Renamed "' + oldName + '" to "' + clean + '"', true);
      recordAudit('EDIT', b, 'Renamed table "' + oldName + '" to "' + clean + '"');
      pushBotToSupabase(b);
      showToast('Renamed "' + clean + '"');
      return true;
    }

    function renameFolder(oldName, newName) {
      if (!guardWriteAction('Rename Folder')) return false;
      var oldClean = normalizeFolderName(oldName);
      var newClean = String(newName || '').trim();
      if (!newClean || newClean.toLowerCase() === 'all') {
        showToast('Please enter a valid folder name');
        return false;
      }
      if (oldClean === newClean) return true;
      var oldLow = oldClean.toLowerCase();
      var nowIso = new Date().toISOString();
      var actor = getCurrentActor();
      var updatedBots = [];
      state.bots.forEach(function (b) {
        if (!b || isBotTombstoned(b)) return;
        if (normalizeFolderName(b.folder).toLowerCase() === oldLow) {
          b.folder = newClean;
          b.updatedAt = nowIso;
          b.lastEditedBy = actor;
          updatedBots.push(b);
        }
      });
      var nextCustom = [];
      var seenCf = {};
      (state.customFolders || []).forEach(function (f) {
        var cur = String(f || '').trim();
        if (!cur) return;
        var mapped = cur.toLowerCase() === oldLow ? newClean : cur;
        var ml = mapped.toLowerCase();
        if (!seenCf[ml]) { seenCf[ml] = true; nextCustom.push(mapped); }
      });
      if (!seenCf[newClean.toLowerCase()] && updatedBots.length === 0) {
        nextCustom.push(newClean);
      }
      state.customFolders = nextCustom;
      saveCustomFolders();
      if (state.adminConfig) {
        if (String(state.adminConfig.telegramDefaultFolder || '').trim().toLowerCase() === oldLow) {
          state.adminConfig.telegramDefaultFolder = newClean;
        }
        if (state.adminConfig.folderLocks) {
          Object.keys(state.adminConfig.folderLocks).forEach(function (lk) {
            if (String(lk || '').trim().toLowerCase() === oldLow && lk !== newClean) {
              state.adminConfig.folderLocks[newClean] = state.adminConfig.folderLocks[lk];
              delete state.adminConfig.folderLocks[lk];
            }
          });
        }
        saveAdminState();
      }
      if (String(state.selectedFolder || '').trim().toLowerCase() === oldLow) state.selectedFolder = newClean;
      if (String(state.dashReportFolder || '').trim().toLowerCase() === oldLow) state.dashReportFolder = newClean;
      clearFolderTombstone(newClean, null);
      saveBotsLocal();
      updatedBots.forEach(function (ub) { pushBotToSupabase(ub); });
      recordAudit('EDIT', updatedBots[0] || null, 'Renamed folder "' + oldClean + '" to "' + newClean + '"');
      showToast('Renamed folder to "' + newClean + '"');
      return true;
    }

    function formatColSummaryValue(cm, totalRows) {

    function groupReportItemsByDay(items, forceEth) {

          map[key].ethDmy = it.ethDmy || formatEthiopianDate(dObj2, 'dmy', state && state.lang);
          map[key].ethNamed = it.ethNamed || formatEthiopianDate(dObj2, 'eth_named', state && state.lang);
        }
        var g = map[key];
        g.rowCount++;
        g.quantitySum += (it.quantity || 0);
        g.totalInvoiced += it.totalAmount;
        g.totalPaid += it.paidAmount;
        g.totalRemaining += it.remainingBalance;
        (it.allCols || []).forEach(function (ac) {

            if (ac.display && ac.display !== '—') g.colLatest[ck] = ac.display;

        });
      });
      return Object.keys(map).sort().reverse().map(function (k) { return map[k]; });
    }

    function calculateLiveReportSummary(period, folderFilter, statusFilter, search, botFilterId) {
      var per = period || 'all';
      var folders = getAllFolders();
      var fld = (folderFilter && folderFilter !== 'all') ? folderFilter : (folders[0] || 'General');
      var stF = statusFilter || 'all';
      var q = (search || '').trim().toLowerCase();
      var allItems = buildReportItems(botFilterId);
      var refNow = new Date();
      var todayYmd = getLocalYmd(refNow);
      var nowEc = gregorianToEthiopian(refNow);
      var todayMidnight = new Date(refNow.getFullYear(), refNow.getMonth(), refNow.getDate()).getTime();
      var folderIsEth = isFolderEthiopianCalendar(fld, botFilterId);

      var filtered = allItems.filter(function (it) {
        if (fld && it.folder !== fld) return false;
        if (q) {
          var hitBase = it.customerName.toLowerCase().indexOf(q) !== -1 ||
            it.qualityOrQuantity.toLowerCase().indexOf(q) !== -1 ||
            it.folder.toLowerCase().indexOf(q) !== -1 ||
            it.botName.toLowerCase().indexOf(q) !== -1 ||
            String(it.dmy || '').toLowerCase().indexOf(q) !== -1 ||
            String(it.date || '').toLowerCase().indexOf(q) !== -1 ||
            String(it.ethDmy || '').toLowerCase().indexOf(q) !== -1 ||
            String(it.ethNamed || '').toLowerCase().indexOf(q) !== -1;
          var hitCols = (it.allCols || []).some(function (ac) {
            return String(ac.name || '').toLowerCase().indexOf(q) !== -1 || String(ac.display || '').toLowerCase().indexOf(q) !== -1;
          });
          if (!hitBase && !hitCols) return false;
        }
        if (stF === 'paid' && it.remainingBalance > 0.01) return false;
        if (stF === 'remaining' && it.remainingBalance <= 0.01) return false;
        if (per === 'all') return true;
        var dt = it.parsedMs ? new Date(it.parsedMs) : parseFlexibleDate(it.date, it.rawUpdatedAt, it.dateCol);
        var itemEc = it.ec || gregorianToEthiopian(dt);
        if (per === 'daily') {
          if (it.ymd === todayYmd || getLocalYmd(dt) === todayYmd) return true;
          if (it.isEthiopian || folderIsEth) {
            return itemEc.year === nowEc.year && itemEc.month === nowEc.month && itemEc.day === nowEc.day;
          }
          return false;
        }
        if (per === 'weekly') {
          var dtMid = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
          var dayDiff = (todayMidnight - dtMid) / 86400000;
          return dayDiff >= -1 && dayDiff <= 6;
        }
        if (it.isEthiopian || folderIsEth) {
          return itemEc.month === nowEc.month && itemEc.year === nowEc.year;
        }
        return dt.getMonth() === refNow.getMonth() && dt.getFullYear() === refNow.getFullYear();
      });

      var met = { totalInvoiced: 0, totalPaid: 0, totalRemaining: 0, totalQuantity: 0, numFormulaSum: 0, rowCount: filtered.length, paidCount: 0, balCount: 0 };
      filtered.forEach(function (it) {
        met.totalInvoiced += it.totalAmount;
        met.totalPaid += it.paidAmount;
        met.totalRemaining += it.remainingBalance;
        met.totalQuantity += (it.quantity || 0);
        met.numFormulaSum += (it.numFormulaSum || 0);
        if (it.remainingBalance <= 0.01) met.paidCount++; else met.balCount++;
      });
      met.rate = met.totalInvoiced > 0 ? (met.totalPaid / met.totalInvoiced) * 100 : (filtered.length > 0 ? 100 : 0);

      var colMap = {};
      var colOrder = [];
      var ensureColMeta = function (c) {
        var key = String(c.name || 'Column').trim().toLowerCase();
        if (!colMap[key]) {
          var cleanCurr = (c.currency && c.currency !== 'None' && c.currency !== '$') ? c.currency : '';
          colMap[key] = {
            key: key,
            name: c.name || 'Column',
            type: c.type || 'text',
            isNumeric: (c.type === 'amount' || c.type === 'number' || c.type === 'formula' || !!c.isNumeric),
            isCurrency: Boolean(cleanCurr),
            currency: cleanCurr,
            decimals: c.decimals !== undefined ? c.decimals : (c.type === 'amount' ? 2 : 0),
            thousandSeparator: c.thousandSeparator !== false,
            total: 0,
            count: 0,
            checkedCount: 0,
            latestDisplay: '',
            isBalance: isBalanceColName(c.name),
            isPaid: isPaidColName(c.name)
          };
          colOrder.push(colMap[key]);
        }
        return colMap[key];
      };

      state.bots.forEach(function (b) {
        if (isBotTombstoned(b)) return;
        if (botFilterId && botFilterId !== 'all' && b.id !== botFilterId) return;
        if (fld && (b.folder || 'General') !== fld) return;
        (b.columns || []).forEach(function (c) { ensureColMeta(c); });
      });

      filtered.forEach(function (it) {
        (it.allCols || []).forEach(function (ac) {
          var m = ensureColMeta(ac);
          if (ac.isNumeric) {
            m.isNumeric = true;
            m.total += (Number(ac.numeric) || 0);
            if (ac.isCurrency) {
              m.isCurrency = true;
              if (ac.currency) m.currency = ac.currency;
            }
          }
          if (ac.checked) m.checkedCount++;
          if (ac.hasValue) {
            m.count++;
            if (ac.display && ac.display !== '—') m.latestDisplay = ac.display;
          }
        });
      });

      var columnSummaries = colOrder.map(function (cm) {
        cm.summaryValue = formatColSummaryValue(cm, filtered.length);
        return cm;
      });

      var folderBots = state.bots.filter(function (b) { return !isBotTombstoned(b) && (b.folder || 'General') === fld; });
      var tableSummaries = folderBots.map(function (fb) {
        var tItems = filtered.filter(function (it) { return it.botId === fb.id; });
        var tCols = {};
        columnSummaries.forEach(function (cm) {
          var tColObj = {
            key: cm.key,
            name: cm.name,
            type: cm.type,
            isNumeric: cm.isNumeric,
            isCurrency: cm.isCurrency,
            currency: cm.currency,
            decimals: cm.decimals,
            thousandSeparator: cm.thousandSeparator,
            total: 0,
            count: 0,
            checkedCount: 0,
            latestDisplay: ''
          };
          tItems.forEach(function (it) {
            (it.allCols || []).forEach(function (ac) {
              if (String(ac.name || '').trim().toLowerCase() === cm.key) {
                if (ac.isNumeric) tColObj.total += (Number(ac.numeric) || 0);
                if (ac.checked) tColObj.checkedCount++;
                if (ac.hasValue) {
                  tColObj.count++;
                  if (ac.display && ac.display !== '—') tColObj.latestDisplay = ac.display;
                }
              }
            });

          tColObj.summaryValue = formatColSummaryValue(tColObj, tItems.length);
          tCols[cm.key] = tColObj;
        });
        return {
          botId: fb.id,
          botName: fb.name,
          rowCount: tItems.length,
          colCount: (fb.columns || []).length,
          colMap: tCols
        };
      });

      return {
        period: per,
        folder: fld,
        refNow: refNow,
        todayYmd: todayYmd,
        nowEc: nowEc,
        isEthiopianCal: folderIsEth,
        todayDisplayLabel: formatReportDateChip(refNow, folderIsEth),
        monthDisplayLabel: formatReportMonthLabel(refNow, folderIsEth, state && state.lang),
        folders: folders,
        filtered: filtered,
        met: met,
        tableSummaries: tableSummaries,
        columnSummaries: columnSummaries
      };
    }

      return match ? match[1] : '';

      params.set('sb_url', url.trim());
      params.set('sb_key', key.trim());
      if (email) params.set('sb_email', email.trim());
      return base + '?' + params.toString();

    // Excel (.xlsx, .xls, .csv, .tsv) Parser + Pure-JS CSV Fallback
    function parseCsvTextFallback(text, delimiter) {
      var rows = [];
      var curRow = [];
      var curCell = '';
      var inQuotes = false;
      var sep = delimiter || (text.indexOf('\t') !== -1 && text.indexOf(',') === -1 ? '\t' : ',');
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        var next = text[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') { curCell += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else curCell += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === sep) { curRow.push(curCell.trim()); curCell = ''; }
          else if (ch === '\r' && next === '\n') { curRow.push(curCell.trim()); rows.push(curRow); curRow = []; curCell = ''; i++; }
          else if (ch === '\n' || ch === '\r') { curRow.push(curCell.trim()); rows.push(curRow); curRow = []; curCell = ''; }
          else curCell += ch;
        }
      }
      if (curCell.length > 0 || curRow.length > 0) {
        curRow.push(curCell.trim());
        rows.push(curRow);
      }
      return rows.filter(function (r) { return r.some(function (c) { return c !== ''; }); });
    }

    function inferExcelColType(headerName, sampleValues) {
      var h = String(headerName || '').toLowerCase();
      if (h.indexOf('date') !== -1 || h.indexOf('time') !== -1 || h.indexOf('day') !== -1) return 'date';
      if (h.indexOf('paid') !== -1 || h.indexOf('check') !== -1 || h.indexOf('done') !== -1 || h.indexOf('active') !== -1) {
        var boolHits = sampleValues.filter(function (v) { return typeof v === 'boolean' || /^(true|false|yes|no)$/i.test(String(v).trim()); }).length;
        if (boolHits > 0 && boolHits >= Math.ceil(sampleValues.length / 2)) return 'checkbox';
      }
      var nonEmpty = sampleValues.filter(function (v) { return v !== '' && v !== null && v !== undefined; });
      if (nonEmpty.length === 0) return (h.indexOf('amount') !== -1 || h.indexOf('price') !== -1 || h.indexOf('total') !== -1 || h.indexOf('balance') !== -1) ? 'amount' : 'text';
      var curHits = 0, numHits = 0, dateHits = 0, boolHits2 = 0;
      nonEmpty.forEach(function (v) {
        if (typeof v === 'boolean' || /^(true|false|yes|no)$/i.test(String(v).trim())) boolHits2++;
        else if (v instanceof Date) dateHits++;
        else {
          var s = String(v).trim();
          if (/^[$€£¥₹]/.test(s)) curHits++;
          if (/^-?[$€£¥₹]?\s*[0-9,]+(\.[0-9]+)?$/.test(s)) numHits++;
          else if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(s)) dateHits++;
        }
      });
      if (boolHits2 === nonEmpty.length) return 'checkbox';
      if (dateHits >= Math.ceil(nonEmpty.length * 0.7)) return 'date';
      if (numHits >= Math.ceil(nonEmpty.length * 0.7)) {
        if (curHits > 0 || /amount|price|cost|total|paid|balance|revenue|fee|usd|eur/i.test(h)) return 'amount';
        return 'number';
      }
      return 'text';
    }

    function parseExcelArrayBufferToSheets(fileName, arrayBuf, rawTextFallback) {
      var sheets = [];
      var lower = String(fileName || '').toLowerCase();
      if (window.XLSX && /\.(xlsx|xls|ods|xlsm|xlsb)$/i.test(lower)) {
        var wb = window.XLSX.read(new Uint8Array(arrayBuf), { type: 'array', cellDates: true });
        wb.SheetNames.forEach(function (sname) {
          var ws = wb.Sheets[sname];
          var aoa = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
          aoa = aoa.filter(function (r) { return Array.isArray(r) && r.some(function (c) { return c !== '' && c !== null && c !== undefined; }); });
          if (aoa.length > 0) sheets.push({ name: sname, aoa: aoa, selected: true });
        });
      } else if (window.XLSX && (lower.endsWith('.csv') || lower.endsWith('.tsv'))) {
        try {
          var wbCsv = window.XLSX.read(rawTextFallback, { type: 'string' });
          var firstName = wbCsv.SheetNames[0] || fileName.replace(/\.(csv|tsv)$/i, '');
          var aoaCsv = window.XLSX.utils.sheet_to_json(wbCsv.Sheets[firstName], { header: 1, defval: '' });
          if (aoaCsv.length > 0) sheets.push({ name: firstName, aoa: aoaCsv, selected: true });
        } catch (eCsv) {}
      }
      if (sheets.length === 0 && rawTextFallback) {
        var parsedSmart = parseClipboardOrFileTextToMatrix(rawTextFallback, 'auto');
        if (parsedSmart.matrix && parsedSmart.matrix.length > 0) {
          sheets.push({ name: fileName.replace(/\.[^.]+$/, '') || 'Sheet1', aoa: parsedSmart.matrix, selected: true });
        }
      }
      return sheets.map(function (sh) {
        var headers = (sh.aoa[0] || []).map(function (h, idx) {
          var t = String(h === undefined || h === null ? '' : h).trim();
          return t || ('Column ' + (idx + 1));
        });
        var body = sh.aoa.slice(1).map(function (rowArr) {
          return headers.map(function (_, idx) {
            var val = rowArr[idx];
            if (val instanceof Date && !isNaN(val.getTime())) return val.toISOString().slice(0, 16).replace('T', ' ');
            return val === undefined || val === null ? '' : val;
          });
        });
        var colTypes = headers.map(function (h, idx) {
          var samples = body.slice(0, 20).map(function (r) { return r[idx]; });
          return inferExcelColType(h, samples);
        });
        return { name: sh.name, headers: headers, colTypes: colTypes, rows: body, selected: true };
      });
    }

        document.getElementById('bk-restore-file').onchange = function (e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          var r = new FileReader();
          r.onload = function (ev) {
            try {
              var parsed = JSON.parse(ev.target.result);
              var arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.bots) ? parsed.bots : []);
              if (!arr.length) throw new Error('No bot tables found inside JSON backup.');
              m.pendingRestoreBots = arr;
              m.pendingRestoreName = file.name;
              m.statusType = 'success'; m.statusMsg = 'Parsed backup "' + file.name + '" with ' + arr.length + ' table(s). Choose restore mode below.';
            } catch (err) {
              m.statusType = 'error'; m.statusMsg = 'Invalid JSON backup: ' + (err && err.message ? err.message : 'Parse error');
            }
            renderBackupModal(m);
          };
          r.readAsText(file);
        };
        var rmBtn = document.getElementById('bk-json-restore-missing');
        if (rmBtn) rmBtn.onclick = function () {
          var cur = {}; state.bots.forEach(function (b) { cur[b.id] = true; });
          var n = 0;
          (m.pendingRestoreBots || []).forEach(function (pb) {
            if (pb && pb.id && !cur[pb.id]) { restoreBotFromSnapshot(pb, pb.folder || 'General', 'JSON Backup restore missing'); n++; }
          });
          m.pendingRestoreBots = null;
          m.statusType = 'success'; m.statusMsg = 'Restored ' + n + ' missing bot file(s) from JSON backup.';
          renderApp(); renderBackupModal(m);
        };
        var raBtn = document.getElementById('bk-json-restore-all');
        if (raBtn) raBtn.onclick = function () {
          var n = 0;
          (m.pendingRestoreBots || []).forEach(function (pb) {
            if (pb && pb.id) { restoreBotFromSnapshot(pb, pb.folder || 'General', 'JSON Backup full restore'); n++; }
          });
          m.pendingRestoreBots = null;
          m.statusType = 'success'; m.statusMsg = 'Restored/merged ' + n + ' bot file(s) from JSON backup.';
          renderApp(); renderBackupModal(m);
        };
        var rcBtn = document.getElementById('bk-json-cancel');
        if (rcBtn) rcBtn.onclick = function () { m.pendingRestoreBots = null; renderBackupModal(m); };

        document.querySelectorAll('.bk-view-hist').forEach(function (b) {
          b.onclick = function () { m.folderFilter = b.getAttribute('data-fn'); m.tab = 'history'; renderBackupModal(m); };
        });
        document.querySelectorAll('.bk-rest-fld').forEach(function (b) {
          b.onclick = function () {
            var fn = b.getAttribute('data-fn');
            var c = restoreFolderAllMissing(fn);
            m.statusType = 'success'; m.statusMsg = 'Restored ' + c + ' missing/deleted file(s) into folder "' + fn + '".';
            renderBackupModal(m);
          };
        });
        document.querySelectorAll('.bk-del-fld').forEach(function (b) {
          b.onclick = async function () {
            var fn = b.getAttribute('data-fn');
            var c = await deleteFolderWithBackup(fn);
            m.statusType = 'success'; m.statusMsg = 'Safely deleted folder "' + fn + '" (' + c + ' file(s) backed up to Deleted Bin for instant restore).';
            renderBackupModal(m);
          };
        });
        document.querySelectorAll('.bk-rest-item').forEach(function (b) {
          b.onclick = function () {
            var bid = b.getAttribute('data-bid');
            var fn = b.getAttribute('data-fn');
            var dv = state.deletedVault.find(function (d) { return d.botId === bid; });
            var sn = dv ? dv.botSnapshot : (state.folderHistory.find(function (h) { return h.botId === bid && h.botSnapshot; }) || {}).botSnapshot;
            if (sn) {
              restoreBotFromSnapshot(sn, fn, 'Restored missing file');
              m.statusType = 'success'; m.statusMsg = 'Restored "' + sn.name + '" back into folder "' + fn + '".';
              renderApp(); renderBackupModal(m);
            }
          };
        });
        document.querySelectorAll('.bk-file-hist').forEach(function (b) {
          b.onclick = function () { openModal('file_history', { botId: b.getAttribute('data-bid') }); };
        });
        document.querySelectorAll('.bk-revert-item').forEach(function (b) {
          b.onclick = function () {
            var sid = b.getAttribute('data-snap');
            var snap = state.folderHistory.find(function (h) { return h.id === sid; });
            if (snap && snap.botSnapshot) {
              restoreBotFromSnapshot(snap.botSnapshot, snap.folder, 'Reverted changed file to backup (' + formatHistoryAge(snap.timestamp) + ')');
              m.statusType = 'success'; m.statusMsg = 'Reverted "' + snap.botName + '" to backup from ' + formatHistoryAge(snap.timestamp) + '.';
              renderApp(); renderBackupModal(m);
            }
          };
        });
      } else if (m.tab === 'history') {
        document.getElementById('fh-folder').onchange = function (e) { m.folderFilter = e.target.value; renderBackupModal(m); };
        document.getElementById('fh-win').onchange = function (e) { m.timeWindow = e.target.value; renderBackupModal(m); };
        document.getElementById('fh-type').onchange = function (e) { m.changeFilter = e.target.value; renderBackupModal(m); };
        document.querySelectorAll('.fh-open-file-hist').forEach(function (b) {
          b.onclick = function () { openModal('file_history', { botId: b.getAttribute('data-bid') }); };
        });
        document.querySelectorAll('.fh-restore-btn').forEach(function (b) {
          b.onclick = function () {
            var sid = b.getAttribute('data-snap');
            var snap = state.folderHistory.find(function (h) { return h.id === sid; });
            if (snap && snap.botSnapshot) {
              restoreBotFromSnapshot(snap.botSnapshot, snap.folder || 'General', 'Restored version from ' + formatHistoryAge(snap.timestamp));
              m.statusType = 'success'; m.statusMsg = 'Restored "' + snap.botName + '" (' + formatHistoryAge(snap.timestamp) + ') into folder "' + (snap.folder || 'General') + '".';
              renderApp(); renderBackupModal(m);

        document.querySelectorAll('.trv-rest-btn').forEach(function (b) {
          b.onclick = function () {
            var did = b.getAttribute('data-did');
            var dv = state.deletedVault.find(function (d) { return d.id === did; });

              restoreBotFromSnapshot(dv.botSnapshot, dv.folder || 'General', 'Restored deleted file (' + formatHistoryAge(dv.deletedAt) + ')');
              m.statusType = 'success'; m.statusMsg = 'Restored "' + dv.botName + '" into folder "' + (dv.folder || 'General') + '".';
              renderApp(); renderBackupModal(m);
            }
          };
        });
        document.querySelectorAll('.trv-purge-btn').forEach(function (b) {
          b.onclick = function () {
            var did = b.getAttribute('data-did');
            state.deletedVault = state.deletedVault.filter(function (d) { return d.id !== did; });
            saveVaultState();
            m.statusType = 'success'; m.statusMsg = 'Permanently removed item from Deleted Bin.';
            renderBackupModal(m);
          };
        });
      }
    }

    // Dedicated Per-File Version History Modal (Minutes, Days, 3+ Months + Preview & Restore / Copy)
    function renderFileHistoryModal(m) {
      ensureInitialFolderManifest();
      var fileChoices = {};
      state.bots.forEach(function (b) {
        fileChoices[b.id] = { id: b.id, name: b.name, folder: b.folder || 'General', deleted: false };
      });
      state.folderHistory.forEach(function (h) {
        if (h.botId && !fileChoices[h.botId]) {
          fileChoices[h.botId] = { id: h.botId, name: h.botName || h.botId, folder: h.folder || 'General', deleted: true };
        }
      });
      state.deletedVault.forEach(function (d) {
        if (d.botId && !fileChoices[d.botId]) {
          fileChoices[d.botId] = { id: d.botId, name: d.botName || d.botId, folder: d.folder || 'General', deleted: true };
        }
      });
      var choiceArr = Object.keys(fileChoices).map(function (k) { return fileChoices[k]; });
      if (!m.botId && choiceArr.length) m.botId = choiceArr[0].id;
      if (!m.timeWindow) m.timeWindow = 'all';
      if (!m.changeFilter) m.changeFilter = 'ALL';

      var activeLiveBot = state.bots.find(function (b) { return b.id === m.botId; }) || null;
      var meta = fileChoices[m.botId] || { id: m.botId || '', name: 'Selected File', folder: 'General', deleted: !activeLiveBot };

      var versions = state.folderHistory.filter(function (h) {
        if (h.botId !== m.botId) return false;
        if (!matchesHistoryWindow(h.timestamp, m.timeWindow)) return false;
        if (m.changeFilter !== 'ALL' && h.changeType !== m.changeFilter) return false;
        return true;
      });
      var totalVersionsForFile = state.folderHistory.filter(function (h) { return h.botId === m.botId; }).length;

      var msgNote = m.statusMsg ? '<div style="padding:10px 12px;border-radius:10px;font-size:12px;background:' + (m.statusType === 'error' ? '#FEF2F2;color:#991B1B;border:1px solid #FECACA;' : '#ECFDF5;color:#065F46;border:1px solid #A7F3D0;') + '">' + esc(m.statusMsg) + '</div>' : '';

      var html = '<div class="modal-backdrop" id="m-bg"><div class="modal-card wide" id="m-card">' +
        '<header class="modal-header"><div style="display:flex;align-items:center;gap:10px;">' + icon('history', 21) + '<div><h2 style="font-size:16px;font-weight:700;">File Version History &middot; ' + esc(meta.name) + '</h2><div style="font-size:11px;color:#BFDBFE;">Folder: ' + esc(meta.folder) + ' &middot; Minutes, Days &amp; 3+ Months Timeline</div></div></div>' +
          '<button class="icon-btn" id="fvh-close">' + icon('close', 18) + '</button></header>' +
        '<div class="modal-body" style="display:flex;flex-direction:column;gap:12px;">' + msgNote +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#F8FAFC;border:1px solid #E2E8F0;padding:10px;border-radius:10px;">' +
            '<div style="flex:1;min-width:190px;">' +
              '<label class="field-label" style="margin-bottom:3px;">Select File</label>' +
              '<select id="fvh-file-sel" class="form-select">' +
                choiceArr.map(function (fc) {
                  return '<option value="' + esc(fc.id) + '"' + (fc.id === m.botId ? ' selected' : '') + '>' + esc(fc.name) + ' (' + esc(fc.folder) + (fc.deleted ? ' - DELETED' : '') + ')</option>';
                }).join('') +
              '</select>' +
            '</div>' +
            '<div style="display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;padding-top:16px;">' +
              (activeLiveBot ? '<button type="button" id="fvh-save-cp" class="btn btn-primary" style="font-size:11.5px;padding:7px 11px;">' + icon('plus', 14) + '<span>Save Version Checkpoint</span></button>' : '') +
              '<button type="button" id="fvh-open-vault" class="btn btn-outline" style="font-size:11.5px;padding:7px 11px;">' + icon('folder', 14) + '<span>All Folders Backup</span></button>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
            '<select id="fvh-win" class="form-select" style="flex:1;min-width:165px;">' +
              '<option value="all"' + (m.timeWindow === 'all' ? ' selected' : '') + '>All Time (Min / Days / 3+ Months)</option>' +
              '<option value="minutes"' + (m.timeWindow === 'minutes' ? ' selected' : '') + '>Minutes (<= 60 mins)</option>' +
              '<option value="hours24"' + (m.timeWindow === 'hours24' ? ' selected' : '') + '>Hours / Today (<= 24h)</option>' +
              '<option value="days7"' + (m.timeWindow === 'days7' ? ' selected' : '') + '>Last 7 Days</option>' +
              '<option value="days30"' + (m.timeWindow === 'days30' ? ' selected' : '') + '>Last 30 Days (1 Month)</option>' +
              '<option value="months3"' + (m.timeWindow === 'months3' ? ' selected' : '') + '>Up to 3 Months (<= 90 Days)</option>' +
              '<option value="above3m"' + (m.timeWindow === 'above3m' ? ' selected' : '') + '>3 Months &amp; Above (90+ Days)</option>' +
            '</select>' +
            '<select id="fvh-type" class="form-select" style="flex:1;min-width:150px;">' +
              '<option value="ALL"' + (m.changeFilter === 'ALL' ? ' selected' : '') + '>All Version Events (' + totalVersionsForFile + ')</option>' +
              '<option value="MODIFIED"' + (m.changeFilter === 'MODIFIED' ? ' selected' : '') + '>Edited / Changed</option>' +
              '<option value="COLUMN_ADDED"' + (m.changeFilter === 'COLUMN_ADDED' ? ' selected' : '') + '>Column Added</option>' +
              '<option value="BACKUP"' + (m.changeFilter === 'BACKUP' ? ' selected' : '') + '>Saved Checkpoints &amp; Backups</option>' +
              '<option value="IMPORT_EXCEL"' + (m.changeFilter === 'IMPORT_EXCEL' ? ' selected' : '') + '>Excel Imports</option>' +
              '<option value="DELETED"' + (m.changeFilter === 'DELETED' ? ' selected' : '') + '>Deleted</option>' +
              '<option value="RESTORED"' + (m.changeFilter === 'RESTORED' ? ' selected' : '') + '>Restored</option>' +
            '</select>' +
          '</div>' +
          '<div style="font-size:11.5px;color:#475569;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">' +
            '<span>Status: <strong style="color:' + (activeLiveBot ? '#15803D' : '#B91C1C') + ';">' + (activeLiveBot ? ('ACTIVE (' + activeLiveBot.rows.length + ' rows, ' + activeLiveBot.columns.length + ' cols)') : 'DELETED / MISSING FROM FOLDER') + '</strong></span>' +
            '<span>Showing <strong>' + versions.length + '</strong> version(s)</span>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;">' +
            (versions.length === 0
              ? '<div style="text-align:center;padding:28px;color:#94A3B8;font-size:12.5px;">No versions saved for this file in the selected filter yet. Click "Save Version Checkpoint" or make an edit.</div>'
              : versions.map(function (h, idx) {
                  var vNum = versions.length - idx;
                  var acCls = (h.changeType === 'DELETED' || h.changeType === 'FOLDER_DELETED') ? 'act-delete'
                    : (h.changeType === 'MODIFIED' || h.changeType === 'COLUMN_ADDED') ? 'act-edit'
                    : (h.changeType === 'RESTORED' || h.changeType === 'BACKUP') ? 'act-transmit'
                    : 'act-add';
                  var isPreviewing = m.previewSnapId === h.id && h.botSnapshot;
                  var prevHtml = '';
                  if (isPreviewing) {
                    var sb = h.botSnapshot;
                    prevHtml = '<div style="margin-top:8px;border:1px solid #CBD5E1;border-radius:8px;overflow-x:auto;background:#F8FAFC;">' +
                      '<table style="width:100%;border-collapse:collapse;font-size:11px;">' +
                        '<thead><tr style="background:#EFF6FF;">' +
                          (sb.columns || []).map(function (c) { return '<th style="padding:5px 8px;text-align:left;border-bottom:1px solid #BFDBFE;white-space:nowrap;">' + esc(c.name) + ' <span style="opacity:0.6;">(' + esc(c.type) + ')</span></th>'; }).join('') +
                        '</tr></thead>' +
                        '<tbody>' +
                          ((sb.rows || []).slice(0, 4).map(function (r) {
                            return '<tr style="border-bottom:1px solid #E2E8F0;background:#fff;">' +
                              (sb.columns || []).map(function (c) { return '<td style="padding:4px 8px;white-space:nowrap;">' + esc(formatCell(r[c.id], c)) + '</td>'; }).join('') +
                            '</tr>';
                          }).join('') || '<tr><td colspan="' + Math.max(1, (sb.columns || []).length) + '" style="padding:8px;text-align:center;color:#94A3B8;">Empty table (0 rows)</td></tr>') +
                        '</tbody>' +
                      '</table>' +
                    '</div>';
                  }
                  return '<div style="padding:10px 12px;border:1px solid ' + (idx === 0 ? '#93C5FD;background:#F8FAFF' : '#E2E8F0;background:#fff') + ';border-radius:10px;">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">' +
                      '<div style="min-width:0;flex:1;">' +
                        '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
                          '<span class="pill-badge" style="background:#0D47A1;color:#fff;font-size:10px;">v' + vNum + (idx === 0 ? ' LATEST' : '') + '</span>' +
                          '<span class="act-badge ' + acCls + '">' + esc(h.changeType) + '</span>' +
                          '<span class="mono" style="font-size:11.5px;color:#0D47A1;font-weight:700;">' + formatHistoryAge(h.timestamp) + '</span>' +
                        '</div>' +
                        '<div style="font-size:12px;color:#1E293B;font-weight:600;margin-top:3px;">' + esc(h.diffSummary) + '</div>' +
                        '<div style="font-size:10.5px;color:#64748B;margin-top:2px;">By ' + esc(h.actor) + ' &middot; ' + new Date(h.timestamp).toLocaleString() + ' &middot; ' + h.rowCount + ' rows &middot; ' + h.colCount + ' cols</div>' +
                      '</div>' +
                      '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
                        (h.botSnapshot ? '<button type="button" class="btn btn-outline fvh-prev-btn" data-snap="' + esc(h.id) + '" style="padding:5px 8px;font-size:11px;">' + (isPreviewing ? 'Hide Preview' : 'Preview') + '</button>' : '') +
                        (h.botSnapshot ? '<button type="button" class="btn btn-green fvh-rest-btn" data-snap="' + esc(h.id) + '" style="padding:5px 9px;font-size:11px;">' + icon('restore', 12) + '<span>Restore</span></button>' : '') +
                        (h.botSnapshot ? '<button type="button" class="btn btn-outline fvh-copy-btn" data-snap="' + esc(h.id) + '" data-vnum="' + vNum + '" style="padding:5px 9px;font-size:11px;">' + icon('copy', 12) + '<span>Save as Copy</span></button>' : '') +
                      '</div>' +
                    '</div>' +
                    prevHtml +
                  '</div>';

          '</div>' +
        '</div></div></div>';

      document.getElementById('modal-root').innerHTML = html;

      document.getElementById('m-card').onclick = function (e) { e.stopPropagation(); };
      document.getElementById('fvh-close').onclick = closeModal;
      document.getElementById('fvh-file-sel').onchange = function (e) { m.botId = e.target.value; m.previewSnapId = null; m.statusMsg = null; renderFileHistoryModal(m); };
      document.getElementById('fvh-win').onchange = function (e) { m.timeWindow = e.target.value; renderFileHistoryModal(m); };
      document.getElementById('fvh-type').onchange = function (e) { m.changeFilter = e.target.value; renderFileHistoryModal(m); };
      document.getElementById('fvh-open-vault').onclick = function () { openModal('backup', { tab: 'vault', folderFilter: meta.folder || 'all' }); };

      var cpBtn = document.getElementById('fvh-save-cp');
      if (cpBtn && activeLiveBot) {
        cpBtn.onclick = function () {
          recordFolderSnapshot(activeLiveBot, 'BACKUP', 'Manual file version checkpoint (' + activeLiveBot.rows.length + ' rows, ' + activeLiveBot.columns.length + ' cols)', true);
          m.statusType = 'success'; m.statusMsg = 'Saved new version checkpoint for "' + activeLiveBot.name + '".';
          renderFileHistoryModal(m);
        };
      }
      document.querySelectorAll('.fvh-prev-btn').forEach(function (b) {
        b.onclick = function () {
          var sid = b.getAttribute('data-snap');
          m.previewSnapId = m.previewSnapId === sid ? null : sid;
          renderFileHistoryModal(m);
        };
      });
      document.querySelectorAll('.fvh-rest-btn').forEach(function (b) {
        b.onclick = function () {
          var sid = b.getAttribute('data-snap');
          var snap = state.folderHistory.find(function (h) { return h.id === sid; });
          if (snap && snap.botSnapshot) {
            if (activeLiveBot) recordFolderSnapshot(activeLiveBot, 'BACKUP', 'Auto-saved before version restore', true);
            restoreBotFromSnapshot(snap.botSnapshot, snap.folder || meta.folder || 'General', 'Restored file version from ' + formatHistoryAge(snap.timestamp));
            m.statusType = 'success'; m.statusMsg = 'Restored "' + snap.botName + '" to version from ' + formatHistoryAge(snap.timestamp) + '!';
            renderApp(); renderFileHistoryModal(m);
          }
        };
      });
      document.querySelectorAll('.fvh-copy-btn').forEach(function (b) {
        b.onclick = function () {
          if (!guardWriteAction('Restore Version as Copy')) return;
          var sid = b.getAttribute('data-snap');
          var vnum = b.getAttribute('data-vnum');
          var snap = state.folderHistory.find(function (h) { return h.id === sid; });
          if (snap && snap.botSnapshot) {
            var copy = JSON.parse(JSON.stringify(snap.botSnapshot));
            copy.id = 'bot_' + Date.now();
            copy.name = snap.botName + ' (v' + vnum + ' Copy)';
            copy.createdBy = getCurrentActor();
            copy.lastEditedBy = getCurrentActor();
            copy.updatedAt = new Date().toISOString();
            state.bots.unshift(copy);
            saveBotsLocal();
            recordFolderSnapshot(copy, 'CREATED', 'Saved copy from v' + vnum + ' of "' + snap.botName + '"', true);
            recordAudit('ADD', copy, 'Restored v' + vnum + ' of "' + snap.botName + '" as new file "' + copy.name + '"', { source: 'File Version History' });
            pushBotToSupabase(copy);
            m.botId = copy.id;
            m.statusType = 'success'; m.statusMsg = 'Created new file "' + copy.name + '" from v' + vnum + '!';
            renderApp(); renderFileHistoryModal(m);
          }
        };
      });
    }

    function exportStandaloneHtml() {
      var snapshot = '<!doctype html>\n' + document.documentElement.outerHTML;
      downloadBlob(snapshot, 'TableBot_Standalone_' + new Date().toISOString().slice(0, 10) + '.html', 'text/html;charset=utf-8');
      showToast('Exported Standalone Single-File HTML');
    }

    function renderDashboardActivityStripOnly() {
      var curStrip = document.getElementById('dash-audit-strip');
      if (!curStrip || !state.adminConfig.showDashboardActivity || state.activeBotId) return;
      var activeUsers = (state.workspaceUsers || []).filter(function (u) {
        return u && u.id && String(u.id).toLowerCase() !== 'abdulfeta' &&
          (u.source !== 'Security' || u.blocked || isUserOnlineNow(u.lastSeen));
      });
      if (activeUsers.length === 0 && (!state.auditLogs || state.auditLogs.length === 0)) return;
      renderDashboard();
    }

    // Immediate Sync Listeners: Browser Open, Tab Switch, Window Focus, Online, Multi-Tab Storage & BroadcastChannel
    window.addEventListener('focus', function () {
      pullSharedSecurityState('focus');
      pushActivityHeartbeat(1);
      if (state.adminConfig.autoSyncOnOpen) syncAllNow('focus');
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden || document.visibilityState === 'visible') {
        markAppOpenedNow(null, 'resume');
        pullSharedSecurityState('visibility');
        pushActivityHeartbeat(1, 'OPEN');
        if (state.adminConfig.autoSyncOnOpen) syncAllNow('visibility');
      }
    });
    window.addEventListener('pageshow', function () {
      markAppOpenedNow(null, 'resume');
      pullSharedSecurityState('pageshow');
      pushActivityHeartbeat(1, 'OPEN');
      if (state.adminConfig.autoSyncOnOpen) syncAllNow('pageshow');
    });
    window.addEventListener('online', function () {
      pullSharedSecurityState('online');
      pushActivityHeartbeat(1);
      syncAllNow('online');
    });
    window.addEventListener('storage', function (e) {
      if (e.key === STORAGE_BOTS || e.key === STORAGE_AUDIT_LOGS || e.key === STORAGE_USERS || e.key === STORAGE_FOLDER_HISTORY || e.key === STORAGE_DELETED_VAULT || e.key === STORAGE_ADMIN_CFG || e.key === STORAGE_ACCESS_CODE || e.key === STORAGE_CYBER_CODE || e.key === STORAGE_CUSTOM_FOLDERS || e.key === STORAGE_DELETED_TOMBSTONES) {
        state.deletedTombstones = loadDeletedTombstonesRaw();
        state.customFolders = loadJsonStorage(STORAGE_CUSTOM_FOLDERS, state.customFolders);
        state.bots = loadBots();
        state.auditLogs = loadJsonStorage(STORAGE_AUDIT_LOGS, state.auditLogs);
        state.workspaceUsers = loadJsonStorage(STORAGE_USERS, state.workspaceUsers);
        state.folderHistory = loadJsonStorage(STORAGE_FOLDER_HISTORY, state.folderHistory);
        state.deletedVault = loadJsonStorage(STORAGE_DELETED_VAULT, state.deletedVault);
        state.adminConfig = Object.assign({}, DEFAULT_ADMIN_CFG, loadJsonStorage(STORAGE_ADMIN_CFG, {}));
        purgeTombstonedDataFromState();
        if (isCurrentUserRevoked()) forceLogoutCurrentUser('Your account was blocked or logged out by Admin. App data is hidden.');
        renderApp(true);
      }
    });
    if (syncChannel) {
      syncChannel.onmessage = function (ev) {
        var msg = ev && ev.data ? ev.data : {};
        if (msg.type === 'SECURITY_SYNC' && msg.payload) {
          applySharedSecurityState(msg.payload, { from: 'broadcast' });
          return;
        }
        state.deletedTombstones = loadDeletedTombstonesRaw();
        state.customFolders = loadJsonStorage(STORAGE_CUSTOM_FOLDERS, state.customFolders);
        state.bots = loadBots();
        state.auditLogs = loadJsonStorage(STORAGE_AUDIT_LOGS, state.auditLogs);
        state.workspaceUsers = loadJsonStorage(STORAGE_USERS, state.workspaceUsers);
        state.folderHistory = loadJsonStorage(STORAGE_FOLDER_HISTORY, state.folderHistory);
        state.deletedVault = loadJsonStorage(STORAGE_DELETED_VAULT, state.deletedVault);
        state.adminConfig = Object.assign({}, DEFAULT_ADMIN_CFG, loadJsonStorage(STORAGE_ADMIN_CFG, {}));
        purgeTombstonedDataFromState();
        if (state.adminConfig.cyberSecurityCode) {
          try { localStorage.setItem(STORAGE_CYBER_CODE, normalizeSecurityCode(state.adminConfig.cyberSecurityCode)); } catch (e) {}
        }
        if (state.adminConfig.accessCode) {
          try { localStorage.setItem(STORAGE_ACCESS_CODE, normalizeSecurityCode(state.adminConfig.accessCode)); } catch (e) {}
        }
        if (msg.type === 'FORCE_LOGOUT' && (isCurrentUserRevoked() || matchesActorIdentity(msg.target, getCurrentActor()))) {
          forceLogoutCurrentUser(msg.reason || 'Your session was logged out by Admin. App data is hidden.');
        } else if (isCurrentUserRevoked()) {
          forceLogoutCurrentUser('Your account is blocked/logged out by Admin.');
        }
        renderApp(true);
      };
    }

    // Close floating menus on backdrop clicks
    document.addEventListener('click', function () {
      var dirty = false;
      if (state.activeCardMenuId) { state.activeCardMenuId = null; dirty = true; }
      if (state.activeFolderMenuId) { state.activeFolderMenuId = null; dirty = true; }
      if (state.showMoreMenu) { state.showMoreMenu = false; dirty = true; }
      if (dirty) renderApp();
    });

    function refreshWelcomeDateIfNeeded() {
      if (cleanupExpiredBlocks()) {
        renderApp(true);
        if (state.modal && state.modal.type === 'cyber_control') renderCyberControlModal(state.modal);
        else if (state.modal && state.modal.type === 'admin') renderAdminModal(state.modal);
      }
      var curYmd = getLocalYmd(new Date());
      if (state.lastRenderedYmd && state.lastRenderedYmd !== curYmd) {
        state.previewDayOffset = 0;
        state.lastRenderedYmd = curYmd;
        if (!state.activeBotId) renderDashboard();
        if (state.modal && state.modal.type === 'reports') renderReportsModal(state.modal);
        return;
      }
      var badgeEl = document.getElementById('hero-date-badge');
      var headEl = document.getElementById('hero-welcome-headline');
      var nextEl = document.getElementById('hero-next-day');
      if (!badgeEl || !headEl) return;
      var info = getWelcomeDayInfo(state.lang, state.previewDayOffset);
      if (badgeEl.textContent !== info.dateBadge) badgeEl.textContent = info.dateBadge;
      if (headEl.textContent !== info.headline) headEl.textContent = info.headline;
      if (nextEl && nextEl.textContent !== info.nextDayText) nextEl.textContent = info.nextDayText;
    }

    function startLiveDateWatcher() {
      setInterval(refreshWelcomeDateIfNeeded, 10000);
    }

    function startActivityHeartbeatLoop() {
      state.lastHeartbeatAt = Date.now();
      setInterval(function () {
        if (!document.hidden) {
          pushActivityHeartbeat(12);
        }
      }, 12000);
    }

    // Boot Application & Trigger Immediate Open-Time Sync
    try {
      if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.ready === 'function') {
        window.Telegram.WebApp.ready();
        if (typeof window.Telegram.WebApp.expand === 'function') window.Telegram.WebApp.expand();
      }
    } catch (e) {}
    markAppOpenedNow(null, 'boot');
    purgeTombstonedDataFromState();
    ensureInitialFolderManifest();
    installFirstTapAudioUnlocker();
    showBrandSplashScreen();
    renderApp();
    startSharedSecurityEvents();
    startTelegramAutoPoll();
    startLiveDateWatcher();
    startActivityHeartbeatLoop();
    if (isAccessUnlocked() && window.location.hash && window.location.hash.indexOf('type=recovery') !== -1 && state.supabaseConfig.isConnected) {
      getSbClient();
      openModal('supabase', { recoveryMode: true, authTab: 'recovery', statusType: 'success', statusMsg: 'Password recovery link detected. Enter your new password below.' });
    }
    pullSharedSecurityState('boot');
    pushActivityHeartbeat(1, 'OPEN');
    pullServerActivityState('boot');
    syncAllNow('boot');
    if (state.auditLogs.length > 0) {
      pushActivityLogToServer(state.auditLogs.slice(0, 30));
    }
  })();
  </script>
</body>
</html>
